  const win = (on, extra = "") => `<span class="w ${on ? "on" : ""} ${extra}" aria-hidden="true"></span>`;
  const item = (id) => D.shop.find((x) => x.id === id);

  /* Süslü pencere: bakkaldan alınan eşyalar burada görünür */
  function windowArt(eq = S.eq, name = S.user?.name, cls = "") {
    const perde = eq.perde && item(eq.perde), saksi = eq.saksi && item(eq.saksi), evcil = eq.evcil && item(eq.evcil);
    const isik = eq.isik || "";
    return `<span class="big-win ${cls} ${isik ? "deco-" + isik : ""}" aria-hidden="true">
      ${perde ? `<i class="curtain l" style="background:${perde.color}"></i><i class="curtain r" style="background:${perde.color}"></i>` : ""}
      <span class="sil">${initial(name)}</span>
      ${evcil ? `<span class="pet">${evcil.emoji}</span>` : ""}
      ${saksi ? `<span class="sill">${saksi.emoji}</span>` : ""}
    </span>`;
  }

  /* Apartman cephesi */
  function facade(cols, rows, { showMe = false, caption = true } = {}) {
    const total = cols * rows;
    const meIdx = S.user ? daire(myHandle()) % total : -1;
    const meOn = showMe && S.checkins.includes(today());
    let seed = hash(today() + cols) || 1;
    const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const cells = Array.from({ length: total }, (_, i) => {
      const r = rand();
      if (i === meIdx && meOn) return win(true, "me");
      return win(r < 0.4, r > 0.93 ? "tw" : "");
    }).join("");
    return `<div class="facade">
      <div class="facade-roof"></div>
      <div class="facade-grid" style="--cols:${cols}">${cells}</div>
      <div class="facade-door"></div>
      ${caption ? `<div class="facade-cap"><div class="row" style="gap:8px"><span class="live-dot"></span><span class="xs" style="color:rgba(245,240,255,.7)">Apartmanda</span></div><div class="facade-num">${nf(liveCount())}</div><p>komşu şu an evde${meOn ? ". Biri de sensin." : ". Kapı açık, uğra."}</p></div>` : ""}
    </div>`;
  }

  /* ───────── Landing ───────── */
  function landing() {
    return `
    <div class="landing">
      <header class="land-top">${brand()}<button class="btn sm ghost" data-a="start">Giriş yap</button></header>
      <main class="land-hero">
        <div class="land-copy">
          <h1>Ben de ev genciyim.<br><em>Sen de.</em></h1>
          <p class="lead">Burada kimse "iş buldun mu?" diye sormaz.</p>
        </div>
        <div class="land-art">
          ${facade(9, 7, { caption: false })}
          <div class="land-count"><b class="num">${nf(liveCount())}</b><span>komşu şu an evde</span></div>
          <div class="float-note n1"><div class="row" style="gap:10px">${av("kanepe_kral", "s32")}<div><b class="sm">Kanepe Kralı</b><div class="xs muted">Daire ${daire("kanepe_kral")} · 2 sa</div></div></div><p class="sm" style="margin-top:8px">30k teklif geldi, saati 99 lira. Reddettim.</p><span class="bende on">${ic("hand", "ico-sm")}Ben de <span class="cnt">1,2B</span></span></div>
          <div class="float-note n2"><div class="row" style="gap:10px"><span class="room-ic">${ic("moon", "ico-sm")}</span><div><b class="sm">Balkon</b><div class="xs muted">Gece 3'te çay ve muhabbet</div></div></div><p class="sm" style="margin-top:8px"><span class="online"><span class="live-dot"></span>640 kişi şu an burada</span></p></div>
        </div>
        <div class="land-cta">
          <button class="btn lamp lg block" data-a="start">Anahtarını al</button>
          <p class="xs faint">Ücretsiz · takma adla · 30 saniye</p>
        </div>
      </main>
      <footer class="land-foot"><span>Apartman kuralları</span><span>Gizlilik</span><span>© 2026 evdeyiz · prototip, içerik örnektir</span></footer>
    </div>`;
  }

  /* ───────── Onboarding: 4 adım ───────── */
  const ONB = 4;
  function onboarding() {
    const { step, data } = ui.onb;
    let body = "", can = true, next = "Devam", skip = "";
    if (step === 0) {
      can = data.name.trim().length > 1;
      body = `<h2>Kapına ne yazalım?</h2><p class="hint">Takma ad yeter. Apartmanda bu adla görüneceksin.</p>
        <div class="field"><label for="onb-name">Takma ad</label><div class="input"><input id="onb-name" maxlength="18" autocomplete="nickname" placeholder="ör. kanepe_kral" value="${esc(data.name)}" /></div></div>`;
    } else if (step === 1) {
      can = !!data.since;
      body = `<h2>Ne zamandır evdesin?</h2><p class="hint">Apartmandaki kıdemin buna göre belirlenir.</p><div>${D.since.map((s) => `
        <button class="choice" data-a="onb-pick" data-k="since" data-v="${s.id}" aria-pressed="${data.since === s.id}">${win(data.since === s.id)}<span><b>${esc(s.title)}</b><span class="sub">${esc(s.sub)}</span></span></button>`).join("")}</div>`;
    } else if (step === 2) {
      next = "Anahtarımı ver";
      can = data.games.length > 0;
      skip = can ? "" : `<button class="btn ghost block" data-a="onb-skip">Oyun oynamıyorum, geç</button>`;
      body = `<h2>Ana mesain ne?</h2><p class="hint">Oyun odasında sana uygun lobileri gösteririz. Birden fazla seçebilirsin.</p>
        <div class="game-grid">${D.games.map((g) => `<button class="game-pick" data-a="onb-game" data-v="${g.id}" aria-pressed="${data.games.includes(g.id)}"><span class="gcode" style="background:${g.color}">${g.code}</span><span class="grow">${esc(g.short)}</span>${data.games.includes(g.id) ? `<span style="color:var(--lamp-text)">${ic("check", "ico-sm", 3)}</span>` : ""}</button>`).join("")}</div>`;
    } else {
      next = "Daireme gir";
      body = `<h2>Daire ${daire(handleOf(data.name))} senin.</h2><p class="hint">Sakin kartın hazır. Hoş geldin hediyesi olarak kapında 10 çay var.</p>${sakinCard({ ...data, joinedAt: today() }, {})}`;
    }
    return `
    <div class="ov onb" role="dialog" aria-modal="true" aria-label="Kayıt">
      <div class="sheet">
        <div class="onb-top"><button class="icon-btn" data-a="onb-back" aria-label="${step ? "Geri" : "Kapat"}">${ic(step ? "back" : "x")}</button>${brand()}<span class="sm faint" style="width:40px;text-align:right">${step + 1}/${ONB}</span></div>
        <div class="onb-body">${body}</div>
        <div class="onb-foot">
          <div class="floors" aria-hidden="true">${Array.from({ length: ONB }, (_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>
          <button class="btn lamp lg block" data-a="onb-next" ${can ? "" : "disabled"}>${next}</button>
          ${skip}
        </div>
      </div>
    </div>`;
  }

  function sakinCard(u, eq = S.eq) {
    const days = daysAtHome(u);
    const wake = D.wakes.find((w) => w.id === u.wake);
    const games = (u.games || []).map((g) => D.games.find((x) => x.id === g)?.short).filter(Boolean);
    const h = handleOf(u.name);
    return `
    <section class="sakin" aria-label="Sakin kartı">
      <div class="sakin-top"><span>EV GENCİ SAKİN KARTI</span><span>DAİRE ${daire(h)}</span></div>
      <div class="sakin-body">
        ${windowArt(eq, u.name)}
        <div class="grow">
          <div class="sakin-name">@${esc(h)}</div>
          <div class="sakin-title">${esc(titleFor(days).name)}</div>
          <dl>
            <div><dt>Evde</dt><dd>${nf(days)}. gün</dd></div>
            <div><dt>Işık yanar</dt><dd>${esc(wake?.title || "-")}</dd></div>
            <div><dt>Ana mesai</dt><dd>${esc(games.slice(0, 2).join(", ") || "Dizi, uyku")}</dd></div>
            <div><dt>Şehir</dt><dd>${esc(u.city || "Gizli")}</dd></div>
          </dl>
        </div>
      </div>
      <div class="sakin-foot"><span>No ${cardNo(u)}</span><span>evdeyiz apt. · süresiz</span></div>
    </section>`;
  }

  /* ───────── Shell ───────── */
  const TABS = [["feed", "Pano", "board"], ["party", "Oyun", "pad"], ["rooms", "Odalar", "door"], ["calc", "Fiş", "receipt"], ["me", "Dairem", "window"]];
  function shell() {
    const pages = { feed: pageFeed, party: pageParty, rooms: pageRooms, calc: pageCalc, me: pageMe };
    const un = unreadNotifs();
    return `
    <div class="app ${S.tab === "rooms" && ui.room ? "in-room" : ""}">
      <header class="top"><div class="top-inner">
        <button data-a="tab" data-v="feed" aria-label="Panoya dön">${brand()}</button>
        <label class="search">${ic("search", "ico-sm")}<input id="search" type="search" placeholder="Panoda ara" value="${esc(ui.search)}" autocomplete="off" aria-label="Panoda ara" /></label>
        <div class="top-actions">
          <button class="btn lamp sm desk" data-a="compose">${ic("plus", "ico-sm", 2.6)}Not bırak</button>
          <button class="tea-chip" data-a="modal" data-v="shop" aria-label="${S.tea} çay, bakkalı aç">${ic("tea", "ico-sm")}<span class="num">${S.tea}</span></button>
          <button class="icon-btn bell" data-a="modal" data-v="notifs" aria-label="Bildirimler${un ? `, ${un} yeni` : ""}">${ic("bell")}${un ? `<span class="dot-badge">${un > 9 ? "9+" : un}</span>` : ""}</button>
          <button data-a="tab" data-v="me" aria-label="Dairem">${meAv("s32")}</button>
        </div>
      </div></header>
      <div class="wrap">
        <main class="main">${pages[S.tab]()}</main>
        <aside class="aside" aria-label="Apartman">${side()}</aside>
      </div>
      <nav class="dock" aria-label="Ana menü">
        ${TABS.map(([id, label, icon]) => `<button data-a="tab" data-v="${id}" ${S.tab === id ? 'aria-current="page"' : ""}>${ic(icon)}${label}${id === "rooms" && S.unread && S.tab !== "rooms" ? `<span class="badge">${S.unread}</span>` : ""}</button>`).join("")}
      </nav>
    </div>
    ${modal()}${storyViewer()}`;
  }

  function side() {
    const trends = ui.allTrends ? D.trends : D.trends.slice(0, 5);
    return `
      ${facade(8, 6, { showMe: true })}
      ${leadersCard()}
      <section class="card">
        <h2 class="list-title">Panoda en çok konuşulan</h2>
        ${trends.map((t, i) => `<button class="list-row" data-a="hashtag" data-v="${esc(t.tag)}"><span class="trend-rank">${i + 1}</span><span class="grow"><span class="b" style="display:block">#${esc(t.tag)}</span><span class="xs muted">${esc(t.count)}</span></span></button>`).join("")}
        <button class="list-more" data-a="more-trends">${ui.allTrends ? "Daha az göster" : "Tümünü göster"}</button>
      </section>
      <section class="card" style="padding-bottom:8px">
        <h2 class="list-title">Yeni komşular</h2>
        ${D.suggest.map((h) => { const p = person(h); const on = !!S.follows[h]; return `<div class="list-row">${av(h)}<div class="grow"><div class="b ellip">${esc(p.name)}${p.badge ? star() : ""}</div><div class="xs muted">Daire ${daire(h)}</div></div><button class="btn sm ${on ? "on" : ""}" data-a="follow" data-v="${h}">${on ? "Komşusun" : "Kapıyı çal"}</button></div>`; }).join("")}
      </section>
      <div class="side-foot"><span>Apartman kuralları</span><span>Gizlilik</span><span>© 2026 evdeyiz</span></div>`;
  }

  function leadersCard(extraCls = "") {
    const st = streak();
    return `<section class="card leaders ${extraCls}">
      <h2 class="list-title">${ic("trophy", "ico-sm")}Haftanın en'leri</h2>
      ${D.leaders.map((l) => `<div class="list-row">${av(l.h, "s32")}<div class="grow"><div class="xs muted">${esc(l.label)}</div><div class="b ellip">${esc(person(l.h).name)}</div></div><b class="num">${esc(l.value)}</b></div>`).join("")}
      <div class="leader-me">${st ? `Senin serin <b>${st} gün</b>. ${Math.max(0, 41 - st)} gün daha yakarsan zirvedesin.` : "Bugün ışığını yak, sıralamaya gir."}</div>
    </section>`;
  }

  /* ───────── Pano ───────── */
  function allPosts() {
    const mine = S.posts.slice().reverse().map((p) => ({ ...p, mine: true }));
    let list = mine.concat(S.extra ? D.incoming : [], D.feed);
    if (S.feedTab === "popular") list = list.slice().sort((a, b) => (b.r?.like || 0) - (a.r?.like || 0));
    if (ui.hashtag) list = list.filter((p) => lower(p.text).includes("#" + lower(ui.hashtag)));
    if (ui.search.trim()) { const q = lower(ui.search.trim()); list = list.filter((p) => lower(p.text).includes(q) || lower(p.h || "").includes(q) || lower(person(p.h || "").name).includes(q)); }
    return list;
  }
  function pageFeed() {
    const posts = allPosts();
    const filter = ui.hashtag || ui.search.trim();
    const notes = posts.map(noteHtml);
    if (!filter && notes.length > 2) notes.splice(2, 0, leadersCard("feed-leaders"));
    return `
      ${ui.pill && !filter ? `<button class="new-pill" data-a="show-new">${ic("arrowUp", "ico-sm", 2.6)}2 yeni not</button>` : ""}
      <div class="page-head">
        <div><h1>Pano</h1><p>${timeLine()}</p></div>
      </div>
      ${filter ? `<div class="filter-bar"><span><span class="muted">Panoda:</span> <b>${ui.hashtag ? "#" + esc(ui.hashtag) : `"${esc(ui.search.trim())}"`}</b> · ${posts.length} not</span><button class="btn sm ghost" data-a="clear-filter">Temizle</button></div>` : `${todayCard()}${windowsRow()}${checklistCard()}${questionCard()}`}
      ${composer("inline")}
      <div class="seg wide" role="group" aria-label="Sıralama"><button data-a="feedtab" data-v="foryou" aria-pressed="${S.feedTab === "foryou"}">Yeni</button><button data-a="feedtab" data-v="popular" aria-pressed="${S.feedTab === "popular"}">En çok "ben de"</button></div>
      ${notes.length ? notes.join("") : `<div class="card empty"><span class="win"></span><h2>Panoda bu konuda not yok</h2><p>İlk notu sen bırak. Apartman dinliyor.</p></div>`}
      <p class="faint xs" style="text-align:center">Prototip · notlar ve sakinler örnektir</p>`;
  }

  function windowsRow() {
    const order = D.stories.map((s, i) => ({ s, i })).sort((a, b) => (!!S.seen[a.s.h]) - (!!S.seen[b.s.h]));
    return `<div class="windows" aria-label="Pencereler">
      <button class="win-btn" data-a="modal" data-v="shop" aria-label="Pencereni süsle">${windowArt(S.eq, S.user.name, "tiny")}<span class="win-name">Pencerem</span></button>
      ${order.map(({ s, i }) => `<button class="win-btn" data-a="story" data-v="${i}" aria-label="${esc(s.h)} penceresi"><span class="win ${S.seen[s.h] ? "" : "lit"}"><span class="who">${initial(s.h)}</span></span><span class="win-name">${esc(s.h)}</span></button>`).join("")}
    </div>`;
  }

  /* Bugün kartı: ışık + kapıcı poşeti */
  function todayCard() {
    const lit = S.checkins.includes(today());
    const boxed = S.box === today();
    const week = Array.from({ length: 7 }, (_, i) => addDays(new Date(), i - 6));
    const st = streak();
    const nextMs = [3, 7, 14, 30].find((m) => m > st);
    const bonus = { 3: 10, 7: 25, 14: 40, 30: 80 }[nextMs];
    const line = lit ? (nextMs ? `${st} günlük seri · ${nextMs - st} gün sonra +${bonus} çay` : `${st} günlük seri · efsane`) : st ? `${st} günlük serin sönmesin · +5 çay` : "Bugün yak, +5 çay al";
    return `<section class="hero-light">
      ${facade(11, 4, { showMe: true, caption: false })}
      <div class="hero-cap">
        <div class="grow"><b class="num">${nf(liveCount())}</b><span>komşu şu an evde</span></div>
        ${lit ? `<span class="pill-done">${ic("check", "ico-sm", 3)}Işığın yanıyor</span>` : `<button class="btn lamp" data-a="checkin">Işığımı yak</button>`}
      </div>
      <div class="hero-week"><span class="light-week" aria-hidden="true">${week.map((d) => `<i class="${S.checkins.includes(ymd(d)) ? "on" : ""}"></i>`).join("")}</span><span>${line}${S.bulbs ? ` · ${S.bulbs} yedek ampul` : ""}</span></div>
    </section>
    <section class="card cells">
      <div class="cell ${boxed ? "done" : ""}">
        <span class="cell-ic ${boxed ? "" : "wiggle"}">${ic("bag", "ico-sm")}</span>
        <div class="grow"><h3>${boxed ? "Poşet açıldı" : "Kapında poşet var"}</h3><p>${boxed ? "Kapıcı yarın yine uğrar" : "Kapıcı bir şey bıraktı"}</p></div>
        ${boxed ? `<span class="pill-done">${ic("check", "ico-sm", 3)}</span>` : `<button class="btn sm soft" data-a="box">Aç</button>`}
      </div>
    </section>`;
  }

  function checklistCard() {
    if (S.listDone) return "";
    const items = checklist();
    const done = items.filter((x) => x.done).length;
    const all = done === items.length;
    return `<section class="card checklist">
      <div class="row" style="justify-content:space-between"><h3>Taşınma listesi</h3><span class="sm muted num">${done}/${items.length}</span></div>
      <div class="meter"><i style="width:${(done / items.length) * 100}%"></i></div>
      ${items.map((x) => `<button class="check-row ${x.done ? "done" : ""}" data-a="go" data-v="${x.go}" ${x.done ? "disabled" : ""}><span class="tick">${x.done ? ic("check", "ico-sm", 3) : ""}</span><span class="grow">${esc(x.label)}</span>${x.done ? "" : ic("next", "ico-sm")}</button>`).join("")}
      ${all ? `<button class="btn lamp block" data-a="list-claim">${ic("tea", "ico-sm")}20 çay ödülünü al</button>` : `<p class="xs muted">Hepsini bitir, 20 çay ve "Yerleşik sakin" rozeti senin.</p>`}
    </section>`;
  }

  function questionCard() {
    const q = D.questions[dayNo() % D.questions.length];
    const ans = S.qa[today()];
    const votes = q.votes.map((v, i) => v + (ans === i ? 1 : 0));
    const total = votes.reduce((a, b) => a + b, 0);
    const max = Math.max(...votes);
    return `<section class="card pad meeting-card">
      <div class="meeting-title">${ic("vote", "ico-sm")}Günün apartman toplantısı · ${nf(total)} oy</div>
      <h3 class="q">${esc(q.q)}</h3>
      <div class="meeting flat">
        ${ans === undefined
          ? q.opts.map((o, i) => `<button class="opt" data-a="answer" data-v="${i}"><span>${esc(o)}</span></button>`).join("") + `<p class="xs muted">Oy ver, sonuçları gör · +2 çay</p>`
          : q.opts.map((o, i) => { const pct = Math.round((votes[i] / total) * 100); return `<div class="opt ${votes[i] === max ? "win-opt" : ""}"><i class="bar" style="width:${pct}%"></i><span>${esc(o)}${ans === i ? ic("check", "ico-sm", 3) : ""}</span><span class="pct">%${pct}</span></div>`; }).join("") + `<p class="xs muted">Yarın yeni toplantı var.</p>`}
      </div>
    </section>`;
  }

  function composer(where) {
    return `<form class="card composer" data-form="post" data-where="${where}">
      ${ui.anon ? `<span class="av anon">${ic("lock", "ico-sm")}</span>` : meAv()}
      <div class="grow">
        <textarea id="pt-${where}" rows="2" maxlength="280" placeholder="Panoya bir not bırak…" aria-label="Not"></textarea>
        <div class="composer-foot">
          <button type="button" class="toggle" data-a="anon" aria-pressed="${ui.anon}"><span class="switch"></span>İsimsiz as</button>
          <div class="row" style="gap:12px"><span class="counter" id="cnt-${where}">0/280</span><button class="btn lamp sm" type="submit">Panoya as</button></div>
        </div>
      </div>
    </form>`;
  }

  function noteHtml(p) {
    const r = p.r || { reply: 0, repost: 0, like: 0, views: 0 };
    const liked = !!S.likes[p.id], rep = !!S.reposts[p.id];
    let h, name, badge = false, avatar, no;
    if (p.mine) {
      if (p.anon) { h = "isimsiz"; name = "İsimsiz komşu"; avatar = `<span class="av anon">${ic("lock", "ico-sm")}</span>`; no = "?"; }
      else { h = myHandle(); name = S.user.name; avatar = meAv(); no = daire(h); }
    } else { h = p.h; const pp = person(h); name = pp.name; badge = pp.badge; avatar = av(h); no = daire(h); }
    const fresh = D.incoming.some((x) => x.id === p.id);
    return `
    <article class="card note ${fresh ? "fresh" : ""}" aria-label="${esc(name)} notu">
      ${rep ? `<div class="shared-by">${ic("pin", "ico-sm")}Panoya tekrar astın</div>` : ""}
      <div class="note-head">${avatar}<div class="grow"><div class="note-name"><span>${esc(name)}</span>${badge ? star() : ""}</div><div class="note-meta"><span class="daire">D.${no}</span><span>${esc(p.mine ? ago(p.at) : p.ago)}</span></div></div></div>
      <div class="note-text">${linkify(p.text)}</div>
      ${p.poll ? meetingHtml(p) : ""}
      ${p.calc ? `<button class="embed" data-a="tab" data-v="calc">${receipt(p.calc, true)}</button><div class="embed-cap">${ic("receipt", "ico-sm")}Kendi fişini kes</div>` : ""}
      <div class="note-foot">
        <button class="bende ${liked ? "on" : ""}" data-a="like" data-v="${p.id}" aria-pressed="${liked}">${ic("hand", "ico-sm")}Ben de <span class="cnt">${k(r.like + (liked ? 1 : 0))}</span></button>
        <button class="mini" data-a="reply" aria-label="Yorumlar">${ic("comment", "ico-sm")}${r.reply ? k(r.reply) : ""}</button>
        <button class="mini ${rep ? "on" : ""}" data-a="repost" data-v="${p.id}" aria-pressed="${rep}" aria-label="Panoya tekrar as">${ic("pin", "ico-sm")}${k(r.repost + (rep ? 1 : 0))}</button>
        <button class="mini" data-a="share-post" data-v="${p.id}" aria-label="Paylaş">${ic("share", "ico-sm")}</button>
        <span class="seen" aria-label="Görüntülenme">${ic("eye", "ico-sm")}${k(r.views)}</span>
      </div>
    </article>`;
  }

  function meetingHtml(p) {
    const voted = S.polls[p.id];
    const votes = p.poll.votes.map((v, i) => v + (voted === i ? 1 : 0));
    const total = votes.reduce((a, b) => a + b, 0);
    const head = `<div class="meeting-title">${ic("vote", "ico-sm")}Apartman toplantısı · ${nf(total)} oy · ${esc(p.poll.left)}</div>`;
    if (voted === undefined) return `<div class="meeting">${head}${p.poll.opts.map((o, i) => `<button class="opt" data-a="vote" data-id="${p.id}" data-v="${i}"><span>${esc(o)}</span></button>`).join("")}</div>`;
    const max = Math.max(...votes);
    return `<div class="meeting">${head}${p.poll.opts.map((o, i) => { const pct = Math.round((votes[i] / total) * 100); return `<div class="opt ${votes[i] === max ? "win-opt" : ""}"><i class="bar" style="width:${pct}%"></i><span>${esc(o)}${voted === i ? ic("check", "ico-sm", 3) : ""}</span><span class="pct">%${pct}</span></div>`; }).join("")}</div>`;
  }

  function receipt(c, mini = false) {
    const full = !mini && c.netKalan !== undefined;
    const no = String(hash(String(c.maas) + (c.saatlik || 0)) % 9000 + 1000);
    const d = new Date();
    return `<div class="receipt ${mini ? "mini-r" : ""}">
      <div class="receipt-head"><b>MAAŞ MI, EV Mİ?</b><span>Fiş ${no} · ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}</span></div>
      <div class="r-line"><span>Teklif (net)</span><span>${nf(c.maas)} ₺</span></div>
      ${full ? `
        <div class="r-line minus"><span>Yol</span><span>−${nf(c.yol)} ₺</span></div>
        <div class="r-line minus"><span>Yemek</span><span>−${nf(c.yemek)} ₺</span></div>
        <div class="r-sep"></div>
        <div class="r-line"><span>Eline kalan</span><span>${nf(c.netKalan)} ₺</span></div>
        <div class="r-line"><span>Mesai + yol</span><span>${nf(c.saat)} sa/ay</span></div>
        <div class="r-line"><span>Evde kalınca masraf</span><span>${nf(c.ev)} ₺</span></div>` : ""}
      <div class="r-sep"></div>
      <div class="r-total"><span>Saatin</span><b>${nf(c.saatlik)} ₺</b></div>
      <span class="stamp ${c.evKal ? "" : "go"}">${c.evKal ? "EVDE KAL" : "BİR DÜŞÜN"}</span>
      <div class="r-foot">KANEPE KAÇMAZ · evdeyiz</div>
    </div>`;
  }

  /* ───────── Pencere görüntüleyici ───────── */
  const STORY_MS = 5000;
  let storyTick = null;
  function storyViewer() {
    if (!ui.story) return "";
    const st = D.stories[ui.story.i];
    const sl = st.slides[ui.story.s];
    return `<div class="story-ov" role="dialog" aria-modal="true" aria-label="${esc(st.h)} penceresi">
      <button class="icon-btn story-close" data-a="story-close" aria-label="Kapat">${ic("x")}</button>
      <div class="story-frame" style="background:${sl.g[0]}">
        <div class="story-bars">${st.slides.map((_, i) => `<i><b ${i === ui.story.s ? 'id="sb-cur"' : ""} style="width:${i < ui.story.s ? 100 : 0}%"></b></i>`).join("")}</div>
        <div class="story-head">${av(st.h, "s32")}<b>${esc(st.h)}</b><span class="daire" style="background:rgba(0,0,0,.25);color:#fff">D.${daire(st.h)}</span><span style="opacity:.75">${esc(st.ago)}</span></div>
        <div class="story-content"><div class="story-big">${esc(sl.big)}</div><div class="story-sub">${esc(sl.sub)}</div></div>
        <button class="story-tap prev" data-a="story-prev" aria-label="Önceki"></button>
        <button class="story-tap next" data-a="story-next" aria-label="Sonraki"></button>
        <form class="story-reply" data-form="story-reply"><input id="story-reply" placeholder="Pencereye seslen…" autocomplete="off" aria-label="Yanıt" /><button class="icon-btn" type="submit" aria-label="Gönder">${ic("send")}</button></form>
      </div>
    </div>`;
  }
  function openStory(i) { ui.story = { i, s: 0, start: Date.now(), paused: false }; S.seen[D.stories[i].h] = true; save(); render(); runStory(); }
  function runStory() {
    clearInterval(storyTick);
    storyTick = setInterval(() => {
      if (!ui.story) { clearInterval(storyTick); return; }
      if (ui.story.paused) return;
      const pct = Math.min(100, ((Date.now() - ui.story.start) / STORY_MS) * 100);
      const b = document.getElementById("sb-cur"); if (b) b.style.width = pct + "%";
      if (pct >= 100) storyStep(1);
    }, 50);
  }
  function storyStep(dir) {
    const st = D.stories[ui.story.i];
    let { i, s } = ui.story;
    s += dir;
    if (s >= st.slides.length) { i++; s = 0; }
    if (s < 0) { i--; s = i >= 0 ? D.stories[i].slides.length - 1 : 0; }
    if (i < 0) { i = 0; s = 0; }
    if (i >= D.stories.length) { closeStory(); return; }
    ui.story = { i, s, start: Date.now(), paused: false };
    S.seen[D.stories[i].h] = true; save();
    render();
  }
  function closeStory() { clearInterval(storyTick); ui.story = null; render(); }

  /* ───────── Oyun odası ───────── */
  function pageParty() {
    const mine = S.user.games || [];
    const all = S.myLobbies.slice().reverse().map((l) => ({ ...l, mine: true })).concat(D.lobbies);
    const list = all.filter((l) => ui.game === "all" || (ui.game === "mine" ? mine.includes(l.game) : l.game === ui.game));
    const t = D.tournament, inT = S.lobbies.includes("tournament");
    const teams = t.teams + (inT ? 1 : 0);
    const online = D.games.reduce((a, g) => a + g.online, 0);
    return `
      <div class="page-head"><div><h1>Oyun odası</h1><p>${nf(online)} komşu şu an oyunda.</p></div><button class="btn lamp sm" data-a="modal" data-v="lobby">${ic("plus", "ico-sm", 2.6)}İlan as</button></div>
      <div class="games" role="group" aria-label="Oyun filtresi">
        <button class="chip txt" data-a="game" data-v="all" aria-pressed="${ui.game === "all"}">Hepsi</button>
        ${mine.length ? `<button class="chip txt" data-a="game" data-v="mine" aria-pressed="${ui.game === "mine"}">Benim oyunlarım</button>` : ""}
        ${D.games.map((g) => `<button class="chip" data-a="game" data-v="${g.id}" aria-pressed="${ui.game === g.id}"><span class="gcode" style="background:${g.color}">${g.code}</span>${esc(g.short)}</button>`).join("")}
      </div>
      <section class="card lan">
        <div class="lan-art"><span class="lan-tag"><span class="live-dot"></span>Kayıtlar açık · ${t.max - teams} yer kaldı</span><h3>${esc(t.title)}</h3><p>${esc(t.game)} · ${esc(t.when)}</p></div>
        <div class="pad" style="display:flex;flex-direction:column;gap:12px">
          <div class="slots" aria-label="${teams}/${t.max} takım kayıtlı">${Array.from({ length: t.max }, (_, i) => `<i class="${i < t.teams ? "on" : i === t.teams && inT ? "me" : ""}"></i>`).join("")}</div>
          <div class="row" style="justify-content:space-between;flex-wrap:wrap"><span class="sm"><b class="num">${teams}/${t.max}</b> <span class="muted">takım · ${esc(t.prize)}</span></span><button class="btn sm ${inT ? "on" : "lamp"}" data-a="lobby" data-v="tournament">${inT ? "Takımın kayıtlı" : "Takım kaydet"}</button></div>
        </div>
      </section>
      ${list.length ? list.map(lobbyHtml).join("") : `<div class="card empty"><span class="win"></span><h2>Bu oyunda lobi yok</h2><p>İlk ilanı sen as, duo'n seni bulsun.</p></div>`}`;
  }
  function lobbyHtml(l) {
    const g = D.games.find((x) => x.id === l.game) || D.games[0];
    const joined = S.lobbies.includes(l.id);
    const h = l.mine ? myHandle() : l.h;
    const name = l.mine ? S.user.name : person(h).name;
    return `<article class="card lobby">
      <span class="gcode lg" style="background:${g.color}" aria-label="${esc(g.name)}">${g.code}</span>
      <div class="grow">
        <div class="note-name"><span>${esc(name)}</span><span class="daire">D.${daire(h)}</span></div>
        <p style="margin-top:4px">${esc(l.note)}</p>
        <div class="tags"><span class="tag">${esc(g.short)}</span><span class="tag">${esc(l.rank)}</span><span class="tag">${esc(l.role)}</span>${l.mine ? '<span class="tag mine">Senin ilanın</span>' : `<span class="tag hot">${l.need} kişi lazım</span>`}</div>
      </div>
      ${l.mine ? `<button class="btn sm ghost" data-a="lobby-del" data-v="${l.id}">Kaldır</button>` : `<button class="btn sm ${joined ? "on" : ""}" data-a="lobby" data-v="${l.id}">${joined ? "Lobidesin" : "Katıl"}</button>`}
    </article>`;
  }

  /* ───────── Odalar ───────── */
  const roomMsgs = (id) => (D.roomSeed[id] || []).map(([h, text]) => ({ h, text })).concat(S.rooms[id] || []);
  function pageRooms() {
    if (ui.room) return roomThread();
    return `
      <div class="page-head"><div><h1>Odalar</h1><p>Apartmanın ortak alanları. Kimse yargılamaz. Her mesaj +1 çay.</p></div></div>
      <div class="rooms">${D.rooms.map((r) => {
        const last = roomMsgs(r.id).slice(-1)[0];
        return `<button class="card room" data-a="room" data-v="${r.id}">
          <div class="row" style="justify-content:space-between"><span class="room-ic" style="background:${r.color}">${ic(r.icon)}</span><span class="online"><span class="live-dot"></span>${k(r.online)}</span></div>
          <div><h3>${esc(r.title)}</h3><div class="sub">${esc(r.sub)}</div></div>
          <div class="last ellip">${last ? `${last.me ? "Sen" : "@" + esc(last.h)}: ${esc(last.text)}` : ""}</div>
        </button>`;
      }).join("")}</div>
      <p class="faint xs">Kural: yargılamak, aşağılamak ve "git iş bul" nasihati yasak. Gerçekten kötü hissediyorsan yalnız kalma; acil durumda 112.</p>`;
  }
  function roomThread() {
    const r = D.rooms.find((x) => x.id === ui.room);
    const groups = [];
    for (const m of roomMsgs(r.id)) {
      const key = m.me ? "__me" : m.h;
      const g = groups[groups.length - 1];
      if (g && g.key === key) g.items.push(m); else groups.push({ key, items: [m] });
    }
    return `
      <div class="thread-head"><button class="icon-btn" data-a="room-back" aria-label="Odalara dön">${ic("back")}</button><span class="room-ic" style="background:${r.color}">${ic(r.icon)}</span><div class="grow"><h1>${esc(r.title)}</h1><span class="online"><span class="live-dot"></span>${nf(r.online + 1)} kişi burada</span></div></div>
      <section class="card thread" id="thread">
        <p class="sm muted" style="text-align:center">${esc(r.sub)}. Odaya hoş geldin.</p>
        ${groups.map((g) => g.key === "__me"
          ? `<div class="bgroup me"><div class="bubbles">${g.items.map((m) => `<div class="bubble">${esc(m.text)}</div>`).join("")}</div></div>`
          : `<div class="bgroup">${av(g.key, "s32")}<div class="bubbles"><div class="bname">@${esc(g.key)} · D.${daire(g.key)}</div>${g.items.map((m) => `<div class="bubble">${esc(m.text)}</div>`).join("")}</div></div>`).join("")}
        ${ui.typing ? `<div class="typing"><i></i><i></i><i></i>&nbsp;@${esc(ui.typing)} yazıyor</div>` : ""}
      </section>
      <div class="card composer-dock">
        <div class="quick">${D.quick.map((q) => `<button data-a="quick" data-v="${esc(q)}">${esc(q)}</button>`).join("")}</div>
        <form class="msg-form" data-form="chat"><input id="chat-input" maxlength="240" placeholder="${esc(r.title)} odasına yaz" autocomplete="off" aria-label="Mesaj" /><button class="send" type="submit" aria-label="Gönder">${ic("send")}</button></form>
      </div>`;
  }

  /* ───────── Fiş ───────── */
  const calcView = () => ({ ...S.calc, ...calcResult() });
  function pageCalc() {
    const c = S.calc;
    const f = (id, label, val, unit, step) => `<div class="field"><label for="c-${id}">${label}</label><div class="input has-unit"><input id="c-${id}" data-calc="${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${val}" /><span class="unit">${unit}</span></div></div>`;
    return `
      <div class="page-head"><div><h1>Maaş mı, ev mi?</h1><p>Teklifi gir, fişini kes. Saatine gerçekte kaç para düşüyor?</p></div></div>
      <div class="calc">
        <section class="card pad fields">
          ${f("maas", "Teklif edilen net maaş", c.maas, "₺", 500)}
          <div class="grid2">${f("yol", "Aylık yol", c.yol, "₺", 100)}${f("yemek", "Aylık yemek", c.yemek, "₺", 100)}</div>
          <div class="grid2">${f("isSaat", "Günlük mesai", c.isSaat, "saat", 1)}${f("yolSaat", "Günlük yol süresi", c.yolSaat, "saat", 0.5)}</div>
          ${f("ev", "Evdeyken aylık toplam masrafın", c.ev, "₺", 250)}
          <p class="note-s">Ayda 22 iş günü varsayılır. Saati 120 ₺'nin altındaysa fişe "EVDE KAL" damgası basılır. Eğlencesine bir hesap, finansal tavsiye değildir.</p>
        </section>
        <div class="calc-side">
          <div id="calc-out">${receipt(calcView())}</div>
          <div class="btn-row"><button class="btn lamp" data-a="calc-post">${ic("pin", "ico-sm")}Panoya as</button><button class="btn ghost" data-a="calc-copy">Metni kopyala</button></div>
        </div>
      </div>`;
  }

  /* ───────── Dairem ───────── */
  function pageMe() {
    const u = S.user, days = daysAtHome(), t = titleFor(days), e = earned();
    const wake = D.wakes.find((w) => w.id === u.wake);
    const joined = new Date(u.joinedAt + "T00:00:00");
    const myPosts = S.posts.slice().reverse().map((p) => ({ ...p, mine: true }));
    const neighbors = Object.values(S.follows).filter(Boolean).length;
    let content = "";
    if (ui.ptab === "posts") {
      content = myPosts.length ? myPosts.map(noteHtml).join("") : `<div class="card empty"><span class="win"></span><h2>Panoda notun yok</h2><p>İlk notunu as, kaç komşunun "ben de" dediğini gör. +3 çay.</p><button class="btn lamp" data-a="compose">İlk notunu yaz</button></div>`;
    } else if (ui.ptab === "card") {
      content = `${sakinCard(u)}<div class="btn-row" style="max-width:520px"><button class="btn lamp" data-a="card-share">${ic("share", "ico-sm")}Kartını paylaş</button><button class="btn ghost" data-a="id-copy">Metni kopyala</button></div>`;
    } else {
      content = `<div class="badges">${D.badges.map((b) => `<div class="card badge"><span class="win ${e[b.id] ? "lit" : ""}"></span><b>${esc(b.label)}</b><span>${esc(b.desc)}</span></div>`).join("")}</div>
        <section class="card ladder"><h2 class="list-title">Kıdem yolu</h2>${D.titles.map((x) => `<div class="step">${win(days >= x.min)}<div class="grow"><div class="b">${esc(x.name)}</div><div class="xs muted">${x.min}. günden itibaren</div></div><span class="sm ${days >= x.min ? "" : "muted"}">${days >= x.min ? "Açıldı" : `${x.min - days} gün kaldı`}</span></div>`).join("")}</section>`;
    }
    return `
      <section class="card home-hero">
        <div class="home-art">${windowArt()}<div class="plate"><small>DAİRE</small><b>${daire(myHandle())} · ${esc(u.name)}</b></div></div>
        <div class="home-body">
          <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap"><div><h2>${esc(u.name)}${days >= 365 ? star() : ""}</h2><div class="muted">@${esc(myHandle())}</div></div><div class="row" style="gap:8px"><button class="btn sm lamp" data-a="modal" data-v="shop">${ic("store", "ico-sm")}Pencereni süsle</button><button class="btn sm ghost" data-a="modal" data-v="settings" aria-label="Ayarlar">${ic("gear", "ico-sm")}</button></div></div>
          <span class="title-chip">${win(true)}${esc(t.name)}</span>
          <div class="meta-row">${u.city ? `<span>${ic("map", "ico-sm")}${esc(u.city)}</span>` : ""}<span>${ic("clock", "ico-sm")}Işık ${esc(wake?.title || "-")}</span><span>${ic("cal", "ico-sm")}${MONTHS[joined.getMonth()]} ${joined.getFullYear()}'de taşındı</span></div>
          <div class="stats"><div class="stat"><b>${nf(days)}</b><span>Evdeki gün</span></div><div class="stat"><b>${streak()}</b><span>Işık serisi</span></div><div class="stat"><b>${S.tea}</b><span>Çay</span></div><div class="stat"><b>${neighbors}</b><span>Komşu</span></div></div>
        </div>
      </section>
      <div class="seg" role="group" aria-label="Daire sekmeleri" style="align-self:flex-start">${[["posts", "Notlarım"], ["card", "Sakin kartı"], ["badges", "Rozetler"]].map(([id, l]) => `<button data-a="ptab" data-v="${id}" aria-pressed="${ui.ptab === id}">${l}</button>`).join("")}</div>
      ${content}`;
  }

  /* ───────── Modals ───────── */
  function shopBody() {
    const cats = Object.keys(D.shopCats);
    const list = D.shop.filter((x) => x.cat === ui.shopCat);
    return `<div class="sheet-body">
      <div class="shop-hero">${windowArt()}<div class="grow"><div class="sm muted">Cebinde</div><div class="tea-big">${ic("tea")}<span class="num">${S.tea}</span> çay</div><p class="xs muted">Işık yak +5 · poşet aç · toplantıya katıl +2 · not as +3 · odada yaz +1</p></div></div>
      <div class="games" role="group" aria-label="Bakkal reyonları">${cats.map((c) => `<button class="chip txt" data-a="shop-cat" data-v="${c}" aria-pressed="${ui.shopCat === c}">${esc(D.shopCats[c])}</button>`).join("")}</div>
      <div class="shop-grid">${list.map((x) => {
        const owned = S.inv.includes(x.id), on = S.eq[x.cat] === x.id, canBuy = S.tea >= x.price;
        const preview = x.cat === "perde" ? `<span class="sw" style="background:${x.color}"></span>` : x.emoji ? `<span class="em">${x.emoji}</span>` : x.cat === "isik" ? `<span class="sw ${x.id}"></span>` : `<span class="em" style="color:var(--lamp-text)">${ic("bulb")}</span>`;
        let btn;
        const buyBtn = `<button class="btn sm ${canBuy ? "lamp" : ""}" data-a="buy" data-v="${x.id}" ${canBuy ? "" : "disabled"} aria-label="${esc(x.name)} al, ${x.price} çay">${ic("tea", "ico-sm")}${x.price}</button>`;
        if (x.cat === "ampul") btn = buyBtn;
        else if (on) btn = `<button class="btn sm on" data-a="unequip" data-v="${x.id}" aria-label="${esc(x.name)} takılı, çıkarmak için dokun">Takılı</button>`;
        else if (owned) btn = `<button class="btn sm ghost" data-a="equip" data-v="${x.id}">Tak</button>`;
        else btn = buyBtn;
        return `<div class="shop-item ${on ? "on" : ""}"><div class="shop-prev">${preview}</div><b>${esc(x.name)}</b>${x.cat === "ampul" ? `<span class="xs muted">${esc(x.desc)} Elinde: ${S.bulbs}</span>` : `<span class="xs muted">${owned ? "Senin" : `${x.price} çay`}</span>`}${btn}</div>`;
      }).join("")}</div>
      ${S.tea < 10 ? `<p class="xs muted" style="text-align:center">Çayın az mı? Bugün ışığını yak ve kapıdaki poşeti aç.</p>` : ""}
    </div>`;
  }

  function notifsBody() {
    if (!S.notifs.length) return `<div class="sheet-body"><div class="empty"><span class="win"></span><h2>Henüz bildirim yok</h2><p>Panoya not as, komşular tepki verince burada görürsün.</p></div></div>`;
    return `<div class="sheet-body" style="gap:4px">${S.notifs.map((n) => `<button class="notif ${n.read ? "" : "new"}" data-a="notif-go" data-v="${n.id}"><span class="notif-ic">${ic(n.icon, "ico-sm")}</span><span class="grow">${esc(n.text)}<span class="xs muted" style="display:block">${ago(n.at)}</span></span></button>`).join("")}</div>`;
  }

  function modal() {
    if (!ui.modal) return "";
    let title = "", body = "";
    if (ui.modal === "compose") {
      title = "Panoya not bırak";
      body = `<div class="sheet-body">${composer("modal")}</div>`;
    } else if (ui.modal === "lobby") {
      title = "Oyun odasına ilan as";
      const mine = S.user.games || [];
      body = `<form class="sheet-body" data-form="lobby">

  /* ───────── Render ───────── */
  function render() {
    applyTheme();
    const keep = {};
    document.querySelectorAll("#app textarea[id], #app input[id]:not([type=number])").forEach((el) => { keep[el.id] = el.value; });
    const act = document.activeElement;
    const focusId = act && act.id && $app.contains(act) ? act.id : null;
    const sel = focusId && typeof act.selectionStart === "number" ? [act.selectionStart, act.selectionEnd] : null;

    $app.innerHTML = ui.view === "landing" ? landing() : ui.view === "onb" ? landing() + onboarding() : shell();

    for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el && !el.readOnly && el.value === "" && v) { el.value = v; updateCounter(el); } }
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch { /* tür desteklemiyor */ } } }
    document.body.style.overflow = ui.modal || ui.story || ui.view === "onb" ? "hidden" : "";
  }
  const top = () => window.scrollTo(0, 0);
  const bottomScroll = () => requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
  function updateCounter(el) {
    if (!el.id.startsWith("pt-")) return;
    const c = document.getElementById("cnt-" + el.id.slice(3));
    if (c) c.textContent = `${el.value.length}/280`;
  }
  function copyText(text, okMsg = "Kopyalandı") {
    const fallback = () => { ui.shareText = text; ui.modal = "share"; render(); setTimeout(() => document.getElementById("share-text")?.select(), 30); };
    try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); } catch { fallback(); }
  }

  /* ───────── Paylaşılabilir sakin kartı (1080×1350 PNG) ───────── */
  let cardFile = null;
  const cardFileName = () => `evdeyiz-daire-${daire(myHandle())}.png`;
  const cardText = () => `Ev genci sakin kartım: Daire ${daire(myHandle())} · ${titleFor(daysAtHome()).name} · evde ${nf(daysAtHome())}. gün. Sen de taşın: ${SITE}`;
  const canSendCard = () => !!window.ReactNativeWebView || (!!cardFile && !!navigator.canShare && navigator.canShare({ files: [cardFile] }));

  async function drawCard(u = S.user) {
    const F = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif';
    const W = 1080, H = 1350;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    const NIGHT = "#0B0B0E", CARD = "#1C1C1E", OFF = "#1B1B21", LAMP = "#FFB340", DIM = "rgba(255,255,255,.55)", FRAME = "#3A3020";
    const box = (x, y, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); };
    const fit = (text, max) => { let t = String(text); if (g.measureText(t).width <= max) return t; while (t.length > 1 && g.measureText(t + "…").width > max) t = t.slice(0, -1); return t + "…"; };
    const h = handleOf(u.name), days = daysAtHome(u);
    g.textBaseline = "alphabetic";

    // Gece ve apartman cephesi
    g.fillStyle = NIGHT; g.fillRect(0, 0, W, H);
    let seed = hash(h) || 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const cols = 11, gap = 14, cw0 = (W - 80 - gap * (cols - 1)) / cols, ch0 = cw0 * 1.3;
    for (let r = 0; r < 3; r++) for (let k = 0; k < cols; k++) {
      const on = rnd() < 0.36, x = 40 + k * (cw0 + gap), y = 40 + r * (ch0 + gap);
      g.save(); if (on) { g.shadowColor = "rgba(255,179,64,.45)"; g.shadowBlur = 24; }
      box(x, y, cw0, ch0, 8); g.fillStyle = on ? LAMP : OFF; g.fill(); g.restore();
    }
    const fade = g.createLinearGradient(0, 260, 0, 470);
    fade.addColorStop(0, "rgba(11,11,14,0)"); fade.addColorStop(1, NIGHT);
    g.fillStyle = fade; g.fillRect(0, 260, W, 210);

    // Kart
    const cx = 60, cy = 380, cw = W - 120, ch = 600;
    box(cx, cy, cw, ch, 44); g.fillStyle = CARD; g.fill();
    g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,.08)"; g.stroke();
    g.fillStyle = LAMP; g.font = `700 26px ${F}`;
    g.fillText("EV GENCİ SAKİN KARTI", cx + 48, cy + 66);
    g.textAlign = "right"; g.fillText(`DAİRE ${daire(h)}`, cx + cw - 48, cy + 66); g.textAlign = "left";
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(cx, cy + 100, cw, 2);

    // Yanan pencere
    const wx = cx + 48, wy = cy + 140, ww = 230, wh = 290;
    g.save(); g.shadowColor = "rgba(255,179,64,.5)"; g.shadowBlur = 50;
    box(wx, wy, ww, wh, [44, 44, 18, 18]); g.fillStyle = LAMP; g.fill(); g.restore();
    const eq = u === S.user ? S.eq : {};
    const perde = eq.perde && item(eq.perde);
    g.save(); box(wx, wy, ww, wh, [44, 44, 18, 18]); g.clip();
    if (perde) { g.fillStyle = perde.color; g.fillRect(wx, wy, 64, wh); g.fillRect(wx + ww - 64, wy, 64, wh); }
    const sx = wx + ww / 2, sy = wy + wh;
    g.fillStyle = "rgba(26,17,0,.82)"; g.beginPath(); g.moveTo(sx - 66, sy); g.lineTo(sx - 66, sy - 116); g.arc(sx, sy - 116, 66, Math.PI, 0); g.lineTo(sx + 66, sy); g.closePath(); g.fill();
    g.fillStyle = LAMP; g.font = `800 92px ${F}`; g.textAlign = "center";
    g.fillText(String(u.name || "?")[0].toLocaleUpperCase("tr"), sx, sy - 78);
    g.fillStyle = FRAME; g.fillRect(sx - 5, wy, 10, wh); g.fillRect(wx, wy + wh * 0.4, ww, 10);
    g.restore();
    g.lineWidth = 10; g.strokeStyle = FRAME; box(wx, wy, ww, wh, [44, 44, 18, 18]); g.stroke();
    const evcil = eq.evcil && item(eq.evcil), saksi = eq.saksi && item(eq.saksi);
    g.font = `64px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; g.textAlign = "center";
    if (saksi) g.fillText(saksi.emoji, wx + ww - 44, sy - 8);
    if (evcil) g.fillText(evcil.emoji, wx + 44, sy - 8);
    g.textAlign = "left";

    // Kimlik
    const tx = wx + ww + 48, tw = cx + cw - 48 - tx;
    let size = 60; g.font = `700 ${size}px ${F}`;
    while (size > 34 && g.measureText("@" + h).width > tw) { size -= 2; g.font = `700 ${size}px ${F}`; }
    g.fillStyle = "#fff"; g.fillText(fit("@" + h, tw), tx, wy + 52);
    g.fillStyle = LAMP; g.font = `600 32px ${F}`; g.fillText(fit(titleFor(days).name, tw), tx, wy + 100);
    const wake = D.wakes.find((w) => w.id === u.wake);
    const games = (u.games || []).map((id) => D.games.find((x) => x.id === id)?.short).filter(Boolean);
    const rows = [["Evde", `${nf(days)}. gün`], ["Işık yanar", wake?.title || "-"], ["Ana mesai", games.slice(0, 2).join(", ") || "Dizi, uyku"], ["Şehir", u.city || "Gizli"]];
    const colW = (tw - 30) / 2;
    rows.forEach(([k, v], i) => {
      const x = tx + (i % 2) * (colW + 30), y = wy + 180 + Math.floor(i / 2) * 104;
      g.fillStyle = DIM; g.font = `500 24px ${F}`; g.fillText(k, x, y);
      g.fillStyle = "#fff"; g.font = `600 32px ${F}`; g.fillText(fit(v, colW), x, y + 42);
    });
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(cx, cy + ch - 80, cw, 2);
    g.fillStyle = DIM; g.font = `500 24px ${F}`;
    g.fillText(`No ${cardNo(u)}`, cx + 48, cy + ch - 32);
    g.textAlign = "right"; g.fillText("evdeyiz apt. · süresiz", cx + cw - 48, cy + ch - 32); g.textAlign = "left";

    // Alt yazı
    let hs = 92; g.font = `800 ${hs}px ${F}`;
    while (hs > 56 && g.measureText("Ben de ev genciyim.").width > W - 120) { hs -= 2; g.font = `800 ${hs}px ${F}`; }
    g.fillStyle = "#fff"; g.fillText("Ben de ev genciyim.", 60, 1100);
    g.fillStyle = LAMP; g.fillText("Sen de.", 60, 1100 + hs * 1.02);
    g.fillStyle = DIM; g.font = `500 30px ${F}`; g.fillText(SITE, 60, 1300);
    return c;
  }

  /* "2 yeni not" düğmesi: panoda bir süre kalınca belirir */
  let pillTimer = null;
  function armPill() {
    clearTimeout(pillTimer);
    if (S.extra || !S.user) return;
    pillTimer = setTimeout(() => { if (!S.extra && ui.view === "app") { ui.pill = true; if (S.tab === "feed" && !ui.modal && !ui.story) render(); } }, 18000);

  /* Not asıldıktan sonra komşular tepki verir */

    setTimeout(() => {
      const p = S.posts.find((x) => x.id === id); if (!p) return;
      p.r = { reply: hash(id) % 4, repost: hash(p.text) % 6, like: 4 + (hash(p.text + id) % 30), views: 60 + (hash(id + "v") % 400) };
      notify(`${p.r.like} komşu ${kind === "fiş" ? "fişine" : "notuna"} "ben de" dedi.`, "hand", { tab: "feed" });
      save(); if (ui.view === "app" && !ui.modal && !ui.story) render();

    const d = ui.onb.data;
    S.user = { name: d.name.trim(), since: d.since, games: d.games.slice(), wake: d.wake, city: d.city, joinedAt: today() };
    S.tab = "feed";
    earn(10);
    notify("Kapıcı kapına bugünün poşetini bıraktı.", "bag", { tab: "feed" });
    notify("Apartman yönetimi: Hoş geldin komşu. Kapına 10 çay bıraktık.", "tea", { modal: "shop" });
    save();
    ui.view = "app"; render(); top(); armPill();
    toast("Hoş geldin komşu. Önce ışığını yak.");
  }
  const A = {
    start() { ui.view = "onb"; ui.onb = blankOnb(); render(); setTimeout(() => document.getElementById("onb-name")?.focus(), 30); },
    "onb-back"() { if (ui.onb.step === 0) ui.view = "landing"; else ui.onb.step--; render(); },
    "onb-next"() { if (ui.onb.step < ONB - 1) { ui.onb.step++; render(); } else finishOnb(); },
    "onb-skip"() { ui.onb.data.games = []; ui.onb.step = ONB - 1; render(); },
    "onb-pick"(el) { ui.onb.data[el.dataset.k] = el.dataset.v; render(); },
    "onb-game"(el) { const l = ui.onb.data.games, i = l.indexOf(el.dataset.v); if (i >= 0) l.splice(i, 1); else l.push(el.dataset.v); render(); },

    tab(el) {
      S.tab = el.dataset.v;
      if (S.tab === "rooms") S.unread = 0;
      ui.room = null; ui.typing = null; ui.modal = null;
      save(); render(); top();
    },
    go(el) {
      const v = el.dataset.v;
      if (v === "light") A.checkin();
      else if (v === "compose") A.compose();
      else if (v === "rooms") { S.tab = "rooms"; ui.room = "genel"; save(); render(); bottomScroll(); setTimeout(() => document.getElementById("chat-input")?.focus({ preventScroll: true }), 60); }
      else if (v === "shop") { ui.modal = "shop"; render(); }
    },
    feedtab(el) { S.feedTab = el.dataset.v; save(); render(); },
    hashtag(el) { ui.hashtag = el.dataset.v; ui.search = ""; S.tab = "feed"; ui.room = null; ui.modal = null; render(); top(); },
    "clear-filter"() { ui.hashtag = null; ui.search = ""; const s = document.getElementById("search"); if (s) s.value = ""; render(); },
    "more-trends"() { ui.allTrends = !ui.allTrends; render(); },
    "show-new"() { S.extra = true; ui.pill = false; save(); render(); top(); },
    follow(el) {
      const h = el.dataset.v; S.follows[h] = !S.follows[h]; save(); render();
      if (S.follows[h]) { toast(`${person(h).name} kapıyı açtı. Artık komşusunuz.`); setTimeout(() => { notify(`${person(h).name} de senin kapını çaldı.`, "door", { tab: "me" }); if (ui.view === "app" && !ui.story) render(); }, 3000); }
    },

    checkin() {
      const t = today();
      if (S.checkins.includes(t)) return;
      const y = ymd(addDays(new Date(), -1)), y2 = ymd(addDays(new Date(), -2));
      let usedBulb = false;
      if (!S.checkins.includes(y) && S.checkins.includes(y2) && S.bulbs > 0) { S.checkins.push(y); S.bulbs--; usedBulb = true; }
      S.checkins.push(t);
      earn(5);
      const st = streak();
      const bonus = { 3: 10, 7: 25, 14: 40, 30: 80 }[st] || 0;
      if (bonus) { earn(bonus); notify(`${st} günlük ışık serisi! ${bonus} çay ödül.`, "bulb", { tab: "me" }); }
      save(); render();
      toast(usedBulb ? `Dün ışığın sönmüştü, yedek ampul serini kurtardı. Seri: ${st} gün` : bonus ? `${st} gün seri! +${5 + bonus} çay` : `Işığın yandı. +5 çay · Seri: ${st} gün`);
    },
    box() {
      if (S.box === today()) return;
      const seed = hash(today() + myHandle());
      const n = 3 + (seed % 10);
      const bulb = seed % 7 === 0;
      S.box = today();
      earn(n);
      if (bulb) S.bulbs++;
      ui.rewardTea = n;
      ui.rewardText = pick(D.kapici, seed >> 2).replace("{n}", n) + (bulb ? " Bir de yedek ampul çıktı!" : "");
      ui.modal = "reward";
      save(); render();
    },
    answer(el) { S.qa[today()] = Number(el.dataset.v); earn(2); save(); render(); toast("Oyun tutanağa geçti. +2 çay"); },
    "list-claim"() { S.listDone = true; earn(20); notify("Taşınma tamam! Yerleşik sakin rozeti ve 20 çay senin.", "trophy", { tab: "me" }); save(); render(); toast("Artık yerleşik sakinsin. +20 çay"); },

    like(el) { const id = el.dataset.v; S.likes[id] = !S.likes[id]; save(); render(); },

    reply() { toast("Yorumlar bir sonraki sürümde geliyor"); },
    "share-post"(el) { const p = allPostsRaw().find((x) => x.id === el.dataset.v); if (p) copyText(`"${p.text}" · evdeyiz panosundan: ${SITE}`, "Not kopyalandı"); },

    "calc-post"() {

      S.posts.push({ id: "my" + Date.now(), at: Date.now(), anon: false,
        text: `Fişimi kestim: ${nf(S.calc.maas)} ₺ teklif saatine ${nf(r.saatlik)} ₺ ediyor. ${r.evKal ? "Evde kalıyorum." : "Bu teklifi düşünüyorum."} #fişimikestim`,
        calc: { maas: S.calc.maas, saatlik: Math.round(r.saatlik), evKal: r.evKal }, r: { reply: 0, repost: 0, like: 0, views: 1 } });
      earn(3); afterPost(S.posts[S.posts.length - 1].id, "fiş");
      S.tab = "feed"; S.feedTab = "foryou"; ui.hashtag = null; ui.search = ""; save(); render(); top();

    },

    async "card-share"(el) {
      if (el.disabled) return;
      el.disabled = true;
      try {
        const canvas = await drawCard();
        ui.cardUrl = canvas.toDataURL("image/png");
        cardFile = null;
        if (window.File && canvas.toBlob) {
          const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
          if (blob) cardFile = new File([blob], cardFileName(), { type: "image/png" });
        }
        ui.modal = "card"; render();
      } catch {
        toast("Görsel hazırlanamadı. Metni kopyalayabilirsin.");
        el.disabled = false;
      }
    },
    async "card-send"() {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: "share-image", url: ui.cardUrl, text: cardText() }));
        return;
      }
      try { await navigator.share({ files: [cardFile], text: cardText() }); }
      catch (e) { if (e && e.name !== "AbortError") toast("Paylaşılamadı. Görseli kaydedip paylaşabilirsin."); }
    },
    ptab(el) { ui.ptab = el.dataset.v; render(); },

    "shop-cat"(el) { ui.shopCat = el.dataset.v; render(); },
    buy(el) {
      const x = item(el.dataset.v); if (!x || S.tea < x.price) return;
      S.tea -= x.price;
      if (x.cat === "ampul") { S.bulbs++; save(); render(); toast(`Yedek ampul alındı. Elinde ${S.bulbs} tane var.`); return; }
      S.inv.push(x.id); S.eq[x.cat] = x.id; save(); render();
      toast(`${x.name} pencerene takıldı. Bütün apartman görüyor.`);
    },
    equip(el) { const x = item(el.dataset.v); if (!x) return; S.eq[x.cat] = x.id; save(); render(); },
    unequip(el) { const x = item(el.dataset.v); if (!x) return; delete S.eq[x.cat]; save(); render(); },
    "notif-go"(el) {
      const n = S.notifs.find((x) => x.id === el.dataset.v);
      ui.modal = null;
      if (n?.go?.tab) { S.tab = n.go.tab; ui.room = null; save(); render(); top(); }
      else if (n?.go?.modal) { ui.modal = n.go.modal; render(); }
      else render();
    },

    modal(el) {
      ui.modal = el.dataset.v; ui.confirmReset = false;
      render();
      if (ui.modal === "notifs" && unreadNotifs()) { S.notifs.forEach((n) => { n.read = true; }); save(); }
    },
    "modal-close"() { ui.modal = null; ui.confirmReset = false; render(); },
    theme(el) { const v = el.dataset.v; S.theme = v === "null" ? null : v; save(); render(); },
    "reset-ask"() { ui.confirmReset = true; render(); },
    "reset-cancel"() { ui.confirmReset = false; render(); },
    reset() {
      clearInterval(storyTick); clearTimeout(pillTimer); store.clear(); S = fresh();
      Object.assign(ui, { view: "landing", onb: blankOnb(), room: null, game: "all", hashtag: null, search: "", modal: null, confirmReset: false, story: null, ptab: "posts", typing: null, anon: false, pill: false });
      render(); top();
    }
  };
  const allPostsRaw = () => S.posts.map((p) => ({ ...p, mine: true })).concat(D.incoming, D.feed);

  function submitPost(form) {
    const where = form.dataset.where;
    const ta = document.getElementById("pt-" + where);
    const text = (ta?.value || "").trim();
    if (text.length < 3) { toast("Biraz daha yaz, apartman dinliyor"); ta?.focus(); return; }
    S.posts.push({ id: "my" + Date.now(), at: Date.now(), text, anon: ui.anon, r: { reply: 0, repost: 0, like: 0, views: 1 } });
    if (S.posts.length > 60) S.posts = S.posts.slice(-60);
    earn(3);
    ta.value = "";
    const first = S.posts.length === 1;
    ui.modal = null; ui.anon = false; ui.hashtag = null; ui.search = ""; S.tab = "feed"; S.feedTab = "foryou";
    save(); render(); top();
    toast(first ? "İlk notun panoda. İtirafçı rozeti ve +3 çay senin." : "Notun panoya asıldı. +3 çay");
    afterPost(S.posts[S.posts.length - 1].id);
  }

  function sendMsg(text) {
    text = String(text || "").trim();
    const roomId = ui.room;
    if (!text || !roomId) return;
    (S.rooms[roomId] ||= []).push({ me: true, text });
    if (S.rooms[roomId].length > 60) S.rooms[roomId] = S.rooms[roomId].slice(-60);
    earn(1);
    const mine = roomMine();
    save();
    if (mine === 3) toast("Muhabbetçi rozeti senin");
    const who = pick(D.replyHandles, hash(text + mine));
    ui.typing = who;
    render(); bottomScroll();
    setTimeout(() => {
      (S.rooms[roomId] ||= []).push({ h: who, text: pick(D.replies, hash(text) + mine) });
      const here = ui.view === "app" && S.tab === "rooms" && ui.room === roomId;
      ui.typing = null;
      if (!here) { S.unread = (S.unread || 0) + 1; notify(`@${who} ${D.rooms.find((r) => r.id === roomId).title} odasında sana cevap verdi.`, "comment", { tab: "rooms" }); }
      save();
      if (ui.view === "app" && !ui.story) { render(); if (here) bottomScroll(); }
    }, 1400);
  }

  /* ───────── Events ───────── */
  const HAPTIC = new Set(["like", "checkin", "box", "vote", "answer", "onb-next", "onb-pick", "onb-game", "buy", "repost", "follow", "tab", "card-share", "card-send", "list-claim"]);
  document.addEventListener("click", (e) => {
    if (e.target.classList?.contains("ov")) {
      if (ui.view === "onb") return;
      ui.modal = null; ui.confirmReset = false; render(); return;
    }
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const fn = A[el.dataset.a];
    if (!fn) return;
    e.preventDefault();
    if (HAPTIC.has(el.dataset.a)) buzz(el.dataset.a === "checkin" || el.dataset.a === "box" ? "success" : "light");
    fn(el, e);
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "onb-name") {
      ui.onb.data.name = t.value;
      const n = document.querySelector('[data-a="onb-next"]'); if (n) n.disabled = t.value.trim().length < 2;
    } else if (t.id === "search") {
      ui.search = t.value; ui.hashtag = null;
      if (S.tab !== "feed") { S.tab = "feed"; ui.room = null; }
      render();
    } else if (t.dataset.calc) {
      const v = parseFloat(t.value);
      S.calc[t.dataset.calc] = Number.isFinite(v) && v >= 0 ? v : 0;
      S.calcUsed = true; save();
      const out = document.getElementById("calc-out"); if (out) out.innerHTML = receipt(calcView());
    } else updateCounter(t);
  });

  document.addEventListener("focusin", (e) => { if (e.target.id === "story-reply" && ui.story) ui.story.paused = Date.now() - ui.story.start; });
  document.addEventListener("focusout", (e) => { if (e.target.id === "story-reply" && ui.story && ui.story.paused) { ui.story.start = Date.now() - ui.story.paused; ui.story.paused = false; } });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "onb-name" && e.target.value.trim().length > 1) { e.preventDefault(); A["onb-next"](); return; }
    if (ui.story && e.target.id !== "story-reply") {
      if (e.key === "Escape") closeStory();
      else if (e.key === "ArrowRight") storyStep(1);
      else if (e.key === "ArrowLeft") storyStep(-1);
      return;
    }
    if (e.key === "Escape" && ui.modal) { ui.modal = null; ui.confirmReset = false; render(); }
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id?.startsWith("pt-")) { e.preventDefault(); submitPost(e.target.closest("form")); }
  });

  document.addEventListener("submit", (e) => {
    const f = e.target, kind = f.dataset.form;
    if (!kind) return;
    e.preventDefault();
    if (kind === "post") submitPost(f);
    else if (kind === "chat") {
      const input = document.getElementById("chat-input"); const v = input.value; input.value = "";
      sendMsg(v); setTimeout(() => document.getElementById("chat-input")?.focus({ preventScroll: true }), 0);
    } else if (kind === "lobby") {
      const note = document.getElementById("lob-note").value.trim();
      if (!note) { toast("Ne aradığını yaz, eşleşme kolaylaşsın"); document.getElementById("lob-note").focus(); return; }
      S.myLobbies.push({ id: "ml" + Date.now(), game: document.getElementById("lob-game").value, rank: document.getElementById("lob-rank").value.trim() || "Rank fark etmez", role: "İlan", note, need: 1 });
      if (S.myLobbies.length > 20) S.myLobbies = S.myLobbies.slice(-20);
      save(); ui.modal = null; ui.game = "all"; S.tab = "party"; render(); top();
      toast("İlanın oyun odasına asıldı");
    } else if (kind === "profile") {
      const v = document.getElementById("set-name").value.trim();
      if (v.length < 2) { toast("Kapıdaki isim en az 2 harf olmalı"); return; }
      S.user.name = v; S.user.wake = document.getElementById("set-wake").value; S.user.city = document.getElementById("set-city").value;
      save(); render(); toast("Daire bilgilerin güncellendi");
    } else if (kind === "story-reply") {
      const input = document.getElementById("story-reply");
      if (input.value.trim()) { input.value = ""; input.blur(); toast("Seslendin, pencereden duydular"); }
    }
  });

  render();
  if (ui.view === "app") armPill();
})();

</script>
</body>
</html>
