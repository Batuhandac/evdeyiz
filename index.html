    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    vote: '<path d="M9 12l2 2 4-4"/><path d="M5 7h14v13H5z"/><path d="M8 4h8v3H8z"/>',
    tea: '<path d="M8 3h8l-1.2 6.5c-.3 1.8.7 3 1 5 .4 3.2-1.6 6.5-3.8 6.5s-4.2-3.3-3.8-6.5c.3-2 1.3-3.2 1-5z"/><path d="M6 21h12"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
    bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
    store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/>',
    bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
    trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
    gear: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
    arrowUp: '<path d="M12 19V5M5 12l7-7 7 7"/>',
    dots: '<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
    block: '<circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>'
  };
  const ic = (n, cls = "ico", sw = 2) => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
  const star = () => `<svg class="star" viewBox="0 0 24 24" aria-label="Kıdemli sakin"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
  const av = (h, cls = "") => `<span class="av ${cls}" style="background:${colorOf(h)}" aria-hidden="true">${initial(h)}</span>`;
  const meAv = (cls = "") => `<span class="av ${cls}" style="background:var(--tomato)" aria-hidden="true">${initial(S.user?.name)}</span>`;
  const brand = () => `<span class="brand"><span class="mark" aria-hidden="true"><i></i><i class="on"></i><i></i><i></i></span>evdeyiz</span>`;
  const linkify = (t) => String(t).split(/(#[\p{L}\p{N}_]+)/u).map((part) => part.startsWith("#") && part.length > 1
    ? `<button class="hashtag" data-a="hashtag" data-v="${esc(part.slice(1))}">${esc(part)}</button>`
    : esc(part)).join("");
  const win = (on, extra = "") => `<span class="w ${on ? "on" : ""} ${extra}" aria-hidden="true"></span>`;
  const item = (id) => D.shop.find((x) => x.id === id);

  /* Süslü pencere: bakkaldan alınan eşyalar burada görünür */
  function windowArt(eq = S.eq, name = S.user?.name, cls = "") {
    const perde = eq.perde && item(eq.perde), saksi = eq.saksi && item(eq.saksi), evcil = eq.evcil && item(eq.evcil);
    const isik = eq.isik || "";
    return `<span class="big-win ${cls} ${isik ? "deco-" + isik : ""}" aria-hidden="true">
      ${perde ? `<i class="curtain l" style="background:${perde.color}"></i><i class="curtain r" style="background:${perde.color}"></i>` : ""}
      <span class="sil">${initial(name)}</span>
      ${evcil ? `<span class="pet">${evcil.emoji}</span>` : ""}
      ${saksi ? `<span class="sill">${saksi.emoji}</span>` : ""}
    </span>`;
  }

  /* Apartman cephesi */
  function facade(cols, rows, { showMe = false, caption = true } = {}) {
    const total = cols * rows;
    const meIdx = S.user ? (myDaire() || daire(myHandle())) % total : -1;
    const meOn = showMe && S.checkins.includes(today());
    let seed = hash(today() + cols) || 1;
    const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const cells = Array.from({ length: total }, (_, i) => {
      const r = rand();
      if (i === meIdx && meOn) return win(true, "me");
      return win(r < 0.4, r > 0.93 ? "tw" : "");
    }).join("");
    return `<div class="facade">
      <div class="facade-roof"></div>
      <div class="facade-grid" style="--cols:${cols}">${cells}</div>
      <div class="facade-door"></div>
      ${caption ? `<div class="facade-cap"><div class="row" style="gap:8px"><span class="live-dot"></span><span class="xs" style="color:rgba(245,240,255,.7)">Apartmanda</span></div><div class="facade-num">${nf(onlineNum())}</div><p>${onlineNum() > 1 ? "komşu şu an evde" : "Kapı açık, komşular uğradıkça ışıklar yanar"}${meOn && onlineNum() > 1 ? ". Biri de sensin." : ""}</p></div>` : ""}
    </div>`;
  }

  /* ───────── Landing ───────── */
  function landCount() {
    const st = R.stats;
    if (st && st.residents >= 50) return `<div class="land-count"><b class="num">${nf(st.residents)}</b><span>komşu taşındı${st.lit_today > 9 ? ` · bugün ${nf(st.lit_today)} ışık yandı` : ""}</span></div>`;
    return `<div class="land-count"><b class="num">Yeni</b><span>Apartman yeni açıldı. İlk sakinlerden ol, küçük daire numarası senin olsun.</span></div>`;
  }
  function landing() {
    return `
    <div class="landing">
      <header class="land-top">${brand()}<button class="btn sm ghost" data-a="start">Giriş yap</button></header>
      <main class="land-hero">
        <div class="land-copy">
          <h1>Ben de ev genciyim.<br><em>Sen de.</em></h1>
          <p class="lead">Burada kimse "iş buldun mu?" diye sormaz.</p>
        </div>
        <div class="land-art">
          ${facade(9, 7, { caption: false })}
          ${landCount()}
          <div class="float-note n1" hidden><div class="row" style="gap:10px">${av("kanepe_kral", "s32")}<div><b class="sm">Kanepe Kralı</b><div class="xs muted">Daire ${daire("kanepe_kral")} · 2 sa</div></div></div><p class="sm" style="margin-top:8px">30k teklif geldi, saati 99 lira. Reddettim.</p><span class="bende on">${ic("hand", "ico-sm")}Ben de <span class="cnt">1,2B</span></span></div>
          <div class="float-note n2" hidden><div class="row" style="gap:10px"><span class="room-ic">${ic("moon", "ico-sm")}</span><div><b class="sm">Balkon</b><div class="xs muted">Gece 3'te çay ve muhabbet</div></div></div><p class="sm" style="margin-top:8px"><span class="online"><span class="live-dot"></span>640 kişi şu an burada</span></p></div>
        </div>
        <div class="land-cta">
          <button class="btn lamp lg block" data-a="start">Anahtarını al</button>
          <p class="xs faint">Ücretsiz · takma adla · 30 saniye</p>
        </div>
      </main>
      <footer class="land-foot">${ext(RULES, "Apartman kuralları")}${ext(PRIVACY, "Gizlilik")}${ext(SUPPORT, "Destek")}<span>© 2026 evdeyiz</span></footer>
    </div>`;
  }

  /* ───────── Onboarding: 4 adım ───────── */
  const ONB = 4;
  function onboarding() {
    const { step, data } = ui.onb;
    let body = "", can = true, next = "Devam", skip = "";
    if (step === 0) {
      can = data.name.trim().length > 1;
      body = `<h2>Kapına ne yazalım?</h2><p class="hint">Takma ad yeter. Apartmanda bu adla görüneceksin.</p>
        <div class="field"><label for="onb-name">Takma ad</label><div class="input"><input id="onb-name" maxlength="18" autocomplete="nickname" placeholder="ör. kanepe_kral" value="${esc(data.name)}" /></div></div>`;
    } else if (step === 1) {
      can = !!data.since;
      body = `<h2>Ne zamandır evdesin?</h2><p class="hint">Apartmandaki kıdemin buna göre belirlenir.</p><div>${D.since.map((s) => `
        <button class="choice" data-a="onb-pick" data-k="since" data-v="${s.id}" aria-pressed="${data.since === s.id}">${win(data.since === s.id)}<span><b>${esc(s.title)}</b><span class="sub">${esc(s.sub)}</span></span></button>`).join("")}</div>`;
    } else if (step === 2) {
      next = "Anahtarımı ver";
      can = data.games.length > 0;
      skip = can ? "" : `<button class="btn ghost block" data-a="onb-skip">Oyun oynamıyorum, geç</button>`;
      body = `<h2>Ana mesain ne?</h2><p class="hint">Oyun odasında sana uygun lobileri gösteririz. Birden fazla seçebilirsin.</p>
        <div class="game-grid">${D.games.map((g) => `<button class="game-pick" data-a="onb-game" data-v="${g.id}" aria-pressed="${data.games.includes(g.id)}"><span class="gcode" style="background:${g.color}">${g.code}</span><span class="grow">${esc(g.short)}</span>${data.games.includes(g.id) ? `<span style="color:var(--lamp-text)">${ic("check", "ico-sm", 3)}</span>` : ""}</button>`).join("")}</div>`;
    } else {
      next = ui.busy === "onb" ? "Anahtar hazırlanıyor…" : "Daireme gir";
      body = `<h2>Anahtarın hazır.</h2><p class="hint">Sakin kartın aşağıda. Daire numaran girince belli olacak. Kapında 10 çay seni bekliyor.</p>${sakinCard({ ...data, joinedAt: today() }, {})}<p class="xs muted consent">Daireme gir’e basınca ${ext(RULES, "apartman kurallarını")} ve ${ext(PRIVACY, "gizlilik metnini")} kabul etmiş olursun. Taciz, nefret söylemi ve “git iş bul” nasihati yasak; kuralı çiğneyen apartmandan çıkarılır.</p>`;
    }
    return `
    <div class="ov onb" role="dialog" aria-modal="true" aria-label="Kayıt">
      <div class="sheet">
        <div class="onb-top"><button class="icon-btn" data-a="onb-back" aria-label="${step ? "Geri" : "Kapat"}">${ic(step ? "back" : "x")}</button>${brand()}<span class="sm faint" style="width:40px;text-align:right">${step + 1}/${ONB}</span></div>
        <div class="onb-body">${body}</div>
        <div class="onb-foot">
          <div class="floors" aria-hidden="true">${Array.from({ length: ONB }, (_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>
          <button class="btn lamp lg block" data-a="onb-next" ${can && ui.busy !== "onb" ? "" : "disabled"}>${next}</button>
          ${skip}
        </div>
      </div>
    </div>`;
  }

  function sakinCard(u, eq = S.eq) {
    const days = daysAtHome(u);
    const wake = D.wakes.find((w) => w.id === u.wake);
    const games = (u.games || []).map((g) => D.games.find((x) => x.id === g)?.short).filter(Boolean);
    const h = u.handle || handleOf(u.name);
    return `
    <section class="sakin" aria-label="Sakin kartı">
      <div class="sakin-top"><span>EV GENCİ SAKİN KARTI</span><span>DAİRE ${u.daire || "YENİ"}</span></div>
      <div class="sakin-body">
        ${windowArt(eq, u.name)}
        <div class="grow">
          <div class="sakin-name">@${esc(h)}</div>
          <div class="sakin-title">${esc(titleFor(days).name)}</div>
          <dl>
            <div><dt>Evde</dt><dd>${nf(days)}. gün</dd></div>
            <div><dt>Işık yanar</dt><dd>${esc(wake?.title || "-")}</dd></div>
            <div><dt>Ana mesai</dt><dd>${esc(games.slice(0, 2).join(", ") || "Dizi, uyku")}</dd></div>
            <div><dt>Şehir</dt><dd>${esc(u.city || "Gizli")}</dd></div>
          </dl>
        </div>
      </div>
      <div class="sakin-foot"><span>No ${cardNo(u)}</span><span>evdeyiz apt. · süresiz</span></div>
    </section>`;
  }

  /* ───────── Shell ───────── */
  const TABS = [["feed", "Pano", "board"], ["party", "Oyun", "pad"], ["rooms", "Odalar", "door"], ["calc", "Fiş", "receipt"], ["me", "Dairem", "window"]];
  function shell() {
    const pages = { feed: pageFeed, party: pageParty, rooms: pageRooms, calc: pageCalc, me: pageMe };
    const un = unreadNotifs();
    return `
    <div class="app ${S.tab === "rooms" && ui.room ? "in-room" : ""}">
      <header class="top"><div class="top-inner">
        <button data-a="tab" data-v="feed" aria-label="Panoya dön">${brand()}</button>
        <label class="search">${ic("search", "ico-sm")}<input id="search" type="search" placeholder="Panoda ara" value="${esc(ui.search)}" autocomplete="off" aria-label="Panoda ara" /></label>
        <div class="top-actions">
          <button class="btn lamp sm desk" data-a="compose">${ic("plus", "ico-sm", 2.6)}Not bırak</button>
          <button class="tea-chip" data-a="modal" data-v="shop" aria-label="${S.tea} çay, bakkalı aç">${ic("tea", "ico-sm")}<span class="num">${S.tea}</span></button>
          <button class="icon-btn bell" data-a="modal" data-v="notifs" aria-label="Bildirimler${un ? `, ${un} yeni` : ""}">${ic("bell")}${un ? `<span class="dot-badge">${un > 9 ? "9+" : un}</span>` : ""}</button>
          <button data-a="tab" data-v="me" aria-label="Dairem">${meAv("s32")}</button>
        </div>
      </div></header>
      ${R.offline ? `<div class="offline-bar">${ic("bulb", "ico-sm")}Bağlantı yok. Tekrar bağlanınca apartman güncellenir.</div>` : ""}
      <div class="wrap">
        <main class="main">${pages[S.tab]()}</main>
        <aside class="aside" aria-label="Apartman">${side()}</aside>
      </div>
      <nav class="dock" aria-label="Ana menü">
        ${TABS.map(([id, label, icon]) => `<button data-a="tab" data-v="${id}" ${S.tab === id ? 'aria-current="page"' : ""}>${ic(icon)}${label}${id === "rooms" && S.unread && S.tab !== "rooms" ? `<span class="badge">${S.unread > 9 ? "9+" : S.unread}</span>` : ""}</button>`).join("")}
      </nav>
    </div>
    ${modal()}`;
  }

  /* Panodaki etiketler: son notlardan sayılır */
  function trends() {
    const c = new Map();
    for (const p of R.feed) for (const m of String(p.text).matchAll(/#([\p{L}\p{N}_]{2,30})/gu)) { const t = lower(m[1]); c.set(t, (c.get(t) || 0) + 1); }
    return [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, 7);
  }

  function side() {
    const tr = trends();
    const shown = ui.allTrends ? tr : tr.slice(0, 5);
    return `
      ${facade(8, 6, { showMe: true })}
      ${leadersCard()}
      ${tr.length ? `<section class="card">
        <h2 class="list-title">Panoda konuşulan</h2>
        ${shown.map(([t, n], i) => `<button class="list-row" data-a="hashtag" data-v="${esc(t)}"><span class="trend-rank">${i + 1}</span><span class="grow"><span class="b" style="display:block">#${esc(t)}</span><span class="xs muted">${nf(n)} not</span></span></button>`).join("")}
        ${tr.length > 5 ? `<button class="list-more" data-a="more-trends">${ui.allTrends ? "Daha az göster" : "Tümünü göster"}</button>` : ""}
      </section>` : ""}
      ${R.newbies.length ? `<section class="card" style="padding-bottom:8px">
        <h2 class="list-title">Yeni taşınanlar</h2>
        ${R.newbies.map((p) => `<button class="list-row" data-a="neighbor" data-v="${p.id}">${av(p.handle)}<div class="grow"><div class="b ellip">${esc(p.name)}</div><div class="xs muted">Daire ${p.daire} · ${esc(ago(new Date(p.created_at).getTime()))}</div></div></button>`).join("")}
      </section>` : ""}
      <div class="side-foot">${ext(RULES, "Apartman kuralları")}${ext(PRIVACY, "Gizlilik")}${ext(SUPPORT, "Destek")}<span>© 2026 evdeyiz</span></div>`;
  }

  function leadersCard(extraCls = "") {
    const st = streak();
    const L = R.leaders || {};
    const rows = [["likes", "En çok \"ben de\" alan", (v) => k(v)], ["lights", "En çok ışık yakan", (v) => `${v} gün`], ["night", "Balkonun gece sakini", (v) => `${v} mesaj`]]
      .map(([key, label, fmt]) => { const x = (L[key] || [])[0]; return x ? { label, x, v: fmt(x.value) } : null; }).filter(Boolean);
    return `<section class="card leaders ${extraCls}">
      <h2 class="list-title">${ic("trophy", "ico-sm")}Haftanın en'leri</h2>
      ${rows.length ? rows.map((r) => `<div class="list-row">${av(r.x.handle, "s32")}<div class="grow"><div class="xs muted">${esc(r.label)}</div><div class="b ellip">${esc(r.x.name)}</div></div><b class="num">${esc(r.v)}</b></div>`).join("") : `<p class="sm muted" style="padding:4px 0 8px">Bu hafta liste boş. İlk sen gir: ışığını yak, panoya not as.</p>`}
      <div class="leader-me">${st ? `Senin serin <b>${st} gün</b>. Yarın da yak, seri büyüsün.` : "Bugün ışığını yak, sıralamaya gir."}</div>
    </section>`;
  }

  /* ───────── Pano ───────── */
  function visiblePosts(list) {
    return list.filter((p) => p.mine || (!R.hidden.has(p.id) && notMuted(p.a_id)));
  }
  function allPosts() {
    let list = visiblePosts(R.feed);
    if (ui.hashtag) list = list.filter((p) => lower(p.text).includes("#" + lower(ui.hashtag)));
    if (ui.search.trim()) { const s = lower(ui.search.trim()); list = list.filter((p) => lower(p.text).includes(s) || lower(p.a_handle || "").includes(s) || lower(p.a_name || "").includes(s)); }
    return list;
  }
  function pageFeed() {
    const posts = allPosts();
    const filter = ui.hashtag || ui.search.trim();
    const notes = posts.map(noteHtml);
    if (!filter && notes.length > 3) notes.splice(3, 0, leadersCard("feed-leaders"));
    let empty;
    if (!R.feedLoaded) empty = `<div class="card empty"><span class="win lit"></span><h2>Pano yükleniyor</h2><p>Kapıcı notları topluyor.</p></div>`;
    else if (filter) empty = `<div class="card empty"><span class="win"></span><h2>Panoda bu konuda not yok</h2><p>İlk notu sen bırak. Apartman dinliyor.</p></div>`;
    else empty = `<div class="card empty"><span class="win"></span><h2>Pano bugün sessiz</h2><p>İlk notu sen as, komşular "ben de" desin.</p><button class="btn lamp" data-a="compose">Not bırak</button></div>`;
    return `
      ${R.newer && !filter ? `<button class="new-pill" data-a="show-new">${ic("arrowUp", "ico-sm", 2.6)}${R.newer} yeni not</button>` : ""}
      <div class="page-head">
        <div><h1>Pano</h1><p>${timeLine()}</p></div>
      </div>
      ${filter ? `<div class="filter-bar"><span><span class="muted">Panoda:</span> <b>${ui.hashtag ? "#" + esc(ui.hashtag) : `"${esc(ui.search.trim())}"`}</b> · ${posts.length} not</span><button class="btn sm ghost" data-a="clear-filter">Temizle</button></div>` : `${todayCard()}${annHtml(annFor("pano"))}${windowsRow()}${checklistCard()}${questionCard()}`}
      ${composer("inline")}
      <div class="seg wide" role="group" aria-label="Sıralama"><button data-a="feedtab" data-v="foryou" aria-pressed="${S.feedTab === "foryou"}">Yeni</button><button data-a="feedtab" data-v="popular" aria-pressed="${S.feedTab === "popular"}">Haftanın "ben de"leri</button></div>
      ${notes.length ? notes.join("") : empty}
      ${R.feedMore && notes.length && !filter ? `<button class="btn ghost block" data-a="more-feed" ${ui.busy === "more" ? "disabled" : ""}>Daha eski notlar</button>` : ""}`;
  }

  /* Bu gece ışığı yanan komşular */
  function windowsRow() {
    const lit = R.lit.filter((p) => notMuted(p.id));
    return `<div class="windows" aria-label="Işığı yanan komşular">
      <button class="win-btn" data-a="modal" data-v="shop" aria-label="Pencereni süsle">${windowArt(S.eq, S.user.name, "tiny")}<span class="win-name">Pencerem</span></button>
      ${lit.map((p) => `<button class="win-btn" data-a="neighbor" data-v="${p.id}" aria-label="${esc(p.handle)} penceresi">${windowArt(p.eq || {}, p.name, "tiny")}<span class="win-name">${esc(p.handle)}</span></button>`).join("")}
      ${lit.length ? "" : `<div class="win-hint">${S.checkins.includes(today()) ? "Bu gece ilk ışık senden. Komşular yaktıkça burada görünecek." : "Işığını yakan komşular burada görünür."}</div>`}
    </div>`;
  }

  /* Bugün kartı: ışık + kapıcı poşeti */
  function todayCard() {
    const lit = S.checkins.includes(today());
    const boxed = S.box === today();
    const week = Array.from({ length: 7 }, (_, i) => addDays(new Date(), i - 6));
    const st = streak();
    const nextMs = [3, 7, 14, 30].find((m) => m > st);
    const bonus = { 3: 10, 7: 25, 14: 40, 30: 80 }[nextMs];
    const line = lit ? (nextMs ? `${st} günlük seri · ${nextMs - st} gün sonra +${bonus} çay` : `${st} günlük seri · efsane`) : st ? `${st} günlük serin sönmesin · +5 çay` : "Bugün yak, +5 çay al";
    const litToday = R.stats?.lit_today || 0;
    return `<section class="hero-light">
      ${facade(11, 4, { showMe: true, caption: false })}
      <div class="hero-cap">
        <div class="grow"><b class="num">${nf(onlineNum())}</b><span>${onlineLine()}${litToday > 1 ? ` · bugün ${nf(litToday)} ışık yandı` : ""}</span></div>
        ${lit ? `<span class="pill-done">${ic("check", "ico-sm", 3)}Işığın yanıyor</span>` : `<button class="btn lamp" data-a="checkin">Işığımı yak</button>`}
      </div>
      <div class="hero-week"><span class="light-week" aria-hidden="true">${week.map((d) => `<i class="${S.checkins.includes(ymd(d)) ? "on" : ""}"></i>`).join("")}</span><span>${line}${S.bulbs ? ` · ${S.bulbs} yedek ampul` : ""}</span></div>
    </section>
    <section class="card cells">
      <div class="cell ${boxed ? "done" : ""}">
        <span class="cell-ic ${boxed ? "" : "wiggle"}">${ic("bag", "ico-sm")}</span>
        <div class="grow"><h3>${boxed ? "Poşet açıldı" : "Kapında poşet var"}</h3><p>${boxed ? "Kapıcı yarın yine uğrar" : "Kapıcı bir şey bıraktı"}</p></div>
        ${boxed ? `<span class="pill-done">${ic("check", "ico-sm", 3)}</span>` : `<button class="btn sm soft" data-a="box">Aç</button>`}
      </div>
    </section>`;
  }

  function checklistCard() {
    if (S.listDone) return "";
    const items = checklist();
    const done = items.filter((x) => x.done).length;
    const all = done === items.length;
    return `<section class="card checklist">
      <div class="row" style="justify-content:space-between"><h3>Taşınma listesi</h3><span class="sm muted num">${done}/${items.length}</span></div>
      <div class="meter"><i style="width:${(done / items.length) * 100}%"></i></div>
      ${items.map((x) => `<button class="check-row ${x.done ? "done" : ""}" data-a="go" data-v="${x.go}" ${x.done ? "disabled" : ""}><span class="tick">${x.done ? ic("check", "ico-sm", 3) : ""}</span><span class="grow">${esc(x.label)}</span>${x.done ? "" : ic("next", "ico-sm")}</button>`).join("")}
      ${all ? `<button class="btn lamp block" data-a="list-claim">${ic("tea", "ico-sm")}20 çay ödülünü al</button>` : `<p class="xs muted">Hepsini bitir, 20 çay ve "Yerleşik sakin" rozeti senin.</p>`}
    </section>`;
  }

  function questionCard() {
    const qq = D.questions[dayNo() % D.questions.length];
    const ans = S.qa[today()];
    const votes = qq.opts.map((_, i) => (R.qv?.[i] || 0));
    const total = votes.reduce((a, b) => a + b, 0);
    const max = Math.max(...votes);
    return `<section class="card pad meeting-card">
      <div class="meeting-title">${ic("vote", "ico-sm")}Günün apartman toplantısı${total ? ` · ${nf(total)} oy` : ""}</div>
      <h3 class="q">${esc(qq.q)}</h3>
      <div class="meeting flat">
        ${ans === undefined || !total
          ? qq.opts.map((o, i) => `<button class="opt" data-a="answer" data-v="${i}" ${ans !== undefined ? "disabled" : ""}><span>${esc(o)}</span></button>`).join("") + `<p class="xs muted">Oy ver, sonuçları gör · +2 çay</p>`
          : qq.opts.map((o, i) => { const pct = Math.round((votes[i] / total) * 100); return `<div class="opt ${votes[i] === max ? "win-opt" : ""}"><i class="bar" style="width:${pct}%"></i><span>${esc(o)}${ans === i ? ic("check", "ico-sm", 3) : ""}</span><span class="pct">%${pct}</span></div>`; }).join("") + `<p class="xs muted">Yarın yeni toplantı var.</p>`}
      </div>
    </section>`;
  }

  function composer(where) {
    return `<form class="card composer" data-form="post" data-where="${where}">
      ${ui.anon ? `<span class="av anon">${ic("lock", "ico-sm")}</span>` : meAv()}
      <div class="grow">
        <textarea id="pt-${where}" rows="2" maxlength="280" placeholder="Panoya bir not bırak…" aria-label="Not"></textarea>
        <div class="composer-foot">
          <button type="button" class="toggle" data-a="anon" aria-pressed="${ui.anon}"><span class="switch"></span>İsimsiz as</button>
          <div class="row" style="gap:12px"><span class="counter" id="cnt-${where}">0/280</span><button class="btn lamp sm" type="submit" ${ui.busy === "post" ? "disabled" : ""}>Panoya as</button></div>
        </div>
      </div>
    </form>`;
  }

  const kidemli = (since, created) => since && created && daysAtHome({ since, joinedAt: ymd(new Date(created)) }) >= 365;
  function noteHtml(p) {
    let name, avatar, no, badge = false;
    if (p.anon) { name = p.mine ? "İsimsiz komşu (sen)" : "İsimsiz komşu"; avatar = `<span class="av anon">${ic("lock", "ico-sm")}</span>`; no = "?"; }
    else if (p.mine) { name = S.user.name; avatar = meAv(); no = myDaire(); badge = kidemli(S.user.since, S.user.joinedAt); }
    else { name = p.a_name; avatar = av(p.a_handle); no = p.a_daire; badge = kidemli(p.a_since, p.a_created); }
    const at = new Date(p.created_at).getTime();
    return `
    <article class="card note" aria-label="${esc(name)} notu">
      <div class="note-head">${p.anon || p.mine ? avatar : `<button data-a="neighbor" data-v="${p.a_id}" aria-label="${esc(name)} dairesi">${avatar}</button>`}<div class="grow"><div class="note-name"><span>${esc(name)}</span>${badge ? star() : ""}</div><div class="note-meta">${p.anon ? "" : `<span class="daire">D.${no}</span>`}<span>${esc(ago(at))}</span></div></div>${modBtn(p.mine ? "mypost" : "post", p.id, p.a_id || "", p.a_handle || "")}</div>
      <div class="note-text">${linkify(p.text)}</div>
      ${p.calc ? `<button class="embed" data-a="tab" data-v="calc">${receipt(p.calc, true)}</button><div class="embed-cap">${ic("receipt", "ico-sm")}Kendi fişini kes</div>` : ""}
      <div class="note-foot">
        <button class="bende ${p.liked ? "on" : ""}" data-a="like" data-v="${p.id}" aria-pressed="${p.liked}">${ic("hand", "ico-sm")}Ben de <span class="cnt">${k(p.like_count)}</span></button>
        <button class="mini" data-a="thread" data-v="${p.id}" aria-label="Yorumlar">${ic("comment", "ico-sm")}${p.reply_count ? k(p.reply_count) : "Yaz"}</button>
        <button class="mini" data-a="share-post" data-v="${p.id}" aria-label="Paylaş">${ic("share", "ico-sm")}</button>
      </div>
    </article>`;
  }
  const modBtn = (kind, id, uid, h) => `<button class="icon-btn more" data-a="mod" data-k="${kind}" data-id="${esc(id)}" data-u="${esc(uid)}" data-h="${esc(h)}" aria-label="Seçenekler">${ic("dots")}</button>`;

  function receipt(c, mini = false) {
    const full = !mini && c.netKalan !== undefined;
    const no = String(hash(String(c.maas) + (c.saatlik || 0)) % 9000 + 1000);
    const d = new Date();
    return `<div class="receipt ${mini ? "mini-r" : ""}">
      <div class="receipt-head"><b>MAAŞ MI, EV Mİ?</b><span>Fiş ${no} · ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}</span></div>
      <div class="r-line"><span>Teklif (net)</span><span>${nf(c.maas)} ₺</span></div>
      ${full ? `
        <div class="r-line minus"><span>Yol</span><span>−${nf(c.yol)} ₺</span></div>
        <div class="r-line minus"><span>Yemek</span><span>−${nf(c.yemek)} ₺</span></div>
        <div class="r-sep"></div>
        <div class="r-line"><span>Eline kalan</span><span>${nf(c.netKalan)} ₺</span></div>
        <div class="r-line"><span>Mesai + yol</span><span>${nf(c.saat)} sa/ay</span></div>
        <div class="r-line"><span>Evde kalınca masraf</span><span>${nf(c.ev)} ₺</span></div>` : ""}
      <div class="r-sep"></div>
      <div class="r-total"><span>Saatin</span><b>${nf(c.saatlik)} ₺</b></div>
      <span class="stamp ${c.evKal ? "" : "go"}">${c.evKal ? "EVDE KAL" : "BİR DÜŞÜN"}</span>
      <div class="r-foot">KANEPE KAÇMAZ · evdeyiz</div>
    </div>`;
  }

  /* ───────── Oyun odası ───────── */
  function pageParty() {
    const mine = S.user.games || [];
    const all = R.lobbies.filter((l) => l.mine || (!R.hidden.has(l.id) && notMuted(l.a_id)));
    const list = all.filter((l) => ui.game === "all" || (ui.game === "mine" ? mine.includes(l.game) : l.game === ui.game));
    const open = all.filter((l) => !l.mine).length;
    return `
      <div class="page-head"><div><h1>Oyun odası</h1><p>${open ? `${nf(open)} açık ilan. Duo'nu bul, eksik beşlini tamamla.` : "Duo'nu bul, eksik beşlini tamamla."}</p></div><button class="btn lamp sm" data-a="modal" data-v="lobby">${ic("plus", "ico-sm", 2.6)}İlan as</button></div>
      <div class="games" role="group" aria-label="Oyun filtresi">
        <button class="chip txt" data-a="game" data-v="all" aria-pressed="${ui.game === "all"}">Hepsi</button>
        ${mine.length ? `<button class="chip txt" data-a="game" data-v="mine" aria-pressed="${ui.game === "mine"}">Benim oyunlarım</button>` : ""}
        ${D.games.map((g) => `<button class="chip" data-a="game" data-v="${g.id}" aria-pressed="${ui.game === g.id}"><span class="gcode" style="background:${g.color}">${g.code}</span>${esc(g.short)}</button>`).join("")}
      </div>
      ${annHtml(annFor("oyun"))}
      ${list.length ? list.map(lobbyHtml).join("") : `<div class="card empty"><span class="win"></span><h2>${R.lobbiesLoaded ? "Burada henüz ilan yok" : "İlanlar yükleniyor"}</h2><p>İlk ilanı sen as, duo'n seni bulsun. İlanlar 2 gün asılı kalır.</p>${R.lobbiesLoaded ? `<button class="btn lamp" data-a="modal" data-v="lobby">İlan as</button>` : ""}</div>`}`;
  }
  function lobbyHtml(l) {
    const g = D.games.find((x) => x.id === l.game) || D.games[0];
    const name = l.mine ? S.user.name : l.a_name;
    const left = Math.max(0, l.need - l.joins);
    return `<article class="card lobby">
      <span class="gcode lg" style="background:${g.color}" aria-label="${esc(g.name)}">${g.code}</span>
      <div class="grow">
        <div class="note-name"><span>${esc(name)}</span><span class="daire">D.${l.a_daire}</span><span class="xs muted">${esc(ago(new Date(l.created_at).getTime()))}</span></div>
        <p style="margin-top:4px">${esc(l.note)}</p>
        <div class="tags"><span class="tag">${esc(g.short)}</span>${l.rank ? `<span class="tag">${esc(l.rank)}</span>` : ""}${l.mine ? `<span class="tag mine">Senin ilanın${l.joins ? ` · ${l.joins} kişi katıldı` : ""}</span>` : left ? `<span class="tag hot">${left} kişi lazım</span>` : `<span class="tag">Dolu</span>`}</div>
      </div>
      ${l.mine ? `<button class="btn sm ghost" data-a="lobby-del" data-v="${l.id}">Kaldır</button>` : `<div class="lobby-act"><button class="btn sm ${l.joined ? "on" : ""}" data-a="lobby" data-v="${l.id}">${l.joined ? "Katıldın" : "Katıl"}</button>${modBtn("lobby", l.id, l.a_id, l.a_handle)}</div>`}
    </article>`;
  }

  /* ───────── Odalar ───────── */
  function pageRooms() {
    if (ui.room) return roomThread();
    return `
      <div class="page-head"><div><h1>Odalar</h1><p>Apartmanın ortak alanları. Kimse yargılamaz. Her mesaj +1 çay.</p></div></div>
      <div class="rooms">${D.rooms.map((r) => {
        const last = R.previews[r.id], on = R.roomOnline[r.id] || 0;
        return `<button class="card room" data-a="room" data-v="${r.id}">
          <div class="row" style="justify-content:space-between"><span class="room-ic" style="background:${r.color}">${ic(r.icon)}</span>${on ? `<span class="online"><span class="live-dot"></span>${nf(on)}</span>` : last?.last_hour ? `<span class="xs muted">son 1 saatte ${last.last_hour} mesaj</span>` : ""}</div>
          <div><h3>${esc(r.title)}</h3><div class="sub">${esc(r.sub)}</div></div>
          <div class="last ellip">${last?.text ? `${last.a_handle === R.me?.handle ? "Sen" : "@" + esc(last.a_handle)}: ${esc(last.text)}` : "Henüz sessiz. İlk selamı sen ver."}</div>
        </button>`;
      }).join("")}</div>
      <p class="faint xs">Kural: yargılamak, aşağılamak ve "git iş bul" nasihati yasak. Gerçekten kötü hissediyorsan yalnız kalma; acil durumda 112.</p>`;
  }
  function roomThread() {
    const r = D.rooms.find((x) => x.id === ui.room);
    const msgs = (R.room[r.id] || []).filter((m) => m.a_id === R.me?.id || (notMuted(m.a_id) && !R.hidden.has(String(m.id))));
    const groups = [];
    for (const m of msgs) {
      const key = m.a_id === R.me?.id ? "__me" : m.a_id;
      const g = groups[groups.length - 1];
      if (g && g.key === key) g.items.push(m); else groups.push({ key, h: m.a_handle, d: m.a_daire, items: [m] });
    }
    const on = R.roomOnline[r.id] || 1;
    const bubble = (m, mine) => `<div class="bubble" ${mine ? "" : `data-a="mod" data-k="message" data-id="${m.id}" data-u="${m.a_id}" data-h="${esc(m.a_handle)}"`}>${esc(m.text)}</div>`;
    return `
      <div class="thread-head"><button class="icon-btn" data-a="room-back" aria-label="Odalara dön">${ic("back")}</button><span class="room-ic" style="background:${r.color}">${ic(r.icon)}</span><div class="grow"><h1>${esc(r.title)}</h1><span class="online"><span class="live-dot"></span>${on === 1 ? "Şu an sadece sen buradasın" : `${nf(on)} kişi burada`}</span></div></div>
      <section class="card thread" id="thread">
        <p class="sm muted" style="text-align:center">${esc(r.sub)}. Odaya hoş geldin.</p>
        ${R.room[r.id] && !msgs.length ? `<p class="sm muted" style="text-align:center">Burada henüz kimse yazmadı. İlk selamı sen ver.</p>` : ""}
        ${groups.map((g) => g.key === "__me"
          ? `<div class="bgroup me"><div class="bubbles">${g.items.map((m) => bubble(m, true)).join("")}</div></div>`
          : `<div class="bgroup">${av(g.h, "s32")}<div class="bubbles"><button class="bname" data-a="neighbor" data-v="${g.key}" aria-label="@${esc(g.h)} dairesi">@${esc(g.h)} · D.${g.d}</button>${g.items.map((m) => bubble(m, false)).join("")}</div></div>`).join("")}
      </section>
      <div class="card composer-dock">
        <div class="quick">${D.quick.map((x) => `<button data-a="quick" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>
        <form class="msg-form" data-form="chat"><input id="chat-input" maxlength="240" placeholder="${esc(r.title)} odasına yaz" autocomplete="off" aria-label="Mesaj" /><button class="send" type="submit" aria-label="Gönder">${ic("send")}</button></form>
      </div>`;
  }

  /* ───────── Fiş ───────── */
  const calcView = () => ({ ...S.calc, ...calcResult() });
  function pageCalc() {
    const c = S.calc;
    const f = (id, label, val, unit, step) => `<div class="field"><label for="c-${id}">${label}</label><div class="input has-unit"><input id="c-${id}" data-calc="${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${val}" /><span class="unit">${unit}</span></div></div>`;
    return `
      <div class="page-head"><div><h1>Maaş mı, ev mi?</h1><p>Teklifi gir, fişini kes. Saatine gerçekte kaç para düşüyor?</p></div></div>
      <div class="calc">
        <section class="card pad fields">
          ${f("maas", "Teklif edilen net maaş", c.maas, "₺", 500)}
          <div class="grid2">${f("yol", "Aylık yol", c.yol, "₺", 100)}${f("yemek", "Aylık yemek", c.yemek, "₺", 100)}</div>
          <div class="grid2">${f("isSaat", "Günlük mesai", c.isSaat, "saat", 1)}${f("yolSaat", "Günlük yol süresi", c.yolSaat, "saat", 0.5)}</div>
          ${f("ev", "Evdeyken aylık toplam masrafın", c.ev, "₺", 250)}
          <p class="note-s">Ayda 22 iş günü varsayılır. Saati 120 ₺'nin altındaysa fişe "EVDE KAL" damgası basılır. Eğlencesine bir hesap, finansal tavsiye değildir.</p>
        </section>
        <div class="calc-side">
          <div id="calc-out">${receipt(calcView())}</div>
          <div class="btn-row"><button class="btn lamp" data-a="calc-post">${ic("pin", "ico-sm")}Panoya as</button><button class="btn ghost" data-a="calc-copy">Metni kopyala</button></div>
        </div>
      </div>`;
  }

  /* ───────── Dairem ───────── */
  function pageMe() {
    const u = S.user, days = daysAtHome(), t = titleFor(days), e = earned();
    const wake = D.wakes.find((w) => w.id === u.wake);
    const joined = new Date(u.joinedAt + "T00:00:00");
    const myPosts = R.mine;
    const likes = myPosts.reduce((a, p) => a + (p.like_count || 0), 0);
    let content = "";
    if (ui.ptab === "posts") {
      content = !R.mineLoaded ? `<div class="card empty"><span class="win lit"></span><h2>Notların yükleniyor</h2></div>`
        : myPosts.length ? myPosts.map(noteHtml).join("") : `<div class="card empty"><span class="win"></span><h2>Panoda notun yok</h2><p>İlk notunu as, kaç komşunun "ben de" dediğini gör. +3 çay.</p><button class="btn lamp" data-a="compose">İlk notunu yaz</button></div>`;
    } else if (ui.ptab === "card") {
      content = `${sakinCard(u)}<div class="btn-row" style="max-width:520px"><button class="btn lamp" data-a="card-share">${ic("share", "ico-sm")}Kartını paylaş</button><button class="btn ghost" data-a="id-copy">Metni kopyala</button></div>`;
    } else {

          <div class="stats"><div class="stat"><b>${nf(days)}</b><span>Evdeki gün</span></div><div class="stat"><b>${streak()}</b><span>Işık serisi</span></div><div class="stat"><b>${S.tea}</b><span>Çay</span></div><div class="stat"><b>${k(likes)}</b><span>"Ben de"</span></div></div>

  /* ───────── Render ───────── */
  function render() {
    applyTheme();
    const keep = {};
    document.querySelectorAll("#app textarea[id], #app input[id]:not([type=number])").forEach((el) => { keep[el.id] = el.value; });
    const act = document.activeElement;
    const focusId = act && act.id && $app.contains(act) ? act.id : null;
    const sel = focusId && typeof act.selectionStart === "number" ? [act.selectionStart, act.selectionEnd] : null;

    $app.innerHTML = ui.view === "banned" ? bannedView() : ui.view === "landing" ? landing() : ui.view === "onb" ? landing() + onboarding() : shell();

    for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el && !el.readOnly && el.value === "" && v) { el.value = v; updateCounter(el); } }
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch { /* tür desteklemiyor */ } } }
    document.body.style.overflow = ui.modal || ui.view === "onb" ? "hidden" : "";
  }
  const bannedView = () => `<div class="landing"><main class="land-hero" style="display:block;max-width:520px"><h1>Apartmandan çıkarıldın.</h1><p class="lead">Hesabın apartman kurallarını çiğnediği için kapatıldı. Bir hata olduğunu düşünüyorsan ${ext(SUPPORT, "destek sayfasından")} yaz.</p></main></div>`;
  const top = () => window.scrollTo(0, 0);
  const bottomScroll = () => requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
  function updateCounter(el) {
    if (!el.id.startsWith("pt-")) return;
    const c = document.getElementById("cnt-" + el.id.slice(3));
    if (c) c.textContent = `${el.value.length}/280`;
  }
  function copyText(text, okMsg = "Kopyalandı") {
    const fallback = () => { ui.shareText = text; ui.modal = "share"; render(); setTimeout(() => document.getElementById("share-text")?.select(), 30); };
    try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); } catch { fallback(); }
  }

  /* ───────── Paylaşılabilir sakin kartı (1080×1350 PNG) ───────── */
  let cardFile = null;
  const cardFileName = () => `evdeyiz-daire-${myDaire()}.png`;
  const cardText = () => `Ev genci sakin kartım: Daire ${myDaire()} · ${titleFor(daysAtHome()).name} · evde ${nf(daysAtHome())}. gün. Sen de taşın: ${SITE}`;
  const canSendCard = () => !!window.ReactNativeWebView || (!!cardFile && !!navigator.canShare && navigator.canShare({ files: [cardFile] }));

  async function drawCard(u = S.user) {
    const F = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif';
    const W = 1080, H = 1350;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    const NIGHT = "#0B0B0E", CARD = "#1C1C1E", OFF = "#1B1B21", LAMP = "#FFB340", DIM = "rgba(255,255,255,.55)", FRAME = "#3A3020";
    const box = (x, y, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); };
    const fit = (text, max) => { let t = String(text); if (g.measureText(t).width <= max) return t; while (t.length > 1 && g.measureText(t + "…").width > max) t = t.slice(0, -1); return t + "…"; };
    const h = u.handle || handleOf(u.name), days = daysAtHome(u);
    g.textBaseline = "alphabetic";

    // Gece ve apartman cephesi
    g.fillStyle = NIGHT; g.fillRect(0, 0, W, H);
    let seed = hash(h) || 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const cols = 11, gap = 14, cw0 = (W - 80 - gap * (cols - 1)) / cols, ch0 = cw0 * 1.3;
    for (let r = 0; r < 3; r++) for (let k = 0; k < cols; k++) {
      const on = rnd() < 0.36, x = 40 + k * (cw0 + gap), y = 40 + r * (ch0 + gap);
      g.save(); if (on) { g.shadowColor = "rgba(255,179,64,.45)"; g.shadowBlur = 24; }
      box(x, y, cw0, ch0, 8); g.fillStyle = on ? LAMP : OFF; g.fill(); g.restore();
    }
    const fade = g.createLinearGradient(0, 260, 0, 470);
    fade.addColorStop(0, "rgba(11,11,14,0)"); fade.addColorStop(1, NIGHT);
    g.fillStyle = fade; g.fillRect(0, 260, W, 210);

    // Kart
    const cx = 60, cy = 380, cw = W - 120, ch = 600;
    box(cx, cy, cw, ch, 44); g.fillStyle = CARD; g.fill();
    g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,.08)"; g.stroke();
    g.fillStyle = LAMP; g.font = `700 26px ${F}`;
    g.fillText("EV GENCİ SAKİN KARTI", cx + 48, cy + 66);
    g.textAlign = "right"; g.fillText(`DAİRE ${u.daire || ""}`, cx + cw - 48, cy + 66); g.textAlign = "left";
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(cx, cy + 100, cw, 2);

    // Yanan pencere
    const wx = cx + 48, wy = cy + 140, ww = 230, wh = 290;
    g.save(); g.shadowColor = "rgba(255,179,64,.5)"; g.shadowBlur = 50;
    box(wx, wy, ww, wh, [44, 44, 18, 18]); g.fillStyle = LAMP; g.fill(); g.restore();
    const eq = u === S.user ? S.eq : {};
    const perde = eq.perde && item(eq.perde);
    g.save(); box(wx, wy, ww, wh, [44, 44, 18, 18]); g.clip();
    if (perde) { g.fillStyle = perde.color; g.fillRect(wx, wy, 64, wh); g.fillRect(wx + ww - 64, wy, 64, wh); }
    const sx = wx + ww / 2, sy = wy + wh;
    g.fillStyle = "rgba(26,17,0,.82)"; g.beginPath(); g.moveTo(sx - 66, sy); g.lineTo(sx - 66, sy - 116); g.arc(sx, sy - 116, 66, Math.PI, 0); g.lineTo(sx + 66, sy); g.closePath(); g.fill();
    g.fillStyle = LAMP; g.font = `800 92px ${F}`; g.textAlign = "center";
    g.fillText(String(u.name || "?")[0].toLocaleUpperCase("tr"), sx, sy - 78);
    g.fillStyle = FRAME; g.fillRect(sx - 5, wy, 10, wh); g.fillRect(wx, wy + wh * 0.4, ww, 10);
    g.restore();
    g.lineWidth = 10; g.strokeStyle = FRAME; box(wx, wy, ww, wh, [44, 44, 18, 18]); g.stroke();
    const evcil = eq.evcil && item(eq.evcil), saksi = eq.saksi && item(eq.saksi);
    g.font = `64px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; g.textAlign = "center";
    if (saksi) g.fillText(saksi.emoji, wx + ww - 44, sy - 8);
    if (evcil) g.fillText(evcil.emoji, wx + 44, sy - 8);
    g.textAlign = "left";

    // Kimlik
    const tx = wx + ww + 48, tw = cx + cw - 48 - tx;
    let size = 60; g.font = `700 ${size}px ${F}`;
    while (size > 34 && g.measureText("@" + h).width > tw) { size -= 2; g.font = `700 ${size}px ${F}`; }
    g.fillStyle = "#fff"; g.fillText(fit("@" + h, tw), tx, wy + 52);
    g.fillStyle = LAMP; g.font = `600 32px ${F}`; g.fillText(fit(titleFor(days).name, tw), tx, wy + 100);
    const wake = D.wakes.find((w) => w.id === u.wake);
    const games = (u.games || []).map((id) => D.games.find((x) => x.id === id)?.short).filter(Boolean);
    const rows = [["Evde", `${nf(days)}. gün`], ["Işık yanar", wake?.title || "-"], ["Ana mesai", games.slice(0, 2).join(", ") || "Dizi, uyku"], ["Şehir", u.city || "Gizli"]];
    const colW = (tw - 30) / 2;
    rows.forEach(([k, v], i) => {
      const x = tx + (i % 2) * (colW + 30), y = wy + 180 + Math.floor(i / 2) * 104;
      g.fillStyle = DIM; g.font = `500 24px ${F}`; g.fillText(k, x, y);
      g.fillStyle = "#fff"; g.font = `600 32px ${F}`; g.fillText(fit(v, colW), x, y + 42);
    });
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(cx, cy + ch - 80, cw, 2);
    g.fillStyle = DIM; g.font = `500 24px ${F}`;
    g.fillText(`No ${cardNo(u)}`, cx + 48, cy + ch - 32);
    g.textAlign = "right"; g.fillText("evdeyiz apt. · süresiz", cx + cw - 48, cy + ch - 32); g.textAlign = "left";

    // Alt yazı
    let hs = 92; g.font = `800 ${hs}px ${F}`;
    while (hs > 56 && g.measureText("Ben de ev genciyim.").width > W - 120) { hs -= 2; g.font = `800 ${hs}px ${F}`; }
    g.fillStyle = "#fff"; g.fillText("Ben de ev genciyim.", 60, 1100);
    g.fillStyle = LAMP; g.fillText("Sen de.", 60, 1100 + hs * 1.02);
    g.fillStyle = DIM; g.font = `500 30px ${F}`; g.fillText(SITE, 60, 1300);
    return c;
  }

      const t = today();
      if (S.checkins.includes(t)) return;
      const y = ymd(addDays(new Date(), -1)), y2 = ymd(addDays(new Date(), -2));
      let usedBulb = false;
      if (!S.checkins.includes(y) && S.checkins.includes(y2) && S.bulbs > 0) { S.checkins.push(y); S.bulbs--; usedBulb = true; }
      S.checkins.push(t);
      earn(5);
      const st = streak();
      const bonus = { 3: 10, 7: 25, 14: 40, 30: 80 }[st] || 0;
      if (bonus) { earn(bonus); notify(`${st} günlük ışık serisi! ${bonus} çay ödül.`, "bulb", { tab: "me" }); }
      save(); render();
      toast(usedBulb ? `Dün ışığın sönmüştü, yedek ampul serini kurtardı. Seri: ${st} gün` : bonus ? `${st} gün seri! +${5 + bonus} çay` : `Işığın yandı. +5 çay · Seri: ${st} gün`);

    if (!uid || uid === R.me?.id) return;

  async function createPost({ text, anon, calc = null }) {
    if (ui.busy === "post") return false;
    ui.busy = "post";
    try {
      const row = await q(sb.from("posts").insert({ text, anon, calc }).select("id").single());
      earn(3);
      const first = !S.didPost; S.didPost = true; save();
      ui.modal = null; ui.anon = false; ui.hashtag = null; ui.search = ""; S.tab = "feed"; S.feedTab = "foryou";
      ui.busy = false;
      await loadFeed(); render(); top();
      if (first) notify("İlk notun panoda. Komşular \"ben de\" deyince burada görürsün.", "hand", { tab: "feed" });
      R.mineLoaded = false;
      return row;
    } catch (e) { ui.busy = false; render(); toast(errMsg(e)); return false; }
  }
  async function submitPost(form) {
    const where = form.dataset.where;
    const ta = document.getElementById("pt-" + where);
    const text = (ta?.value || "").trim();
    if (text.length < 3) { toast("Biraz daha yaz, apartman dinliyor"); ta?.focus(); return; }
    const first = !S.didPost;
    if (await createPost({ text, anon: ui.anon })) {
      const el = document.getElementById("pt-" + where); if (el) el.value = "";
      toast(first ? "İlk notun panoda. İtirafçı rozeti ve +3 çay senin." : "Notun panoya asıldı. +3 çay");
    }
  }
  async function sendReply(text) {
    text = String(text || "").trim();
    const id = ui.thread; if (!text || !id) return;
    try {
      await q(sb.from("replies").insert({ post_id: id, text }));
      patchPost(id, (p) => { p.reply_count++; });
      await loadReplies(id);
      setTimeout(() => document.getElementById("reply-input")?.focus({ preventScroll: true }), 0);
    } catch (e) { toast(errMsg(e)); }
  }

  async function sendMsg(text) {
    text = String(text || "").trim();
    const roomId = ui.room;
    if (!text || !roomId) return;
    try {
      const row = await q(sb.from("messages").insert({ room: roomId, text }).select("id, created_at").single());
      const list = (R.room[roomId] ||= []);
      if (!list.some((x) => x.id === row.id)) list.push({ id: row.id, text, created_at: row.created_at, a_id: R.me.id, a_handle: R.me.handle, a_name: R.me.name, a_daire: R.me.daire });
      earn(1);
      S.didMsg = (S.didMsg || 0) + 1; (S.myRooms ||= {})[roomId] = 1;
      if (roomId === "gece") S.nightMsg = true;
      save();
      if (S.didMsg === 3) toast("Muhabbetçi rozeti senin");
      render(); bottomScroll();
    } catch (e) { toast(errMsg(e)); }
  }

  /* ───────── Events ───────── */
  const HAPTIC = new Set(["like", "checkin", "box", "answer", "onb-next", "onb-pick", "onb-game", "buy", "tab", "card-share", "card-send", "list-claim", "lobby"]);
  document.addEventListener("click", (e) => {
    const ann = e.target.closest("[data-ann]");
    if (ann && R.me) sb.from("ann_clicks").insert({ ann_id: ann.dataset.ann, kind: "click" }).then(() => {});
    if (e.target.classList?.contains("ov")) {
      if (ui.view === "onb") return;
      ui.modal = null; ui.confirmReset = false; render(); return;
    }
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const fn = A[el.dataset.a];
    if (!fn) return;
    e.preventDefault();
    if (HAPTIC.has(el.dataset.a)) buzz(el.dataset.a === "checkin" || el.dataset.a === "box" ? "success" : "light");
    fn(el, e);
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "onb-name") {
      ui.onb.data.name = t.value;
      const n = document.querySelector('[data-a="onb-next"]'); if (n) n.disabled = t.value.trim().length < 2;
    } else if (t.id === "search") {
      ui.search = t.value; ui.hashtag = null;
      if (S.tab !== "feed") { S.tab = "feed"; ui.room = null; }
      render();
    } else if (t.dataset.calc) {
      const v = parseFloat(t.value);
      S.calc[t.dataset.calc] = Number.isFinite(v) && v >= 0 ? v : 0;
      S.calcUsed = true; save();
      const out = document.getElementById("calc-out"); if (out) out.innerHTML = receipt(calcView());
    } else updateCounter(t);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "onb-name" && e.target.value.trim().length > 1) { e.preventDefault(); A["onb-next"](); return; }
    if (e.key === "Escape" && ui.modal) { ui.modal = null; ui.confirmReset = false; render(); }
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id?.startsWith("pt-")) { e.preventDefault(); submitPost(e.target.closest("form")); }
  });

  document.addEventListener("submit", async (e) => {
    const f = e.target, kind = f.dataset.form;
    if (!kind) return;
    e.preventDefault();
    if (kind === "post") submitPost(f);
    else if (kind === "chat") {
      const input = document.getElementById("chat-input"); const v = input.value; input.value = "";
      sendMsg(v); setTimeout(() => document.getElementById("chat-input")?.focus({ preventScroll: true }), 0);
    } else if (kind === "reply") {
      const input = document.getElementById("reply-input"); const v = input.value; input.value = "";
      sendReply(v);
    } else if (kind === "lobby") {
      const note = document.getElementById("lob-note").value.trim();
      if (note.length < 3) { toast("Ne aradığını yaz, eşleşme kolaylaşsın"); document.getElementById("lob-note").focus(); return; }
      ui.busy = "lobby"; render();
      try {
        await q(sb.from("lobbies").insert({ game: document.getElementById("lob-game").value, rank: document.getElementById("lob-rank").value.trim(), note, need: Number(document.getElementById("lob-need").value) || 1 }));
        ui.busy = false; ui.modal = null; ui.game = "all"; S.tab = "party"; save();
        await loadLobbies(); render(); top();
        toast("İlanın oyun odasına asıldı");
      } catch (err) { ui.busy = false; render(); toast(errMsg(err)); }
    } else if (kind === "profile") {
      const v = document.getElementById("set-name").value.trim();
      if (v.length < 2) { toast("Kapıdaki isim en az 2 harf olmalı"); return; }
      const patch = { name: v, wake: document.getElementById("set-wake").value, city: document.getElementById("set-city").value };
      try {
        await q(sb.from("profiles").update(patch).eq("id", R.me.id));
        Object.assign(R.me, patch); Object.assign(S.user, patch); save(); render(); toast("Daire bilgilerin güncellendi");
      } catch (err) { toast(errMsg(err)); }
    }
  });

  render();
  boot();
})();

</script>
</body>
</html>
