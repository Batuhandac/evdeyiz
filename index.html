<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>evdeyiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* evdeyiz — "Apartman panosu" görsel kimliği
   Malzeme: giriş katındaki duyuru panosu. Kâğıt zemin, mürekkep yazı, kırmızı damga.
   Lamba sarısı yalnızca yanan pencerelerde kullanılır; parlama, cam, gradyan yok.
   Yazı: Bricolage Grotesque (dar, tabela), IBM Plex Sans (metin), IBM Plex Mono (fiş, numara, saat). */
:root {
  --bg: #EFEADF;
  --bg-2: #FBF8F1;
  --bg-3: #E6DFD0;
  --line: #D4CBB8;
  --ink-line: #2A2620;
  --fg: #1F1C17;
  --fg-2: #5D564A;
  --fg-3: #8C8473;
  --btn: #1F1C17;
  --btn-fg: #FBF8F1;
  --red: #C2391B;
  --red-soft: rgba(194, 57, 27, .09);
  --green: #2F6B4F;
  --lamp: #F2A500;
  --lamp-ink: #1F1C17;
  --lamp-text: #C2391B;
  --lamp-soft: rgba(194, 57, 27, .09);
  --lamp-glow: none;
  --tomato: #C2391B;
  --tomato-soft: rgba(194, 57, 27, .09);
  --mint: #2F6B4F;
  --glass: #FBF8F1;
  --shadow: 0 1px 0 rgba(31, 28, 23, .05), 0 8px 20px rgba(31, 28, 23, .10);
  --paper: #FBF8F1;
  --paper-ink: #1F1C17;
  /* Cephe çizimi her iki temada da gece kalır */
  --facade: #2B2722;
  --facade-2: #2B2722;
  --glass-off: #47403A;

  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161411; --bg-2: #1F1C18; --bg-3: #2A2621; --line: #38322B; --ink-line: #EEE7D8;
    --fg: #EEE7D8; --fg-2: #B3A994; --fg-3: #7F7666;
    --btn: #EEE7D8; --btn-fg: #161411;
    --red: #E0583A; --red-soft: rgba(224, 88, 58, .14); --green: #6DBE95;
    --lamp-text: #E0583A; --lamp-soft: rgba(224, 88, 58, .14); --tomato: #E0583A; --tomato-soft: rgba(224, 88, 58, .14); --mint: #6DBE95;
    --glass: #1F1C18; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161411; --bg-2: #1F1C18; --bg-3: #2A2621; --line: #38322B; --ink-line: #EEE7D8;
  --fg: #EEE7D8; --fg-2: #B3A994; --fg-3: #7F7666;
  --btn: #EEE7D8; --btn-fg: #161411;
  --red: #E0583A; --red-soft: rgba(224, 88, 58, .14); --green: #6DBE95;
  --lamp-text: #E0583A; --lamp-soft: rgba(224, 88, 58, .14); --tomato: #E0583A; --tomato-soft: rgba(224, 88, 58, .14); --mint: #6DBE95;
  --glass: #1F1C18; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* ───────── Base ───────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }
[hidden] { display: none !important; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
.b { font-weight: 600; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico { width: 20px; height: 20px; }
.ico-sm { width: 16px; height: 16px; }
.display { font-family: var(--display); font-stretch: 75%; }
.eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--fg-2); }

/* Başlıklar: dar tabela yazısı */
.page-head h1, .land-copy h1, .onb-body h2, .empty h2, .sheet-head h2, .thread-head h1, .home-body h2, .story-big,
.list-title, .light h3, .today-tile h3, .checklist h3, .meeting-card .q, .room h3, .floor h3, .lan-art h3, .brand,
.r-total b, .receipt-head b, .stat b, .facade-num, .sakin-name, .plate b, .trend-rank, .opt .pct, .stamp, .av, .win .who, .big-win .sil, .gcode {
  font-family: var(--display); font-stretch: 75%;
}

/* ───────── Buttons ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 4px; font-weight: 600; font-size: 15px; background: var(--bg-2); color: var(--fg); border: 1.5px solid var(--ink-line); transition: background-color .15s, color .15s; white-space: nowrap; }
.btn:hover { background: var(--bg-3); }
.btn:active { transform: translateY(1px); }
.btn.lamp { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.btn.lamp:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink-line); background: transparent; }
.btn.on { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.btn.lg { min-height: 54px; font-size: 16px; padding: 0 26px; }
.btn.sm { min-height: 34px; font-size: 13px; padding: 0 12px; border-width: 1px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 4px; display: inline-grid; place-items: center; color: var(--fg); transition: background-color .15s; }
.icon-btn:hover { background: var(--bg-3); }

/* ───────── Brand: pencere işareti ───────── */
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; font-size: 24px; letter-spacing: -.01em; }
.mark { width: 26px; height: 30px; border-radius: 3px 3px 1px 1px; background: var(--fg); display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; flex: none; }
.mark i { border-radius: 1px; background: var(--fg-2); }
.mark i.on { background: var(--lamp); }

/* ───────── Avatars ───────── */
.av { width: 42px; height: 42px; border-radius: 4px; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; font-size: 19px; user-select: none; }
.av.s32 { width: 32px; height: 32px; font-size: 15px; }
.av.anon { background: var(--bg-3); color: var(--fg-2); }
.star { width: 16px; height: 16px; color: var(--red); display: inline-block; vertical-align: -2px; margin-left: 3px; }
.daire { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--fg-2); border: 1px solid var(--line); border-radius: 2px; padding: 0 5px; font-variant-numeric: tabular-nums; }

/* ───────── Layout ───────── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1.5px solid var(--ink-line); }
.top-inner { max-width: 1040px; margin: 0 auto; height: 62px; display: flex; align-items: center; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .search { flex: 1; max-width: 420px; margin-left: 24px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 640px) 320px; gap: 32px; justify-content: center; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.aside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 86px; align-self: start; }

.search { display: flex; align-items: center; gap: 10px; height: 40px; border-radius: 4px; background: var(--bg-2); padding: 0 12px; color: var(--fg-3); border: 1px solid var(--line); }
.search:focus-within { border-color: var(--ink-line); color: var(--fg); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1.5px solid var(--ink-line); }
.page-head h1 { font-size: clamp(32px, 7vw, 44px); font-weight: 800; letter-spacing: -.015em; line-height: .95; }
.page-head p { color: var(--fg-2); margin-top: 6px; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; padding: 2px; flex: none; background: var(--bg-2); }
.seg button { padding: 6px 11px; border-radius: 2px; font-size: 13px; font-weight: 600; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }

.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; }
.pad { padding: 16px; }

/* Alt sekme çubuğu */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; gap: 0; padding: 4px; border-radius: 6px; background: var(--bg-2); border: 1.5px solid var(--ink-line); box-shadow: var(--shadow); }
.dock button { position: relative; width: 78px; height: 52px; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--fg-3); transition: color .15s; }
.dock button:hover { color: var(--fg); }
.dock button svg { width: 22px; height: 22px; }
.dock button[aria-current="page"] { color: var(--fg); }
.dock button[aria-current="page"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 3px; height: 3px; background: var(--red); }
.dock .badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 2px; background: var(--red); color: #fff; font-family: var(--mono); font-size: 11px; display: grid; place-items: center; }
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 41; width: 54px; height: 54px; border-radius: 6px; background: var(--btn); color: var(--btn-fg); display: none; place-items: center; box-shadow: var(--shadow); }
.fab svg { width: 24px; height: 24px; }

/* ───────── Apartman cephesi ───────── */
.facade { background: var(--facade); border-radius: 4px 4px 0 0; padding: 14px 14px 0; position: relative; overflow: hidden; color: #EEE7D8; }
.facade-roof { height: 8px; margin: 0 -14px 12px; background: repeating-linear-gradient(90deg, #3A342D 0 18px, #2B2722 18px 22px); }
.facade-grid { display: grid; grid-template-columns: repeat(var(--cols, 8), 1fr); gap: 7px; position: relative; }
.w { aspect-ratio: 3 / 4; border-radius: 1px; background: var(--glass-off); position: relative; }
.w::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; background: rgba(0, 0, 0, .35); }
.w.on { background: var(--lamp); }
.w.tw { animation: flick 7s infinite; }
.w.me { background: var(--lamp); outline: 2px solid #EEE7D8; outline-offset: 2px; }
@keyframes flick { 0%, 46%, 100% { background: var(--glass-off); } 50%, 96% { background: var(--lamp); } }
.facade-door { width: 18%; height: 24px; margin: 10px auto 0; border-radius: 2px 2px 0 0; background: #1A1714; }
.facade-cap { padding: 12px 2px 14px; position: relative; }
.facade-num { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.facade-cap p { font-size: 13px; color: rgba(238, 231, 216, .75); }
/* "Şu an" işareti: küçük yanan pencere, nabız yok */
.live-dot { width: 7px; height: 9px; border-radius: 1px; background: var(--lamp); display: inline-block; flex: none; }

/* Side lists */
.list-title { font-size: 20px; font-weight: 800; padding: 14px 16px 6px; letter-spacing: -.005em; }
.list-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 16px; transition: background-color .15s; }
.list-row + .list-row { border-top: 1px dashed var(--line); }
button.list-row:hover { background: var(--bg-3); }
.trend-rank { font-weight: 800; font-size: 18px; color: var(--fg-3); width: 18px; font-variant-numeric: tabular-nums; }
.list-more { padding: 10px 16px 14px; color: var(--red); font-size: 13px; font-weight: 600; }
.side-foot { font-size: 12px; color: var(--fg-3); display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 0 4px; }

/* ───────── Pencereler (hikâyeler) ───────── */
.windows { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
.windows::-webkit-scrollbar { display: none; }
.win-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 70px; flex: none; }
.win { width: 62px; height: 76px; border-radius: 3px 3px 1px 1px; position: relative; display: grid; place-items: center; background: var(--glass-off); border: 4px solid var(--facade); overflow: hidden; }
.win::before, .win::after { content: ""; position: absolute; background: var(--facade); }
.win::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
.win::after { top: 42%; left: 0; right: 0; height: 3px; }
.win.lit { background: var(--lamp); }
.win .who { position: relative; z-index: 1; width: 30px; height: 32px; border-radius: 15px 15px 2px 2px; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; margin-top: 18px; }
.win.lit .who { background: rgba(31, 28, 23, .78); color: var(--lamp); }
.win:not(.lit) .who { background: rgba(255, 255, 255, .1); color: #B3A994; }
.win.mine { background: var(--bg-2); border: 2px dashed var(--line); }
.win.mine::before, .win.mine::after { display: none; }
.win.mine .plus { width: 28px; height: 28px; border-radius: 3px; background: var(--btn); color: var(--btn-fg); display: grid; place-items: center; }
.win-name { font-family: var(--mono); font-size: 11px; color: var(--fg-2); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ───────── Işık yoklaması ───────── */
.light { display: flex; align-items: center; gap: 16px; padding: 16px; }
.light-week { display: grid; grid-template-columns: repeat(7, 16px); gap: 4px; flex: none; }
.light-week i { height: 22px; border-radius: 1px; background: var(--bg-3); border: 1px solid var(--line); }
.light-week i.on { background: var(--lamp); border-color: var(--lamp); }
.light h3 { font-size: 20px; font-weight: 800; }

/* ───────── Composer ───────── */
.composer { padding: 14px 16px; display: flex; gap: 12px; }
.composer textarea { width: 100%; background: none; border: 0; outline: none; resize: none; font-size: 17px; line-height: 1.45; padding: 9px 0; min-height: 48px; }
.composer textarea::placeholder { color: var(--fg-3); }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--fg-2); padding: 6px 10px 6px 6px; border-radius: 4px; }
.toggle:hover { background: var(--bg-3); }
.switch { width: 32px; height: 18px; border-radius: 2px; background: var(--line); position: relative; transition: background-color .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 1px; background: var(--bg-2); transition: transform .15s; }
.toggle[aria-pressed="true"] { color: var(--fg); }
.toggle[aria-pressed="true"] .switch { background: var(--btn); }
.toggle[aria-pressed="true"] .switch::after { transform: translateX(14px); }
.counter { font-family: var(--mono); font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 4px; border: 1px dashed var(--ink-line); }

/* ───────── Pano notları: raptiyeli kâğıt ───────── */
.note { padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 10px; position: relative; border-radius: 2px; box-shadow: 0 1px 0 rgba(31, 28, 23, .06); }
.note::before { content: ""; position: absolute; top: 7px; left: 50%; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: var(--red); box-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.note:nth-of-type(3n+2)::before { background: #2F5D73; }
.note:nth-of-type(3n)::before { background: #8A6A1F; }
.note-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.note-name { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.note-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-meta { font-family: var(--mono); font-size: 12px; color: var(--fg-3); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
.note-text { font-size: 16px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.hashtag { color: var(--red); font-weight: 500; }
.hashtag:hover { text-decoration: underline; }
.note-foot { display: flex; align-items: center; gap: 4px; margin-top: 2px; padding-top: 10px; border-top: 1px dashed var(--line); }
.bende { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 9px; border-radius: 4px; border: 1px solid var(--line); font-weight: 600; font-size: 14px; transition: background-color .15s, color .15s, border-color .15s; }
.bende:hover { border-color: var(--ink-line); }
.bende .cnt { font-family: var(--mono); color: var(--fg-2); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.bende.on { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.bende.on .cnt { color: var(--btn-fg); opacity: .8; }
.bende.on svg { animation: wave .5s ease; transform-origin: 70% 90%; }
@keyframes wave { 0% { transform: rotate(0); } 30% { transform: rotate(-18deg); } 60% { transform: rotate(12deg); } 100% { transform: rotate(0); } }
.mini { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 9px; border-radius: 4px; color: var(--fg-2); font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; transition: background-color .15s, color .15s; }
.mini:hover { background: var(--bg-3); color: var(--fg); }
.mini.on { color: var(--green); }
.note-foot .seen { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--fg-3); display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.shared-by { font-size: 12px; font-weight: 600; color: var(--green); display: flex; align-items: center; gap: 6px; }

/* Apartman toplantısı (anket) */
.meeting { border-radius: 4px; border: 1px solid var(--line); background: var(--bg); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.meeting-title { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--fg-2); display: flex; align-items: center; gap: 6px; }
.opt { position: relative; min-height: 42px; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; overflow: hidden; background: var(--bg-2); text-align: left; border: 1px solid var(--line); }
button.opt { font-weight: 600; transition: border-color .15s; }
button.opt:hover { border-color: var(--ink-line); }
.opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--bg-3); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.opt.win-opt .bar { background: var(--red-soft); }
.opt > span { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; }
.opt.win-opt > span:first-of-type { font-weight: 700; }
.opt .pct { font-weight: 800; font-size: 17px; }

/* Fiş (maaş hesabı) */
.receipt { background: #FFFDF6; color: #1F1C17; border-radius: 2px 2px 0 0; padding: 18px 18px 26px; position: relative; font-family: var(--mono); font-variant-numeric: tabular-nums; max-width: 100%;
  -webkit-mask: radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 0 100% / 18px 100% repeat-x, linear-gradient(#000, #000) top / 100% calc(100% - 7px) no-repeat;
          mask: radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 0 100% / 18px 100% repeat-x, linear-gradient(#000, #000) top / 100% calc(100% - 7px) no-repeat; }
.receipt-head { text-align: center; padding-bottom: 10px; border-bottom: 1.5px dashed rgba(31, 28, 23, .35); }
.receipt-head b { font-size: 22px; font-weight: 800; display: block; }
.receipt-head span { font-size: 11px; opacity: .65; }
.r-line { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 13px; }
.r-line.minus span:last-child { color: #B03117; }
.r-sep { border-top: 1.5px dashed rgba(31, 28, 23, .35); margin: 6px 0; }
.r-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 4px; }
.r-total span { font-weight: 600; font-size: 12px; }
.r-total b { font-size: clamp(34px, 9vw, 48px); font-weight: 800; letter-spacing: -.01em; }
.r-foot { text-align: center; font-size: 11px; opacity: .6; margin-top: 10px; }
.stamp { position: relative; display: table; margin: 14px auto 2px; transform: rotate(-6deg); font-weight: 800; font-size: 24px; letter-spacing: .03em; color: #B03117; border: 3px solid #B03117; border-radius: 3px; padding: 2px 10px; opacity: .88; mix-blend-mode: multiply; pointer-events: none; }
.stamp.go { color: #2F6B4F; border-color: #2F6B4F; }
.receipt.mini-r { padding: 14px 14px 22px; }
.receipt.mini-r .r-total b { font-size: 30px; }
.receipt.mini-r .stamp { font-size: 17px; margin-top: 10px; }
.embed { display: block; width: 100%; text-align: left; max-width: 360px; filter: drop-shadow(0 1px 1px rgba(31, 28, 23, .18)); }
.embed-cap { font-size: 12px; color: var(--fg-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }

/* Empty */
.empty { padding: 36px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .win { width: 50px; height: 62px; }
.empty h2 { font-size: 26px; font-weight: 800; }
.empty p { color: var(--fg-2); max-width: 340px; }

/* ───────── Oyun odası ───────── */
.games { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.games::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 5px; border-radius: 4px; background: var(--bg-2); border: 1px solid var(--line); font-weight: 600; font-size: 13px; flex: none; transition: border-color .15s; }
.chip.txt { padding: 0 12px; }
.chip:hover { border-color: var(--ink-line); }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.gcode { width: 30px; height: 26px; border-radius: 2px; background: transparent !important; color: currentColor; border: 1px solid currentColor; font-size: 12px; font-weight: 800; display: grid; place-items: center; flex: none; opacity: .85; }
.gcode.lg { width: 48px; height: 44px; font-size: 16px; border-width: 1.5px; }
.lan { overflow: hidden; }
.lan-art { padding: 18px 20px; background: var(--facade); color: #EEE7D8; border-bottom: 3px solid var(--lamp); }
.lan-art h3 { font-size: clamp(28px, 6vw, 36px); font-weight: 800; margin: 6px 0 4px; line-height: 1; }
.lan-art p { color: rgba(238, 231, 216, .75); font-size: 14px; }
.lan-tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--lamp); }
.slots { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
.slots i { height: 14px; border-radius: 1px; background: var(--bg-3); border: 1px solid var(--line); }
.slots i.on { background: var(--fg-2); border-color: var(--fg-2); }
.slots i.me { background: var(--red); border-color: var(--red); }
.lobby { padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 2px; border: 1px solid var(--line); color: var(--fg-2); }
.tag.hot { border-color: var(--red); color: var(--red); }
.tag.mine { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }

/* ───────── Odalar: kapı plakaları ───────── */
.rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rooms > *, .calc > *, .wrap > * { min-width: 0; }
.room { min-width: 0; text-align: left; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 150px; transition: border-color .15s; }
.room:hover { border-color: var(--ink-line); }
.room-ic { width: 40px; height: 40px; border-radius: 3px; display: grid; place-items: center; background: transparent !important; color: var(--fg); border: 1.5px solid var(--ink-line); }
.room-ic svg { width: 20px; height: 20px; }
.room h3 { font-size: 24px; font-weight: 800; line-height: 1; }
.room .sub { font-size: 13px; color: var(--fg-2); margin-top: 4px; }
.room .last { font-size: 13px; color: var(--fg-3); margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
.online { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.thread-head { display: flex; align-items: center; gap: 12px; }
.thread-head h1 { font-size: 30px; font-weight: 800; line-height: 1; }
.thread { padding: 16px; display: flex; flex-direction: column; min-height: 50vh; }
.bgroup { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
.bgroup.me { justify-content: flex-end; }
.bubbles { display: flex; flex-direction: column; gap: 3px; max-width: 78%; }
.bgroup.me .bubbles { align-items: flex-end; }
.bname { font-family: var(--mono); font-size: 11px; color: var(--fg-3); margin: 0 0 2px 2px; }
.bubble { padding: 9px 13px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); word-break: break-word; }
.bgroup.me .bubble { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.typing { color: var(--fg-3); font-size: 13px; padding: 8px 0 0 40px; display: flex; align-items: center; gap: 4px; }
.typing i { width: 5px; height: 5px; border-radius: 1px; background: var(--fg-3); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer-dock { position: sticky; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; font-size: 13px; padding: 5px 11px; border-radius: 3px; border: 1px solid var(--line); }
.quick button:hover { border-color: var(--ink-line); }
.msg-form { display: flex; gap: 8px; }
.msg-form input { flex: 1; min-width: 0; height: 44px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); padding: 0 14px; outline: none; }
.msg-form input:focus { border-color: var(--ink-line); }
.send { width: 44px; height: 44px; border-radius: 4px; background: var(--btn); color: var(--btn-fg); display: grid; place-items: center; flex: none; }
.send svg { width: 18px; height: 18px; }

/* ───────── Hesap ───────── */
.calc { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.fields { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.input { position: relative; }
.input input, .input select, .input textarea { width: 100%; height: 48px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg-2); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .15s; }
.input textarea { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.45; font-size: 15px; }
.input input:focus, .input select:focus, .input textarea:focus { border-color: var(--ink-line); }
.input .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-3); font-family: var(--mono); font-size: 13px; pointer-events: none; }
.input.has-unit input { padding-right: 52px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.calc-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 86px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }
.note-s { font-size: 12px; color: var(--fg-3); }

/* ───────── Dairem (profil) ───────── */
.home-hero { overflow: hidden; }
.home-art { background: var(--facade); padding: 22px 20px 0; display: flex; align-items: flex-end; gap: 18px; position: relative; }
.big-win { width: 108px; height: 132px; border-radius: 4px 4px 1px 1px; background: var(--lamp); position: relative; display: grid; place-items: end center; overflow: hidden; flex: none; border: 6px solid #47403A; border-bottom: 0; }
.big-win::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #47403A; transform: translateX(-50%); }
.big-win::after { content: ""; position: absolute; left: 0; right: 0; top: 40%; height: 4px; background: #47403A; }
.big-win .sil { width: 62px; height: 74px; border-radius: 31px 31px 3px 3px; background: rgba(31, 28, 23, .82); display: grid; place-items: center; color: var(--lamp); font-weight: 800; font-size: 32px; position: relative; z-index: 1; }
.plate { position: relative; margin-bottom: 18px; background: #C9A85A; color: #1F1C17; border-radius: 2px; padding: 6px 12px; border: 1px solid #8C7134; }
.plate small { display: block; font-family: var(--mono); font-size: 10px; font-weight: 600; opacity: .75; }
.plate b { font-size: 22px; font-weight: 800; }
.home-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.home-body h2 { font-size: 32px; font-weight: 800; line-height: 1; }
.title-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--red); border: 1px solid var(--red); padding: 3px 9px; border-radius: 2px; }
.title-chip .w { width: 10px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--fg-2); font-size: 14px; }
.meta-row span { display: inline-flex; align-items: center; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 6px; border-top: 1.5px solid var(--ink-line); border-bottom: 1px solid var(--line); }
.stat { padding: 10px 12px 10px 0; }
.stat + .stat { padding-left: 12px; border-left: 1px dashed var(--line); }
.stat b { font-size: 28px; font-weight: 800; display: block; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--fg-2); }

/* Sakin kartı: apartman giriş kartı */
.sakin { border-radius: 4px; overflow: hidden; background: #FFFDF6; color: #1F1C17; border: 1.5px solid #1F1C17; max-width: 520px; }
.sakin-top { display: flex; justify-content: space-between; padding: 9px 16px; font-family: var(--mono); font-size: 12px; font-weight: 600; color: #FFFDF6; background: #C2391B; }
.sakin-body { display: flex; gap: 16px; padding: 16px; }
.sakin .big-win { width: 84px; height: 104px; border-width: 5px; border-color: #2B2722; }
.sakin .big-win::before, .sakin .big-win::after { background: #2B2722; }
.sakin .big-win .sil { width: 46px; height: 56px; font-size: 24px; }
.sakin .big-win::before { width: 3px; } .sakin .big-win::after { height: 3px; }
.sakin-name { font-size: 26px; font-weight: 800; line-height: 1; word-break: break-all; }
.sakin-title { color: #C2391B; font-weight: 600; font-size: 13px; margin: 4px 0 12px; }
.sakin dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
.sakin dt { font-family: var(--mono); font-size: 10px; color: #6B6458; }
.sakin dd { margin: 1px 0 0; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.sakin-foot { display: flex; justify-content: space-between; gap: 10px; padding: 8px 16px; font-family: var(--mono); font-size: 11px; color: #6B6458; border-top: 1.5px dashed rgba(31, 28, 23, .3); font-variant-numeric: tabular-nums; }

.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.badge { padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.badge .win { width: 40px; height: 50px; border-width: 3px; }
.badge b { font-size: 13px; }
.badge span { font-size: 11px; color: var(--fg-3); line-height: 1.3; }
.ladder { display: flex; flex-direction: column; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.step + .step { border-top: 1px dashed var(--line); }
.step .w { width: 14px; flex: none; }

/* ───────── Modal / sheet ───────── */
.ov { position: fixed; inset: 0; z-index: 70; background: rgba(22, 20, 17, .55); display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow-y: auto; }
.sheet { background: var(--bg-2); border: 1.5px solid var(--ink-line); border-radius: 6px; width: 100%; max-width: 560px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow-y: auto; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px 20px; border-bottom: 1px dashed var(--line); }
.sheet-head h2 { font-size: 26px; font-weight: 800; flex: 1; line-height: 1.05; }
.sheet-body { padding: 14px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.danger { border: 1px solid var(--red); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.red-ghost { background: transparent; color: var(--red); border-color: var(--red); }
.card-img { display: block; width: 100%; max-width: 380px; margin: 0 auto 14px; border-radius: 3px; border: 1px solid var(--line); -webkit-touch-callout: default; }
.share-text { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--bg); resize: none; font-family: var(--mono); font-size: 13px; }
.theme-seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; padding: 2px; }
.theme-seg button { padding: 8px; border-radius: 2px; font-weight: 600; color: var(--fg-2); }
.theme-seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }

/* Kayıt */
.onb .sheet { max-width: 520px; min-height: min(640px, calc(100dvh - 48px)); }
.onb-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0; }
.onb-body { padding: 18px 28px 8px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.onb-body h2 { font-size: clamp(34px, 9vw, 44px); font-weight: 800; line-height: .98; }
.onb-body .hint { color: var(--fg-2); margin-top: -6px; }
.onb-foot { padding: 14px 28px 26px; display: flex; flex-direction: column; gap: 14px; }
.floors { display: flex; gap: 4px; }
.floors i { flex: 1; height: 5px; border-radius: 0; background: var(--bg-3); }
.floors i.on { background: var(--fg); }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 14px; border-radius: 4px; background: var(--bg-2); border: 1.5px solid var(--line); transition: border-color .15s; }
.choice + .choice { margin-top: 8px; }
.choice:hover { border-color: var(--fg-3); }
.choice .w { width: 20px; flex: none; }
.choice[aria-pressed="true"] { border-color: var(--ink-line); box-shadow: inset 4px 0 0 var(--red); }
.choice .sub { display: block; font-size: 13px; color: var(--fg-2); margin-top: 2px; }
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.game-pick { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 4px; background: var(--bg-2); border: 1.5px solid var(--line); font-weight: 600; font-size: 14px; text-align: left; }
.game-pick:hover { border-color: var(--fg-3); }
.game-pick[aria-pressed="true"] { border-color: var(--ink-line); box-shadow: inset 4px 0 0 var(--red); }
.game-pick[aria-pressed="true"] span[style] { color: var(--red); }

/* Pencere görüntüleyici (hikâye) */
.story-ov { position: fixed; inset: 0; z-index: 80; background: rgba(22, 20, 17, .94); display: grid; place-items: center; }
.story-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); color: #fff; z-index: 3; }
.story-close:hover { background: rgba(255, 255, 255, .12); }
.story-frame { position: relative; width: min(400px, 100vw); height: min(700px, 100vh); height: min(700px, 100dvh); border-radius: 4px; overflow: hidden; color: #fff; display: flex; flex-direction: column; border: 10px solid #47403A; }
.story-bars { display: flex; gap: 4px; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0; position: relative; z-index: 2; }
.story-bars i { flex: 1; height: 3px; border-radius: 0; background: rgba(255, 255, 255, .35); overflow: hidden; }
.story-bars i b { display: block; height: 100%; width: 0; background: #fff; }
.story-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; position: relative; z-index: 2; }
.story-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 28px; gap: 12px; }
.story-big { font-size: clamp(44px, 13vw, 64px); font-weight: 800; line-height: .95; text-wrap: balance; }
.story-sub { font-size: 18px; opacity: .92; line-height: 1.4; }
.story-tap { position: absolute; top: 70px; bottom: 80px; z-index: 1; }
.story-tap.prev { left: 0; width: 33%; }
.story-tap.next { right: 0; width: 67%; }
.story-reply { display: flex; gap: 8px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 2; }
.story-reply input { flex: 1; min-width: 0; height: 44px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, .5); background: rgba(0, 0, 0, .18); color: #fff; padding: 0 14px; outline: none; }
.story-reply input::placeholder { color: rgba(255, 255, 255, .75); }
.story-reply .icon-btn { color: #fff; }

/* ───────── Landing ───────── */
.landing { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.land-top { max-width: 1120px; width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1.5px solid var(--ink-line); }
.land-hero { max-width: 1120px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; padding-block: 36px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex: 1; }
.land-copy h1 { font-size: clamp(56px, 9vw, 104px); font-weight: 800; letter-spacing: -.02em; line-height: .88; margin-top: 14px; }
.land-copy h1 em { font-style: normal; color: var(--red); display: inline-block; }
.land-copy .lead { font-size: 18px; color: var(--fg-2); margin: 22px 0 28px; max-width: 470px; }
.land-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.land-live { display: inline-flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 14px; }
.land-live b { color: var(--fg); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.land-art { position: relative; }
.land-art .facade { padding: 18px 18px 0; }
.land-art .facade-grid { gap: 9px; }
/* Cepheye raptiyeyle tutturulmuş notlar */
.float-note { position: absolute; background: #FFFDF6; color: #1F1C17; border: 1px solid #D4CBB8; border-radius: 2px; padding: 16px 14px 12px; box-shadow: 0 2px 0 rgba(0, 0, 0, .18); font-size: 14px; max-width: 250px; }
.float-note::before { content: ""; position: absolute; top: 6px; left: 50%; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: #C2391B; }
.float-note .muted { color: #6B6458; }
.float-note.n1 { left: -30px; top: 16%; transform: rotate(-2.5deg); }
.float-note.n2 { right: -16px; bottom: 14%; transform: rotate(2deg); }
.float-note .bende { height: 30px; font-size: 12px; padding: 0 9px 0 7px; margin-top: 8px; border-color: #D4CBB8; color: #1F1C17; }
.float-note .bende.on { background: #1F1C17; color: #FFFDF6; border-color: #1F1C17; }
.float-note .bende.on .cnt { color: #FFFDF6; }
.float-note .room-ic { color: #1F1C17; border-color: #1F1C17; }
/* Giriş katındaki sakin listesi panosu */
.directory { max-width: 1120px; width: calc(100% - 32px); margin: 0 auto 28px; background: #1F1C17; color: #EEE7D8; border-radius: 3px; border: 6px solid #47403A; padding: 16px 20px 14px; font-family: var(--mono); }
.dir-head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #B3A994; padding-bottom: 10px; border-bottom: 1px solid #47403A; }
.dir-row { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; font-size: 15px; }
.dir-row + .dir-row { border-top: 1px dashed #3A342D; }
.dir-row .kat { color: var(--lamp); width: 64px; flex: none; font-weight: 600; }
.dir-row b { font-family: var(--display); font-stretch: 75%; font-size: 22px; font-weight: 800; flex: none; }
.dir-row .dots { flex: 1; border-bottom: 1.5px dotted #5C554B; transform: translateY(-4px); min-width: 16px; }
.dir-row span:last-child { color: #B3A994; font-size: 13px; text-align: right; }
.land-foot { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--fg-3); padding: 8px 16px 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }

/* Toast */
#toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -20px); background: var(--btn); color: var(--btn-fg); padding: 10px 16px; border-radius: 4px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90; max-width: calc(100% - 32px); box-shadow: var(--shadow); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ───────── Responsive ───────── */
@media (max-width: 1000px) {
  .wrap { grid-template-columns: minmax(0, 640px); }
  .aside { display: none; }
  .calc { grid-template-columns: 1fr; }
  .calc-side { position: static; order: -1; }
}
@media (max-width: 900px) {
  .land-hero { grid-template-columns: 1fr; gap: 28px; padding-block: 24px 32px; }
  .float-note.n1 { left: 8px; top: 8px; }
  .float-note.n2 { right: 8px; bottom: 12px; }
}
@media (max-width: 640px) {
  .top .search, .top-actions .desk { display: none; }
  .top-inner { height: 56px; }
  .wrap { padding-block: 16px 116px; gap: 16px; }
  .dock { left: 0; right: 0; transform: none; justify-content: space-between; bottom: 0; border-radius: 0; border-width: 1.5px 0 0; padding: 2px 4px env(safe-area-inset-bottom, 0px); box-shadow: none; }
  .dock button { flex: 1; width: auto; }
  .fab { display: grid; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .composer-dock { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  .app.in-room .fab { display: none; }
  .rooms { grid-template-columns: 1fr 1fr; gap: 8px; }
  .room { min-height: 140px; padding: 14px; }
  .room h3 { font-size: 22px; }
  .badges { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px dashed var(--line); }
  .ov { padding: 0; align-items: flex-end; }
  .sheet { border-radius: 6px 6px 0 0; border-width: 1.5px 0 0; max-height: 92vh; max-height: 92dvh; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .onb .sheet { min-height: 100%; max-height: none; border-radius: 0; border: 0; }
  .onb-body, .onb-foot { padding-left: 20px; padding-right: 20px; }
  .story-frame { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; border-width: 0; }
  .float-note { display: none; }
  .land-copy .lead { font-size: 16px; }
  .home-art { padding: 18px 16px 0; }
  .big-win { width: 92px; height: 112px; }
  .dir-row .kat { width: 52px; }
  .dir-row span:last-child { display: none; }
}
@media (max-width: 400px) {
  .grid2 { grid-template-columns: 1fr; }
  .game-grid { grid-template-columns: 1fr; }
  .rooms { grid-template-columns: 1fr; }
  .dock button { font-size: 10px; }
  .note-foot .seen { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ───────── Bağlılık sistemleri ───────── */
.ico-xs { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; }
.tea-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 4px; border: 1px solid var(--line); color: var(--fg); font-family: var(--mono); font-weight: 600; font-size: 14px; }
.tea-chip:hover { border-color: var(--ink-line); }
.tea-chip svg { color: var(--red); }
.bell { position: relative; }
.dot-badge { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 2px; background: var(--red); color: #fff; font-family: var(--mono); font-size: 10px; font-weight: 600; display: grid; place-items: center; }
.new-pill { position: sticky; top: 72px; z-index: 20; align-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 4px; background: var(--btn); color: var(--btn-fg); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); animation: drop .3s ease-out; margin-bottom: -6px; }
@keyframes drop { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.note.fresh { border-color: var(--ink-line); box-shadow: inset 4px 0 0 var(--red); }

.today { display: grid; grid-template-columns: 1fr 1fr; }
.today-tile { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-width: 0; }
.today-tile + .today-tile { border-left: 1px dashed var(--line); }
.today-tile h3 { font-size: 20px; font-weight: 800; line-height: 1.05; }
.today-tile.hot h3 { color: var(--fg); }
.today .light-week { grid-template-columns: repeat(7, 9px); gap: 3px; }
.today .light-week i { height: 22px; }
.pill-done { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--green); flex: none; }
.bag { width: 42px; height: 42px; border-radius: 3px; border: 1.5px solid var(--red); color: var(--red); display: grid; place-items: center; flex: none; }
.today-tile.done .bag { border-color: var(--line); color: var(--fg-3); }
.bag.wiggle { animation: wiggle 2.6s ease-in-out infinite; }
@keyframes wiggle { 0%, 82%, 100% { transform: rotate(0); } 86% { transform: rotate(-10deg); } 90% { transform: rotate(9deg); } 94% { transform: rotate(-6deg); } }
.bag.big { width: 84px; height: 84px; border-radius: 4px; margin: 4px auto 0; border-width: 2px; }
.bag.big svg { width: 40px; height: 40px; }

.checklist { padding: 16px; display: flex; flex-direction: column; gap: 10px; border: 1.5px dashed var(--ink-line); }
.checklist h3 { font-size: 24px; font-weight: 800; line-height: 1; }
.meter { height: 5px; border-radius: 0; background: var(--bg-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fg); transition: width .5s; }
.check-row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-radius: 0; text-align: left; font-weight: 500; transition: color .15s; }
.check-row + .check-row { border-top: 1px dashed var(--line); }
.check-row:hover { color: var(--red); }
.check-row .tick { width: 20px; height: 20px; border-radius: 2px; border: 1.5px solid var(--fg-2); display: grid; place-items: center; flex: none; }
.check-row.done { color: var(--fg-3); text-decoration: line-through; cursor: default; }
.check-row.done:hover { color: var(--fg-3); }
.check-row.done .tick { background: var(--fg); border-color: var(--fg); color: var(--bg-2); }

.meeting-card { display: flex; flex-direction: column; gap: 10px; }
.meeting-card .q { font-size: 24px; font-weight: 800; line-height: 1.05; }
.meeting.flat { background: none; padding: 0; border: 0; }

.leaders .list-title { display: flex; align-items: center; gap: 8px; color: var(--fg); }
.leaders .list-title svg { color: var(--red); }
.leader-me { margin: 6px 12px 12px; padding: 10px 12px; border-radius: 3px; border: 1px dashed var(--ink-line); font-size: 13px; color: var(--fg); }
.feed-leaders { display: none; }

/* Süslenmiş pencere */
.big-win .curtain { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 2; }
.big-win .curtain.l { left: 0; border-radius: 0 0 60% 0; }
.big-win .curtain.r { right: 0; border-radius: 0 0 0 60%; }
.big-win .pet { position: absolute; left: 10%; bottom: 6px; z-index: 3; font-size: 26px; line-height: 1; }
.big-win .sill { position: absolute; right: 8%; bottom: 4px; z-index: 3; font-size: 24px; line-height: 1; }
.big-win.deco-isik-rgb { animation: rgb 4s steps(3) infinite; }
@keyframes rgb { 0% { background: #F2A500; } 33% { background: #E46A4E; } 66% { background: #6FA7B8; } 100% { background: #F2A500; } }
.big-win.deco-isik-gece { background: #E08A3C; }
.big-win.tiny { width: 62px; height: 76px; border-width: 4px; }
.big-win.tiny::before { width: 3px; } .big-win.tiny::after { height: 3px; }
.big-win.tiny .sil { width: 30px; height: 36px; font-size: 16px; border-radius: 15px 15px 2px 2px; }

/* Dar ekran: bugün kartı alt alta (yukarıdaki .today tanımından sonra gelmeli) */
@media (max-width: 640px) {
  .today { grid-template-columns: 1fr; }
  .today-tile + .today-tile { border-left: 0; border-top: 1px dashed var(--line); }
}

html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
