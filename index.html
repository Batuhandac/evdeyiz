/* evdeyiz — yerli uygulama kalitesi
   Telefonun kendi yazı tipi (iOS'ta SF Pro, Android'de Roboto), gece öncelikli, tek vurgu: lamba sarısı.
   Kullanıcı çok okumaz: büyük dokunma alanları, kısa metin, ana eylemler başparmak bölgesinde.
   Işık efekti yalnızca apartman pencerelerinde; kart ve butonlarda parlama, degrade yok. */
:root {
  --bg: #000000;
  --bg-2: #1C1C1E;
  --bg-3: #2C2C2E;
  --line: #38383A;
  --fg: #FFFFFF;
  --fg-2: #98989F;
  --fg-3: #636366;
  --accent: #FFB340;
  --accent-ink: #1A1100;
  --accent-text: #FFB340;
  --accent-soft: rgba(255, 179, 64, .14);
  --red: #FF453A;
  --red-soft: rgba(255, 69, 58, .16);
  --green: #32D74B;
  --tabbar: rgba(22, 22, 24, .86);
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  /* Eski adlar (app.js satır içi kullanır) */
  --lamp: var(--accent); --lamp-ink: var(--accent-ink); --lamp-text: var(--accent-text); --lamp-soft: var(--accent-soft);
  --tomato: var(--red); --tomato-soft: var(--red-soft); --mint: var(--green);
  /* Cephe her iki temada da gece */
  --night: #0B0B0E;
  --win-off: #1B1B21;
  --win-on: #FFB340;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --display: var(--font-d); --body: var(--font);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F2F7; --bg-2: #FFFFFF; --bg-3: #E9E9EE; --line: #D1D1D6;
    --fg: #000000; --fg-2: #6C6C70; --fg-3: #AEAEB2;
    --accent-text: #C46A00; --accent-soft: rgba(255, 159, 10, .14);
    --red: #FF3B30; --red-soft: rgba(255, 59, 48, .1); --green: #248A3D;
    --tabbar: rgba(249, 249, 249, .9); --scrim: rgba(0, 0, 0, .35); --shadow: 0 12px 32px rgba(0, 0, 0, .12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F2F7; --bg-2: #FFFFFF; --bg-3: #E9E9EE; --line: #D1D1D6;
  --fg: #000000; --fg-2: #6C6C70; --fg-3: #AEAEB2;
  --accent-text: #C46A00; --accent-soft: rgba(255, 159, 10, .14);
  --red: #FF3B30; --red-soft: rgba(255, 59, 48, .1); --green: #248A3D;
  --tabbar: rgba(249, 249, 249, .9); --scrim: rgba(0, 0, 0, .35); --shadow: 0 12px 32px rgba(0, 0, 0, .12);
  color-scheme: light;
}

/* ───────── Base ───────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-user-select: none; user-select: none; }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.sm { font-size: 14px; }
.xs { font-size: 12px; }
.b { font-weight: 600; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico { width: 22px; height: 22px; }
.ico-sm { width: 17px; height: 17px; }
.display { font-family: var(--font-d); letter-spacing: -.02em; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--accent-text); }

/* ───────── Buttons ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 16px; background: var(--bg-3); color: var(--fg); transition: transform .12s, opacity .15s, background-color .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); opacity: .85; }
.btn.lamp { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent-text); }
.btn.soft { background: var(--accent-soft); color: var(--accent-text); }
.btn.on { background: var(--bg-3); color: var(--fg-2); }
.btn.lg { min-height: 54px; font-size: 17px; padding: 0 28px; }
.btn.sm { min-height: 34px; font-size: 15px; padding: 0 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--fg); transition: background-color .15s; }
.icon-btn:active { background: var(--bg-3); }

/* ───────── Brand ───────── */
.brand { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-d); font-weight: 700; font-size: 21px; letter-spacing: -.03em; }
.mark { width: 28px; height: 28px; border-radius: 7px; background: var(--night); display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 5px; flex: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.mark i { border-radius: 1.5px; background: #2A2A31; }
.mark i.on { background: var(--win-on); }

/* ───────── Avatars ───────── */
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 17px; -webkit-user-select: none; user-select: none; }
.av.s32 { width: 32px; height: 32px; font-size: 14px; }
.av.anon { background: var(--bg-3) !important; color: var(--fg-2); }
.star { width: 15px; height: 15px; color: var(--accent); display: inline-block; vertical-align: -2px; margin-left: 2px; }
.daire { font-size: 12px; font-weight: 500; color: var(--fg-2); font-variant-numeric: tabular-nums; }

/* ───────── Layout ───────── */
/* Çentik payı çubuğun içinde: sayfa en üstteyken de çubuk çentiğin hemen altında görünür */
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.top-inner { max-width: 1040px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .search { flex: 1; max-width: 420px; margin-left: 24px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 620px) 320px; gap: 32px; justify-content: center; padding-block: 8px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.aside { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); align-self: start; }

.search { display: flex; align-items: center; gap: 8px; height: 38px; border-radius: 11px; background: var(--bg-3); padding: 0 12px; color: var(--fg-2); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); font-size: 16px; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 4px 4px 4px; }
.page-head h1 { font-family: var(--font-d); font-size: 34px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
.page-head p { color: var(--fg-2); margin-top: 2px; font-size: 15px; }
.seg { display: inline-flex; background: var(--bg-3); border-radius: 9px; padding: 2px; flex: none; }
.seg button { padding: 6px 12px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--fg); min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--bg-2); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.seg.wide { display: grid; grid-template-columns: 1fr 1fr; }

.card { background: var(--bg-2); border-radius: 16px; }
.pad { padding: 16px; }

/* Sekme çubuğu */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; padding: 4px; border-radius: 22px; background: var(--tabbar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: var(--shadow), inset 0 0 0 .5px var(--line); }
.dock button { position: relative; width: 78px; height: 52px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--fg-2); }
.dock button svg { width: 25px; height: 25px; }
.dock button[aria-current="page"] { color: var(--accent-text); }
.dock .badge { position: absolute; top: 3px; left: 50%; margin-left: 5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 41; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: none; place-items: center; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.94); }

/* ───────── Apartman cephesi ───────── */
.facade { background: var(--night); border-radius: 18px; padding: 14px 14px 0; position: relative; overflow: hidden; color: #fff; }
.facade-roof { height: 6px; margin: 0 -14px 12px; background: repeating-linear-gradient(90deg, #17171C 0 16px, transparent 16px 20px); }
.facade-grid { display: grid; grid-template-columns: repeat(var(--cols, 8), 1fr); gap: 6px; position: relative; }
.w { aspect-ratio: 3 / 4; border-radius: 3px; background: var(--win-off); position: relative; }
.w.on { background: var(--win-on); box-shadow: 0 0 12px rgba(255, 179, 64, .28); }
.w.tw { animation: flick 7s infinite; }
.w.me { background: var(--win-on); outline: 2px solid #fff; outline-offset: 2px; }
@keyframes flick { 0%, 46%, 100% { background: var(--win-off); box-shadow: none; } 50%, 96% { background: var(--win-on); box-shadow: 0 0 12px rgba(255, 179, 64, .28); } }
.facade-door { width: 16%; height: 20px; margin: 10px auto 0; border-radius: 4px 4px 0 0; background: #17171C; }
.facade-cap { padding: 12px 2px 14px; position: relative; }
.facade-num { font-family: var(--font-d); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.facade-cap p { font-size: 14px; color: rgba(255, 255, 255, .65); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; flex: none; }

/* Pano kahramanı: canlı apartman + ışık */
.hero-light { position: relative; border-radius: 20px; overflow: hidden; background: var(--night); color: #fff; }
.hero-light .facade { border-radius: 0; padding: 14px 14px 0; }
.hero-light .facade-roof, .hero-light .facade-door { display: none; }
.hero-light .facade-grid { gap: 6px; }
.hero-cap { position: relative; margin-top: -64px; padding: 44px 16px 12px; display: flex; align-items: flex-end; gap: 12px; background: linear-gradient(transparent, var(--night) 55%); }
.hero-cap b { display: block; font-family: var(--font-d); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.hero-cap span { font-size: 14px; color: rgba(255, 255, 255, .65); }
.hero-cap .pill-done { color: var(--win-on); }
.hero-week { display: flex; align-items: center; gap: 10px; padding: 10px 16px 14px; font-size: 13px; color: rgba(255, 255, 255, .6); border-top: .5px solid #26262C; }

/* Liste hücreleri (iOS gruplu liste) */
.cells { overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; }
.cell + .cell { border-top: .5px solid var(--line); }
.cell h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.cell p { font-size: 13px; color: var(--fg-2); }
.cell-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.cell.done .cell-ic { background: var(--bg-3); color: var(--fg-3); }
.cell-ic.wiggle { animation: wiggle 2.6s ease-in-out infinite; }

/* Side lists */
.list-title { font-family: var(--font-d); font-size: 20px; font-weight: 700; padding: 14px 16px 4px; letter-spacing: -.02em; }
.list-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 16px; }
.list-row + .list-row { border-top: .5px solid var(--line); }
.trend-rank { font-weight: 600; font-size: 14px; color: var(--fg-3); width: 18px; font-variant-numeric: tabular-nums; }
.list-more { padding: 10px 16px 14px; color: var(--accent-text); font-size: 15px; font-weight: 500; }
.side-foot { font-size: 12px; color: var(--fg-3); display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 0 4px; }

/* ───────── Pencereler (hikâyeler) ───────── */
.windows { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 2px; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
.windows::-webkit-scrollbar { display: none; }
.win-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; flex: none; }
.win-btn:active .win, .win-btn:active .big-win { transform: scale(.95); }
.win { width: 60px; height: 72px; border-radius: 14px 14px 8px 8px; position: relative; display: grid; place-items: center; background: var(--win-off); border: 3px solid #2A2A31; overflow: hidden; transition: transform .12s; }
.win::before, .win::after { content: ""; position: absolute; background: #2A2A31; }
.win::before { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
.win::after { top: 42%; left: 0; right: 0; height: 2px; }
.win.lit { background: var(--win-on); border-color: #3A3020; box-shadow: 0 0 16px rgba(255, 179, 64, .3); }
.win.lit::before, .win.lit::after { background: #3A3020; }
.win .who { position: relative; z-index: 1; width: 30px; height: 32px; border-radius: 15px 15px 4px 4px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; margin-top: 16px; }
.win.lit .who { background: rgba(26, 17, 0, .78); color: var(--win-on); }
.win:not(.lit) .who { background: rgba(255, 255, 255, .08); color: #8E8E96; }
.win.mine { background: var(--bg-2); border-style: dashed; border-color: var(--line); }
.win.mine::before, .win.mine::after { display: none; }
.win.mine .plus { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.win-name { font-size: 11px; color: var(--fg-2); max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ───────── Işık yoklaması ───────── */
.light { display: flex; align-items: center; gap: 16px; padding: 16px; }
.light-week { display: inline-grid; grid-template-columns: repeat(7, 7px); gap: 3px; flex: none; }
.light-week i { height: 18px; border-radius: 3px; background: #2A2A31; }
.light-week i.on { background: var(--win-on); }
.light h3 { font-size: 17px; font-weight: 600; }

/* ───────── Composer ───────── */
.composer { padding: 12px 16px; display: flex; gap: 12px; }
.composer textarea { width: 100%; background: none; border: 0; outline: none; resize: none; font-size: 17px; line-height: 1.4; padding: 8px 0; min-height: 44px; }
.composer textarea::placeholder { color: var(--fg-3); }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--fg-2); padding: 6px 8px 6px 0; }
.switch { width: 42px; height: 26px; border-radius: 13px; background: var(--bg-3); position: relative; transition: background-color .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transition: transform .2s; }
.toggle[aria-pressed="true"] { color: var(--fg); }
.toggle[aria-pressed="true"] .switch { background: var(--green); }
.toggle[aria-pressed="true"] .switch::after { transform: translateX(16px); }
.counter { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--accent-soft); }

/* ───────── Pano notları ───────── */
.note { padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
.note-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.note-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.note-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-meta { font-size: 13px; color: var(--fg-2); display: flex; align-items: center; gap: 5px; }
.note-text { font-size: 16px; line-height: 1.42; white-space: pre-wrap; word-break: break-word; }
.hashtag { color: var(--accent-text); font-weight: 500; }
.note-foot { display: flex; align-items: center; gap: 2px; margin: 0 -6px; }
.bende { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 8px; border-radius: 20px; font-weight: 600; font-size: 15px; color: var(--fg-2); transition: transform .12s, background-color .15s, color .15s; }
.bende:active { transform: scale(.94); }
.bende .cnt { font-weight: 500; font-variant-numeric: tabular-nums; }
.bende.on { color: var(--accent-text); background: var(--accent-soft); }
.bende.on svg { animation: wave .5s ease; transform-origin: 70% 90%; }
@keyframes wave { 0% { transform: rotate(0); } 30% { transform: rotate(-18deg); } 60% { transform: rotate(12deg); } 100% { transform: rotate(0); } }
.mini { display: inline-flex; align-items: center; gap: 5px; height: 40px; padding: 0 10px; border-radius: 20px; color: var(--fg-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.mini:active { background: var(--bg-3); }
.mini.on { color: var(--green); }
.note-foot .seen { margin-left: auto; font-size: 12px; color: var(--fg-3); display: inline-flex; align-items: center; gap: 4px; padding-right: 6px; font-variant-numeric: tabular-nums; }
.shared-by { font-size: 13px; font-weight: 600; color: var(--green); display: flex; align-items: center; gap: 6px; }

/* Apartman toplantısı (anket) */
.meeting { border-radius: 14px; background: var(--bg-3); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.meeting-title { font-size: 13px; font-weight: 600; color: var(--fg-2); display: flex; align-items: center; gap: 6px; }
.opt { position: relative; min-height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; overflow: hidden; background: var(--bg-2); text-align: left; }
button.opt { font-weight: 600; }
button.opt:active { transform: scale(.98); }
.opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--bg-3); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.opt.win-opt .bar { background: var(--accent-soft); }
.opt > span { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; }
.opt.win-opt > span:first-of-type { font-weight: 700; }
.opt .pct { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

/* Fiş (maaş hesabı) */
.receipt { background: #FFFDF7; color: #1C1C1E; border-radius: 10px 10px 0 0; padding: 18px 18px 26px; position: relative; font-variant-numeric: tabular-nums; max-width: 100%;
  -webkit-mask: radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 0 100% / 18px 100% repeat-x, linear-gradient(#000, #000) top / 100% calc(100% - 7px) no-repeat;
          mask: radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 0 100% / 18px 100% repeat-x, linear-gradient(#000, #000) top / 100% calc(100% - 7px) no-repeat; }
.receipt-head { text-align: center; padding-bottom: 10px; border-bottom: 1.5px dashed rgba(0, 0, 0, .18); }
.receipt-head b { font-family: var(--font-d); font-size: 18px; font-weight: 700; letter-spacing: -.01em; display: block; }
.receipt-head span { font-size: 12px; color: #8E8E93; }
.r-line { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 15px; }
.r-line.minus span:last-child { color: #D70015; }
.r-sep { border-top: 1.5px dashed rgba(0, 0, 0, .18); margin: 6px 0; }
.r-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 4px; }
.r-total span { font-weight: 600; font-size: 14px; color: #6C6C70; }
.r-total b { font-family: var(--font-d); font-size: clamp(34px, 9vw, 44px); font-weight: 800; letter-spacing: -.03em; }
.r-foot { text-align: center; font-size: 12px; color: #8E8E93; margin-top: 10px; }
.stamp { position: relative; display: table; margin: 14px auto 2px; transform: rotate(-6deg); font-family: var(--font-d); font-weight: 800; font-size: 20px; letter-spacing: .02em; color: #D70015; border: 3px solid #D70015; border-radius: 8px; padding: 2px 10px; opacity: .85; pointer-events: none; }
.stamp.go { color: #248A3D; border-color: #248A3D; }
.receipt.mini-r { padding: 14px 14px 22px; }
.receipt.mini-r .r-total b { font-size: 30px; }
.receipt.mini-r .stamp { font-size: 15px; margin-top: 10px; }
.embed { display: block; width: 100%; text-align: left; max-width: 360px; }
.embed-cap { font-size: 13px; color: var(--fg-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }

/* Empty */
.empty { padding: 36px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .win { width: 54px; height: 66px; }
.empty h2 { font-family: var(--font-d); font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.empty p { color: var(--fg-2); max-width: 320px; }

/* ───────── Oyun odası ───────── */
.games { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.games::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 4px; border-radius: 18px; background: var(--bg-2); font-weight: 600; font-size: 14px; flex: none; }
.chip.txt { padding: 0 14px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.gcode { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 800; display: grid; place-items: center; flex: none; letter-spacing: -.02em; }
.gcode.lg { width: 48px; height: 48px; border-radius: 14px; font-size: 13px; }
.lan { overflow: hidden; }
.lan-art { padding: 18px 18px 16px; background: var(--night); color: #fff; }
.lan-art h3 { font-family: var(--font-d); font-size: 26px; font-weight: 700; letter-spacing: -.025em; margin: 6px 0 4px; }
.lan-art p { color: rgba(255, 255, 255, .65); font-size: 14px; }
.lan-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--win-on); }
.slots { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
.slots i { height: 12px; border-radius: 3px; background: var(--bg-3); }
.slots i.on { background: var(--fg-2); }
.slots i.me { background: var(--accent); }
.lobby { padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 8px; background: var(--bg-3); color: var(--fg-2); }
.tag.hot { background: var(--red-soft); color: var(--red); }
.tag.mine { background: var(--accent-soft); color: var(--accent-text); }

/* ───────── Odalar ───────── */
.rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rooms > *, .calc > *, .wrap > * { min-width: 0; }
.room { min-width: 0; text-align: left; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 148px; transition: transform .12s; }
.room:active { transform: scale(.97); }
.room-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--bg-3); }
.room-ic svg { width: 19px; height: 19px; }
.room h3 { font-family: var(--font-d); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.room .sub { font-size: 13px; color: var(--fg-2); margin-top: 2px; line-height: 1.3; }
.room .last { font-size: 12px; color: var(--fg-3); margin-top: auto; }
.online { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.thread-head { display: flex; align-items: center; gap: 12px; }
.thread-head h1 { font-family: var(--font-d); font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.thread { padding: 16px; display: flex; flex-direction: column; min-height: 50vh; }
.bgroup { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
.bgroup.me { justify-content: flex-end; }
.bubbles { display: flex; flex-direction: column; gap: 2px; max-width: 78%; }
.bgroup.me .bubbles { align-items: flex-end; }
.bname { font-size: 12px; color: var(--fg-2); margin: 0 0 2px 12px; }
.bubble { padding: 8px 13px; border-radius: 18px; background: var(--bg-3); word-break: break-word; font-size: 16px; }
.bgroup:not(.me) .bubble { border-bottom-left-radius: 6px; }
.bgroup.me .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.typing { color: var(--fg-3); font-size: 13px; padding: 8px 0 0 40px; display: flex; align-items: center; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-3); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer-dock { position: sticky; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; font-size: 14px; padding: 7px 13px; border-radius: 16px; background: var(--bg-3); }
.msg-form { display: flex; gap: 8px; }
.msg-form input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: .5px solid var(--line); background: var(--bg); padding: 0 16px; outline: none; font-size: 16px; }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send svg { width: 18px; height: 18px; }

/* ───────── Hesap ───────── */
.calc { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.fields { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--fg-2); font-weight: 500; padding-left: 4px; }
.input { position: relative; }
.input input, .input select, .input textarea { width: 100%; height: 48px; border-radius: 12px; border: 0; background: var(--bg-2); padding: 0 14px; font-size: 17px; outline: none; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s; -webkit-appearance: none; appearance: none; }
.input textarea { height: auto; padding: 12px 14px; resize: vertical; line-height: 1.4; font-size: 16px; }
.input input:focus, .input select:focus, .input textarea:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.input .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-3); font-size: 15px; pointer-events: none; }
.input.has-unit input { padding-right: 48px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.calc-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }
.note-s { font-size: 13px; color: var(--fg-3); }

/* ───────── Dairem (profil) ───────── */
.home-hero { overflow: hidden; }
.home-art { background: var(--night); padding: 22px 20px 0; display: flex; align-items: flex-end; gap: 18px; position: relative; }
.big-win { width: 108px; height: 132px; border-radius: 22px 22px 10px 10px; background: var(--win-on); box-shadow: 0 0 36px rgba(255, 179, 64, .35); position: relative; display: grid; place-items: end center; overflow: hidden; flex: none; border: 5px solid #3A3020; border-bottom: 0; }
.big-win::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #3A3020; transform: translateX(-50%); }
.big-win::after { content: ""; position: absolute; left: 0; right: 0; top: 40%; height: 4px; background: #3A3020; }
.big-win .sil { width: 62px; height: 74px; border-radius: 31px 31px 6px 6px; background: rgba(26, 17, 0, .8); display: grid; place-items: center; color: var(--win-on); font-weight: 800; font-size: 28px; position: relative; z-index: 1; }
.plate { position: relative; margin-bottom: 18px; background: rgba(255, 255, 255, .08); color: #fff; border-radius: 12px; padding: 8px 14px; }
.plate small { display: block; font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, .55); }
.plate b { font-family: var(--font-d); font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.home-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.home-body h2 { font-family: var(--font-d); font-size: 26px; font-weight: 700; letter-spacing: -.025em; }
.title-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); padding: 5px 10px; border-radius: 999px; }
.title-chip .w { width: 9px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--fg-2); font-size: 14px; }
.meta-row span { display: inline-flex; align-items: center; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.stat { background: var(--bg-3); border-radius: 14px; padding: 10px 12px; }
.stat b { font-family: var(--font-d); font-size: 22px; font-weight: 700; display: block; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--fg-2); }

.sakin { border-radius: 20px; overflow: hidden; background: #1C1C1E; color: #fff; max-width: 520px; box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .1); }
.sakin-top { display: flex; justify-content: space-between; padding: 12px 16px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--win-on); border-bottom: .5px solid rgba(255, 255, 255, .1); }
.sakin-body { display: flex; gap: 16px; padding: 16px; }
.sakin .big-win { width: 84px; height: 104px; border-width: 4px; border-radius: 16px 16px 8px 8px; }
.sakin .big-win .sil { width: 46px; height: 56px; font-size: 22px; }
.sakin .big-win::before { width: 3px; } .sakin .big-win::after { height: 3px; }
.sakin-name { font-family: var(--font-d); font-size: 21px; font-weight: 700; letter-spacing: -.02em; word-break: break-all; }
.sakin-title { color: var(--win-on); font-weight: 600; font-size: 14px; margin: 2px 0 12px; }
.sakin dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
.sakin dt { font-size: 11px; color: rgba(255, 255, 255, .5); }
.sakin dd { margin: 1px 0 0; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.sakin-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; font-size: 12px; color: rgba(255, 255, 255, .5); border-top: .5px solid rgba(255, 255, 255, .1); font-variant-numeric: tabular-nums; }

.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.badge { padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.badge .win { width: 42px; height: 52px; border-width: 2px; border-radius: 10px 10px 6px 6px; }
.badge b { font-size: 14px; }
.badge span { font-size: 12px; color: var(--fg-2); line-height: 1.3; }
.ladder { display: flex; flex-direction: column; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.step + .step { border-top: .5px solid var(--line); }
.step .w { width: 14px; flex: none; }

/* ───────── Modal / sheet ───────── */
.ov { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow-y: auto; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { background: var(--bg-2); border-radius: 18px; width: 100%; max-width: 540px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow-y: auto; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 12px 6px 20px; }
.sheet-head h2 { font-family: var(--font-d); font-size: 20px; font-weight: 700; letter-spacing: -.02em; flex: 1; }
.sheet-head .icon-btn { width: 32px; height: 32px; background: var(--bg-3); color: var(--fg-2); }
.sheet-head .icon-btn svg { width: 16px; height: 16px; }
.sheet-body { padding: 8px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.danger { background: var(--bg-3); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.btn.red { background: var(--red); color: #fff; }
.btn.red-ghost { background: var(--red-soft); color: var(--red); }
.card-img { display: block; width: 100%; max-width: 360px; margin: 0 auto 6px; border-radius: 16px; -webkit-touch-callout: default; }
.share-text { width: 100%; min-height: 110px; border: 0; border-radius: 12px; padding: 12px; background: var(--bg-3); resize: none; font-size: 15px; }
.theme-seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg-3); border-radius: 9px; padding: 2px; }
.theme-seg button { padding: 7px; border-radius: 7px; font-weight: 600; font-size: 14px; }
.theme-seg button[aria-pressed="true"] { background: var(--bg-2); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }

/* Kayıt */
.onb .sheet { max-width: 480px; min-height: min(640px, calc(100dvh - 48px)); }
.onb-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 0; }
.onb-body { padding: 16px 24px 8px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.onb-body h2 { font-family: var(--font-d); font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
.onb-body .hint { color: var(--fg-2); margin-top: -8px; font-size: 15px; }
.onb-foot { padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
.floors { display: flex; gap: 6px; }
.floors i { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-3); }
.floors i.on { background: var(--accent); }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--bg-3); box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s, transform .12s; }
.choice + .choice { margin-top: 8px; }
.choice:active { transform: scale(.98); }
.choice .w { width: 20px; flex: none; }
.choice[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.choice .sub { display: block; font-size: 13px; color: var(--fg-2); margin-top: 2px; }
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.game-pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--bg-3); box-shadow: inset 0 0 0 2px transparent; font-weight: 600; font-size: 15px; text-align: left; }
.game-pick:active { transform: scale(.98); }
.game-pick[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }

/* Pencere görüntüleyici (hikâye) */
.story-ov { position: fixed; inset: 0; z-index: 80; background: #000; display: grid; place-items: center; }
.story-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); color: #fff; z-index: 3; }
.story-frame { position: relative; width: min(400px, 100vw); height: min(720px, 100vh); height: min(720px, 100dvh); border-radius: 22px; overflow: hidden; color: #fff; display: flex; flex-direction: column; }
.story-bars { display: flex; gap: 4px; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0; position: relative; z-index: 2; }
.story-bars i { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255, 255, 255, .35); overflow: hidden; }
.story-bars i b { display: block; height: 100%; width: 0; background: #fff; }
.story-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; position: relative; z-index: 2; }
.story-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 28px; gap: 12px; }
.story-big { font-family: var(--font-d); font-size: clamp(38px, 11vw, 54px); font-weight: 800; letter-spacing: -.035em; line-height: 1.02; text-wrap: balance; }
.story-sub { font-size: 19px; opacity: .9; line-height: 1.35; }
.story-tap { position: absolute; top: 70px; bottom: 80px; z-index: 1; }
.story-tap.prev { left: 0; width: 33%; }
.story-tap.next { right: 0; width: 67%; }
.story-reply { display: flex; gap: 8px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 2; }
.story-reply input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid rgba(255, 255, 255, .45); background: rgba(0, 0, 0, .15); color: #fff; padding: 0 16px; outline: none; font-size: 16px; }
.story-reply input::placeholder { color: rgba(255, 255, 255, .7); }
.story-reply .icon-btn { color: #fff; }

/* ───────── Landing ───────── */
.landing { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--night); color: #fff; }
.landing .btn.ghost { color: var(--win-on); }
.land-top { max-width: 1120px; width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.land-hero { max-width: 1120px; width: 100%; margin: 0 auto; flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "copy art" "cta art"; column-gap: 56px; align-content: center; padding: 24px max(20px, env(safe-area-inset-left, 0px)) 40px; }
.land-copy { grid-area: copy; align-self: end; }
.land-copy h1 { font-family: var(--font-d); font-size: clamp(44px, 6.4vw, 76px); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.land-copy h1 em { font-style: normal; color: var(--win-on); }
.land-copy .lead { font-size: 19px; color: rgba(255, 255, 255, .65); margin-top: 16px; }
.land-art { grid-area: art; position: relative; align-self: center; }
.land-art .facade { padding: 16px 16px 0; border-radius: 24px; background: #111116; }
.land-art .facade-grid { gap: 8px; }
.land-count { position: absolute; left: 16px; right: 16px; bottom: 0; padding: 48px 4px 16px; background: linear-gradient(transparent, #111116 60%); border-radius: 0 0 24px 24px; display: flex; align-items: baseline; gap: 8px; }
.land-count b { font-family: var(--font-d); font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.land-count span { color: rgba(255, 255, 255, .65); font-size: 15px; }
.land-cta { grid-area: cta; align-self: start; display: flex; flex-direction: column; gap: 10px; margin-top: 28px; max-width: 380px; text-align: center; }
.land-cta .faint { color: rgba(255, 255, 255, .4); }
.float-note { position: absolute; background: #1C1C1E; color: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); font-size: 14px; max-width: 250px; }
.float-note .muted { color: #98989F; }
.float-note.n1 { left: -36px; top: 14%; }
.float-note.n2 { right: -20px; top: 52%; }
.float-note .bende { height: 32px; font-size: 13px; padding: 0 10px 0 8px; margin-top: 8px; }
.float-note .bende.on { color: var(--win-on); background: rgba(255, 179, 64, .14); }
.float-note .room-ic { background: #2C2C2E; color: var(--win-on); }
.land-foot { text-align: center; font-size: 12px; color: rgba(255, 255, 255, .35); padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }

/* Toast */
#toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -24px); background: var(--bg-2); color: var(--fg); padding: 12px 18px; border-radius: 22px; font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2, .9, .3, 1.2); z-index: 90; max-width: calc(100% - 32px); box-shadow: var(--shadow), inset 0 0 0 .5px var(--line); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ───────── Bağlılık sistemleri ───────── */
.ico-xs { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; }
.tea-chip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px 0 10px; border-radius: 16px; background: var(--bg-2); color: var(--fg); font-weight: 600; font-size: 15px; }
.tea-chip svg { color: var(--accent-text); }
.bell { position: relative; }
.dot-badge { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
.new-pill { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 20; align-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); animation: drop .35s cubic-bezier(.2, .9, .3, 1.2); margin-bottom: -6px; }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.note.fresh { box-shadow: inset 0 0 0 1.5px var(--accent); }

.today { display: grid; grid-template-columns: 1fr 1fr; }
.today-tile { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-width: 0; }
.pill-done { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--green); flex: none; }
.bag { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
@keyframes wiggle { 0%, 82%, 100% { transform: rotate(0); } 86% { transform: rotate(-10deg); } 90% { transform: rotate(9deg); } 94% { transform: rotate(-6deg); } }
.bag.big { width: 84px; height: 84px; border-radius: 24px; margin: 4px auto 0; }
.bag.big svg { width: 40px; height: 40px; }

.checklist { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.checklist h3 { font-family: var(--font-d); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.meter { height: 4px; border-radius: 2px; background: var(--bg-3); overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s; }
.check-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; text-align: left; font-weight: 500; font-size: 15px; }
.check-row + .check-row { border-top: .5px solid var(--line); }
.check-row .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--fg-3); display: grid; place-items: center; flex: none; }
.check-row > svg { color: var(--fg-3); }
.check-row.done { color: var(--fg-3); cursor: default; }
.check-row.done .tick { background: var(--green); border-color: var(--green); color: #fff; }

.meeting-card { display: flex; flex-direction: column; gap: 10px; }
.meeting-card .q { font-family: var(--font-d); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.meeting.flat { background: none; padding: 0; }

.leaders .list-title { display: flex; align-items: center; gap: 8px; color: var(--fg); }
.leaders .list-title svg { color: var(--accent-text); }
.leader-me { margin: 6px 12px 12px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; color: var(--fg); }
.feed-leaders { display: none; }

/* Süslenmiş pencere */
.big-win .curtain { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 2; opacity: .95; }
.big-win .curtain.l { left: 0; border-radius: 0 0 60% 0; }
.big-win .curtain.r { right: 0; border-radius: 0 0 0 60%; }
.big-win .pet { position: absolute; left: 10%; bottom: 6px; z-index: 3; font-size: 26px; line-height: 1; }
.big-win .sill { position: absolute; right: 8%; bottom: 4px; z-index: 3; font-size: 24px; line-height: 1; }
.big-win.deco-isik-rgb { animation: rgb 4s linear infinite; }
@keyframes rgb { 0% { box-shadow: 0 0 34px #FF6B6B; } 33% { box-shadow: 0 0 34px #4DD8FF; } 66% { box-shadow: 0 0 34px #7CFFB2; } 100% { box-shadow: 0 0 34px #FF6B6B; } }
.big-win.deco-isik-gece { background: #FF9A4A; box-shadow: 0 0 40px rgba(255, 140, 60, .5); }
.big-win.tiny { width: 60px; height: 72px; border-width: 3px; border-radius: 14px 14px 8px 8px; box-shadow: 0 0 16px rgba(255, 179, 64, .3); }
.big-win.tiny::before { width: 2px; } .big-win.tiny::after { height: 2px; }
.big-win.tiny .sil { width: 30px; height: 36px; font-size: 14px; border-radius: 15px 15px 4px 4px; }

/* ───────── Responsive (en sonda: yukarıdaki tanımları ezer) ───────── */
@media (max-width: 1000px) {
  .wrap { grid-template-columns: minmax(0, 620px); }
  .aside { display: none; }
  .calc { grid-template-columns: 1fr; }
  .calc-side { position: static; order: -1; }
}
@media (max-width: 860px) {
  .land-hero { grid-template-columns: 1fr; grid-template-areas: "copy" "art" "cta"; row-gap: 22px; align-content: start; padding-top: 12px; padding-bottom: 12px; }
  .land-copy { align-self: start; }
  .land-cta { max-width: none; margin-top: 4px; }
  .float-note { display: none; }
}
@media (max-width: 640px) {
  .top .search, .top-actions .desk { display: none; }
  .top-inner { height: 52px; }
  .wrap { padding-block: 4px 120px; gap: 12px; }
  .dock { left: 0; right: 0; transform: none; bottom: 0; border-radius: 0; justify-content: space-around; padding: 4px 4px calc(2px + env(safe-area-inset-bottom, 0px)); box-shadow: inset 0 .5px 0 var(--line); }
  .dock button { flex: 1; width: auto; height: 50px; border-radius: 12px; }
  .fab { display: grid; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
  .composer-dock { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  .app.in-room .fab { display: none; }
  .rooms { grid-template-columns: 1fr 1fr; gap: 10px; }
  .badges { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .ov { padding: 0; align-items: flex-end; }
  .sheet { border-radius: 14px 14px 0 0; max-height: 94vh; max-height: 94dvh; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .28s cubic-bezier(.2, .9, .3, 1); }
  .sheet::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 0; flex: none; }
  .onb .sheet { min-height: 100%; max-height: none; border-radius: 0; animation: none; }
  .onb .sheet::before { display: none; }
  .onb-body, .onb-foot { padding-left: 20px; padding-right: 20px; }
  .story-frame { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; }
  .home-art { padding: 18px 16px 0; }
  .big-win { width: 92px; height: 112px; }
}
@keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (max-width: 400px) {
  .grid2 { grid-template-columns: 1fr; }
  .game-grid { grid-template-columns: 1fr; }
  .dock button { font-size: 10px; }
  .note-foot .seen { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ───────── Şikayet / engelle, yasal bağlantılar ───────── */
.note-head .more { margin-left: auto; width: 32px; height: 32px; color: var(--fg-3); flex-shrink: 0; }
.lobby-act { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.lobby-act .more { width: 32px; height: 28px; color: var(--fg-3); }
button.bname { display: inline-flex; align-items: center; gap: 4px; }
.ico-xs { width: 12px; height: 12px; }
.land-foot a, .side-foot a { color: inherit; text-decoration: none; }
.legal-links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.legal-links a, .consent a { color: var(--accent); text-decoration: none; }
.consent { margin-top: 12px; line-height: 1.5; }
.mod-sheet .btn.block { justify-content: flex-start; gap: 10px; }

/* ───────── Sunucu sürümü: duyuru, yorum, bağlantı ───────── */
.offline-bar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; background: var(--bg-3); color: var(--fg-2); }
.card.ann { padding: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; box-shadow: inset 0 0 0 1px var(--line); }
.card.ann h3 { font-size: 17px; margin: 0; }
.card.ann p { margin: 0; color: var(--fg-2); font-size: 15px; }
.card.ann .btn { margin-top: 6px; text-decoration: none; }
.ann-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: .04em; }
.card.ann.sponsor .ann-label, .card.ann.turnuva .ann-label { color: var(--accent); }
.win-hint { align-self: center; font-size: 13px; color: var(--fg-3); max-width: 220px; line-height: 1.35; padding-left: 4px; }
.thread-sheet { gap: 12px; }
.thread-sheet .card.note { box-shadow: none; background: var(--bg-3); }
.replies { display: flex; flex-direction: column; gap: 14px; padding: 4px 2px; }
.reply { display: flex; gap: 10px; align-items: flex-start; }
.reply p { margin: 2px 0 0; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
.reply-head { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.reply-head .more { margin-left: auto; width: 28px; height: 28px; color: var(--fg-3); }
.thread-sheet .msg-form { position: sticky; bottom: 0; background: var(--bg-2); padding-top: 8px; }
.bubble[data-a] { cursor: pointer; }
.note-head > button[data-a="neighbor"] { border-radius: 50%; }

html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
</style>

    { id: "yoklama1", label: "İlk ışık",        desc: "Pencerendeki ışığı ilk kez yaktın" },
    { id: "yoklama3", label: "3 gece seri",     desc: "3 gün üst üste ışığın yandı" },
    { id: "ogleci",   label: "Öğlenci",         desc: "12'den sonra uyananlar kulübü" },
    { id: "gece",     label: "Balkon sakini",   desc: "Gece Balkon odasına yazdın" },
    { id: "itiraf",   label: "İtirafçı",        desc: "İlk gönderini paylaştın" },
    { id: "duo",      label: "Duo partner",     desc: "Bir lobiye katıldın" },
    { id: "red",      label: "Teklif reddeden", desc: "Hesap aracı \"evde kal\" dedi" },
    { id: "muhabbet", label: "Muhabbetçi",      desc: "Odalara 3 mesaj yazdın" },
    { id: "bakkal",   label: "Bakkal müdavimi", desc: "Bakkaldan ilk eşyanı aldın" },
    { id: "yeni",     label: "Yerleşik sakin",  desc: "Taşınma listesini bitirdin" }
  ]
};

</script>
<script>
/* evdeyiz — ev gençlerinin apartmanı. Pano, odalar, lobiler Supabase'te; çay, seri ve süsler cihazda. */
(() => {
  "use strict";
  const D = window.EV_DATA;
  const KEY = "evdeyiz.v2";
  const $app = document.getElementById("app");
  const $toast = document.getElementById("toast");

  /* ───────── Storage ───────── */
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } },
    save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch { /* özel mod vb. */ } },
    clear() { try { localStorage.removeItem(KEY); } catch { /* yok say */ } }
  };
  const fresh = () => ({
    user: null, checkins: [], unread: 0, didPost: false, didMsg: 0, nightMsg: false, didLobby: false, myRooms: {},
    calc: { maas: 30000, yol: 2500, yemek: 3500, isSaat: 9, yolSaat: 2, ev: 5000 }, calcUsed: false,
    tea: 0, teaTotal: 0, inv: [], eq: {}, bulbs: 1, box: null, qa: {}, notifs: [], extra: false, listDone: false,
    tab: "feed", feedTab: "foryou", theme: "dark", blocked: {}, hidden: {}
  });
  let S = Object.assign(fresh(), store.load() || {});
  const save = () => store.save(S);

  const blankOnb = () => ({ step: 0, data: { name: "", since: "", games: [], wake: "ogle", city: "" } });
  const ui = {
    view: S.user ? "app" : "landing", onb: blankOnb(),
    room: null, game: "all", hashtag: null, search: "", allTrends: false,
    modal: null, shareText: "", cardUrl: "", confirmReset: false, shopCat: "perde", rewardText: "", rewardTea: 0,
    ptab: "posts", anon: false, mod: null, thread: null, neighbor: null, busy: false
  };

  /* ───────── Helpers ───────── */
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const today = () => ymd();
  const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
  const pick = (arr, seed) => arr[seed % arr.length];
  const nf = (n) => Math.round(n).toLocaleString("tr-TR");
  const k = (n) => n >= 1e6 ? `${(n / 1e6).toLocaleString("tr-TR", { maximumFractionDigits: 1 })} Mn` : n >= 1e4 ? `${(n / 1e3).toLocaleString("tr-TR", { maximumFractionDigits: 1 })}B` : nf(n);
  const lower = (s) => String(s).toLocaleLowerCase("tr");
  const colorOf = (h) => pick(D.colors, hash(h));
  const daire = (h) => hash(h) % 98 + 1;
  const SITE = "batuhandac.github.io/evdeyiz";
  const RULES = "https://batuhandac.github.io/evdeyiz/kurallar.html";
  const PRIVACY = "https://batuhandac.github.io/evdeyiz/gizlilik.html";
  const SUPPORT = "https://batuhandac.github.io/evdeyiz/destek.html";
  const ext = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
  function timeLine() {
    const d = new Date(), h = d.getHours();
    const hm = d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    if (h < 6) return `Gece ${hm} · apartman uyanık`;
    if (h < 12) return `Sabah ${hm} · çaylar demleniyor`;
    if (h < 18) return `${hm} · kanepe mesaisi`;
    return `Akşam ${hm} · balkonlar doluyor`;
  }
  /* Dokunsal geri bildirim: uygulamada iOS titreşimi, Android tarayıcıda kısa vibrasyon */
  function buzz(kind = "light") {
    try {
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: "haptic", kind }));
      else if (navigator.vibrate) navigator.vibrate(kind === "success" ? [12, 40, 12] : 8);
    } catch { /* yoksa sessiz geç */ }
  }
  const ago = (ms) => { const m = Math.floor((Date.now() - ms) / 60000); if (m < 1) return "şimdi"; if (m < 60) return `${m} dk`; const h = Math.floor(m / 60); return h < 24 ? `${h} sa` : `${Math.floor(h / 24)} g`; };
  const initial = (s) => esc(String(s || "?")[0].toLocaleUpperCase("tr"));
  const dayNo = () => Math.floor(new Date(today() + "T00:00:00").getTime() / 86400000);

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => $toast.classList.remove("show"), 2800);
  }
  function applyTheme() {
    if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme;
    // Uygulama kabuğu durum çubuğunu temaya göre ayarlar
    const dark = S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    if (window.ReactNativeWebView && applyTheme.last !== dark) { applyTheme.last = dark; try { window.ReactNativeWebView.postMessage(JSON.stringify({ type: "theme", dark })); } catch { /* yoksa geç */ } }
  }

  function daysAtHome(u = S.user) {
    if (!u) return 0;
    const base = (D.since.find((s) => s.id === u.since) || D.since[0]).base;
    const extra = Math.max(0, Math.round((new Date(today() + "T00:00:00") - new Date(u.joinedAt + "T00:00:00")) / 86400000));
    return base + extra;
  }
  const titleFor = (d) => D.titles.filter((t) => d >= t.min).pop();
  function streak() {
    const set = new Set(S.checkins); let d = new Date();
    if (!set.has(ymd(d))) d = addDays(d, -1);
    let n = 0; while (set.has(ymd(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  const handleOf = (name) => lower(String(name || "ev_genci").trim().replace(/\s+/g, "_")).replace(/[^\p{L}\p{N}_]/gu, "") || "ev_genci";
  const myHandle = () => R.me?.handle || S.user?.handle || handleOf(S.user?.name);
  const cardNo = (u) => { const h = u.handle || handleOf(u.name); return `EG-${pad(u.daire || 0)}-${String(hash(u.joinedAt + h) % 10000000).padStart(7, "0")}`; };

  /* ───────── Sunucu (Supabase) ───────── */
  const CFG = window.EV_CONFIG || {};
  const sb = CFG.url && CFG.key && window.supabase
    ? window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "evdeyiz.auth" } })
    : null;
  const R = {
    me: null, booting: true, offline: false,
    feed: [], feedLoaded: false, feedMore: true, newer: 0, mine: [], mineLoaded: false,
    replies: {}, room: {}, previews: {}, lobbies: [], lobbiesLoaded: false,
    notifs: [], stats: null, lit: [], newbies: [], leaders: null, qv: null,
    blocked: new Map(), hidden: new Set(), online: 0, roomOnline: {}, ann: [], seenAnn: new Set()
  };
  const myDaire = () => R.me?.daire || S.user?.daire || null;

  function errMsg(e) {
    const m = String(e?.message || e || "");
    if (m.includes("rate")) return "Biraz yavaş komşu. Birkaç dakika sonra tekrar dene.";
    if (m.includes("bad_name")) return "Bu takma ad apartman kurallarına uymuyor. Başka bir şey dene.";
    if (m.includes("bad")) return "Bu ifade apartman kurallarına uymuyor.";
    if (/fetch|network|Failed|timeout|Load failed/i.test(m)) return "Bağlantı yok gibi. İnternetini kontrol et.";
    if (m.includes("duplicate")) return "Bunu zaten yapmışsın.";
    return "Bir şey ters gitti, tekrar dene.";
  }
  async function rpc(fn, args = {}) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) throw error;
    return data;
  }
  async function q(promise) {
    const { data, error } = await promise;
    if (error) throw error;
    return data;
  }
  let rq = 0;
  function renderSoon() {
    if (rq) return;
    // Arka plandaki sekmede/WebView'da requestAnimationFrame çalışmaz; o durumda zamanlayıcıyla çiz
    const go = () => { rq = 0; if (ui.view === "app" || ui.view === "landing") render(); };
    rq = document.hidden ? setTimeout(go, 60) : requestAnimationFrame(go);
  }
  const notMuted = (uid) => !uid || !R.blocked.has(uid);

  /* Sayılar: gerçek, uydurma yok */
  const onlineNum = () => Math.max(R.online, R.me ? 1 : 0);
  function onlineLine() {
    const n = onlineNum();
    return n <= 1 ? "komşu şu an evde. Biri sensin." : "komşu şu an evde";
  }

  async function signIn() {
    const { error } = await sb.auth.signInAnonymously();
    if (error) throw error;
  }
  function setMe(me) {
    R.me = me;
    const joined = ymd(new Date(me.created_at));
    S.user = { name: me.name, since: me.since, games: me.games || [], wake: me.wake, city: me.city, joinedAt: S.user?.joinedAt && S.user.joinedAt < joined ? S.user.joinedAt : joined, daire: me.daire, handle: me.handle };
    if (me.eq && Object.keys(me.eq).length && !Object.keys(S.eq).length) S.eq = me.eq;
    save();
  }
  async function loadMe() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const me = await q(sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle());
    if (me) return me;
    if (S.user) {
      // Sunucu öncesi sürümden gelen sakin: dairesini sunucuya taşı
      return rpc("claim_profile", { p_name: S.user.name, p_handle: handleOf(S.user.name), p_since: S.user.since, p_wake: S.user.wake, p_city: S.user.city || "", p_games: S.user.games || [] });
    }
    return null;
  }

  async function boot() {
    loadStats(); loadAnn();
    if (!sb) { R.booting = false; R.offline = true; render(); return; }
    try {
      let me = await loadMe();
      if (!me && S.user) { await signIn(); me = await loadMe(); }
      if (me) {
        if (me.banned) { R.me = me; ui.view = "banned"; R.booting = false; render(); return; }
        setMe(me); ui.view = "app";
        sb.from("profiles").update({ last_seen: new Date().toISOString() }).eq("id", me.id).then(() => {});
        startLive(); refreshAll();
      } else if (ui.view === "app") ui.view = "landing";
    } catch (e) {
      R.offline = true;
      if (S.user) toast(errMsg(e));
    }
    R.booting = false;
    render();
    if (ui.view === "app") armPoll();
  }

  function refreshAll() {
    loadFeed(); loadLit(); loadLeaders(); loadQv(); loadNotifs(); loadBlocks(); loadStats(); loadAnn();
    if (S.tab === "party") loadLobbies();
    if (S.tab === "rooms") { loadPreviews(); if (ui.room) loadRoom(ui.room); }
    if (S.tab === "me") loadMine();
    if (matchMedia("(min-width: 1000px)").matches) loadNewbies();
  }

  async function loadStats() {
    if (!sb) return;
    try { R.stats = await rpc("stats"); renderSoon(); } catch { /* sayılar beklesin */ }
  }
  async function loadAnn() {
    if (!sb) return;
    try { R.ann = await q(sb.from("announcements").select("*").order("priority", { ascending: false }).order("created_at", { ascending: false }).limit(10)); renderSoon(); } catch { /* duyuru yoksa geç */ }
  }
  async function loadFeed(more = false) {
    try {
      const before = more && R.feed.length ? R.feed[R.feed.length - 1].created_at : null;
      const rows = await rpc("get_feed", { p_sort: S.feedTab === "popular" ? "popular" : "new", p_before: S.feedTab === "popular" ? null : before, p_author: null, p_limit: 30 });
      R.feed = more ? R.feed.concat(rows.filter((r) => !R.feed.some((x) => x.id === r.id))) : rows;
      R.feedMore = rows.length === 30 && S.feedTab !== "popular";
      R.feedLoaded = true; R.newer = 0; R.offline = false;
    } catch (e) { if (!R.feedLoaded) R.offline = true; if (more) toast(errMsg(e)); }
    renderSoon();
  }
  async function checkNewer() {
    if (!R.feedLoaded || S.feedTab !== "foryou") return;
    try {
      const rows = await rpc("get_feed", { p_sort: "new", p_before: null, p_author: null, p_limit: 10 });
      const top = R.feed[0]?.created_at || "";
      const n = rows.filter((r) => r.created_at > top && !r.mine).length;
      if (n !== R.newer) { R.newer = n; if (S.tab === "feed") renderSoon(); }
    } catch { /* sessiz */ }
  }
  async function loadMine() {
    try { R.mine = await rpc("get_feed", { p_sort: "new", p_before: null, p_author: R.me.id, p_limit: 60 }); R.mineLoaded = true; renderSoon(); } catch { /* sessiz */ }
  }
  async function loadReplies(id) {
    try { R.replies[id] = await rpc("get_replies", { p_post: id }); renderSoon(); } catch (e) { toast(errMsg(e)); }
  }
  async function loadRoom(id) {
    try { R.room[id] = await rpc("get_room", { p_room: id, p_limit: 80 }); renderSoon(); if (S.tab === "rooms" && ui.room === id) bottomScroll(); } catch (e) { toast(errMsg(e)); }
  }
  async function loadPreviews() {
    try { const rows = await rpc("room_previews"); R.previews = Object.fromEntries(rows.map((r) => [r.room, r])); renderSoon(); } catch { /* sessiz */ }
  }
  async function loadLobbies() {
    try { R.lobbies = await rpc("get_lobbies"); R.lobbiesLoaded = true; renderSoon(); } catch (e) { toast(errMsg(e)); }
  }
  async function loadLit() { try { R.lit = await rpc("lit_neighbors", { p_limit: 14 }); renderSoon(); } catch { /* sessiz */ } }
  async function loadNewbies() { try { R.newbies = await rpc("newcomers", { p_limit: 5 }); renderSoon(); } catch { /* sessiz */ } }
  async function loadLeaders() { try { R.leaders = await rpc("leaders"); renderSoon(); } catch { /* sessiz */ } }
  async function loadQv() { try { R.qv = await rpc("get_qvotes", { p_day: null }); renderSoon(); } catch { /* sessiz */ } }
  async function loadNotifs() {
    try { R.notifs = await q(sb.from("notifs").select("*").order("id", { ascending: false }).limit(40)); renderSoon(); } catch { /* sessiz */ }
  }
  async function loadBlocks() {
    try { const rows = await rpc("my_blocks"); R.blocked = new Map(rows.map((r) => [r.id, r.handle])); renderSoon(); } catch { /* sessiz */ }
  }

  /* Canlı: kim evde (presence), oda mesajları, bildirimler */
  let live = null;
  function startLive() {
    if (live || !R.me) return;
    live = sb.channel("apartman", { config: { presence: { key: R.me.id } } });
    live.on("presence", { event: "sync" }, () => {
      const st = live.presenceState();
      R.online = Object.keys(st).length;
      const rc = {};
      for (const k of Object.keys(st)) { const r = st[k][0]?.room; if (r) rc[r] = (rc[r] || 0) + 1; }
      R.roomOnline = rc;
      renderSoon();
    });
    live.on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (p) => onMsg(p.new));
    live.on("postgres_changes", { event: "INSERT", schema: "public", table: "notifs", filter: `user_id=eq.${R.me.id}` }, (p) => {
      if (!R.notifs.some((n) => n.id === p.new.id)) { R.notifs.unshift(p.new); buzz(); renderSoon(); }
    });
    live.subscribe((status) => { if (status === "SUBSCRIBED") track(); });
  }
  function track() {
    if (!live || !R.me) return;
    live.track({ room: S.tab === "rooms" ? ui.room : null }).catch(() => {});
  }
  const profCache = new Map();
  async function onMsg(m) {
    if (!notMuted(m.author)) return;
    let p = m.author === R.me?.id ? R.me : profCache.get(m.author);
    if (!p) {
      try { p = await q(sb.from("profiles").select("id,handle,name,daire").eq("id", m.author).maybeSingle()); } catch { p = null; }
      if (!p) return;
      profCache.set(m.author, p);
    }
    const row = { id: m.id, text: m.text, created_at: m.created_at, a_id: p.id, a_handle: p.handle, a_name: p.name, a_daire: p.daire };
    const list = R.room[m.room];
    if (list && !list.some((x) => x.id === m.id)) list.push(row);
    R.previews[m.room] = { ...(R.previews[m.room] || {}), room: m.room, text: m.text, a_handle: p.handle, created_at: m.created_at };
    const here = S.tab === "rooms" && ui.room === m.room;
    if (!here && m.author !== R.me?.id && S.myRooms?.[m.room]) S.unread = (S.unread || 0) + 1;
    if (ui.view === "app" && S.tab === "rooms") { render(); if (here) bottomScroll(); }
    else renderSoon();
  }

  let pollT = null;
  function armPoll() {
    clearInterval(pollT);
    pollT = setInterval(() => {
      if (document.hidden || ui.view !== "app") return;
      checkNewer(); loadStats();
      if (S.tab === "party") loadLobbies();
    }, 45000);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && ui.view === "app" && R.me) { refreshAll(); sb.from("profiles").update({ last_seen: new Date().toISOString() }).eq("id", R.me.id).then(() => {}); }
  });

  /* Duyuru gösterim/tıklama sayacı (sponsorlara rapor için) */
  function annSeen(a) {
    if (!a || !R.me || R.seenAnn.has(a.id)) return;
    R.seenAnn.add(a.id);
    sb.from("ann_clicks").insert({ ann_id: a.id, kind: "view" }).then(() => {});
  }
  function annHtml(a) {
    if (!a) return "";
    setTimeout(() => annSeen(a), 0);
    const label = a.kind === "sponsor" ? `Sponsorlu${a.sponsor ? " · " + esc(a.sponsor) : ""}` : a.kind === "turnuva" ? "Turnuva" : "Kapıcı duyurusu";
    const safe = /^https:\/\//.test(a.cta_url || "") ? a.cta_url : "";
    return `<section class="card ann ${a.kind}">
      <div class="ann-label">${ic(a.kind === "turnuva" ? "trophy" : a.kind === "sponsor" ? "store" : "bell", "ico-sm")}${label}</div>
      <h3>${esc(a.title)}</h3>${a.body ? `<p>${esc(a.body)}</p>` : ""}
      ${safe && a.cta_label ? `<a class="btn sm lamp" href="${esc(safe)}" target="_blank" rel="noopener sponsored" data-ann="${a.id}">${esc(a.cta_label)}</a>` : ""}
    </section>`;
  }
  const annFor = (place) => R.ann.find((a) => a.place === place);

  /* Çay: uygulamanın para birimi */
  function earn(n) { S.tea += n; S.teaTotal += n; save(); }
  function notify(text, icon = "bell", go = null) {
    S.notifs.unshift({ id: "nt" + Date.now() + Math.random().toString(36).slice(2, 6), text, icon, go, at: Date.now(), read: false });
    if (S.notifs.length > 40) S.notifs = S.notifs.slice(0, 40);
    save();
  }
  const unreadNotifs = () => S.notifs.filter((n) => !n.read).length + R.notifs.filter((n) => !n.read && notMuted(n.actor)).length;

  function calcResult(c = S.calc) {
    const netKalan = c.maas - c.yol - c.yemek;
    const saat = 22 * (Number(c.isSaat) + Number(c.yolSaat));
    const saatlik = saat > 0 ? netKalan / saat : 0;
    return { netKalan, saat, saatlik, birikim: netKalan - c.ev, evKal: saatlik < 120 };
  }
  function checklist() {
    return [
      { id: "light", label: "Pencerendeki ışığı yak", done: S.checkins.length > 0, go: "light" },
      { id: "note", label: "Panoya ilk notunu as", done: !!S.didPost, go: "compose" },
      { id: "room", label: "Bir odaya selam ver", done: S.didMsg > 0, go: "rooms" },
      { id: "shop", label: "Bakkaldan pencerene bir şey al", done: S.inv.length > 0, go: "shop" }
    ];
  }
  function earned() {
    return {
      yoklama1: S.checkins.length > 0, yoklama3: streak() >= 3,
      ogleci: ["ogle", "ikindi"].includes(S.user?.wake),
      gece: !!S.nightMsg || S.user?.wake === "yok",
      itiraf: !!S.didPost, duo: !!S.didLobby,
      red: S.calcUsed && calcResult().evKal, muhabbet: S.didMsg >= 3,
      bakkal: S.inv.length > 0, yeni: !!S.listDone
    };
  }

  /* ───────── Icons ───────── */
  const P = {
    board: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10M7 17h4"/>',
    pad: '<path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6l-.9 8.1A2.5 2.5 0 0 0 4.3 19.5c.9 0 1.7-.5 2.1-1.3L8 15h8l1.6 3.2c.4.8 1.2 1.3 2.1 1.3a2.5 2.5 0 0 0 2.5-2.8l-.9-8.1a4 4 0 0 0-4-3.6z"/>',
