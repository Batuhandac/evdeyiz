<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kapıcı odası · evdeyiz</title>
<link rel="icon" href="icon-192.png">
<style>
:root { --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --fg:#fff; --fg2:#98989F; --line:#38383A; --accent:#FFB340; --red:#FF453A; --green:#30D158; }
@media (prefers-color-scheme: light) { :root { --bg:#F2F2F7; --card:#fff; --card2:#F2F2F7; --fg:#000; --fg2:#6C6C70; --line:#D1D1D6; --accent:#B86E00; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 900px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 60px; }
h1 { font-size: 28px; margin: 8px 0 4px; letter-spacing: -.02em; }
h2 { font-size: 18px; margin: 28px 0 10px; }
.muted { color: var(--fg2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: 14px; padding: 14px; }
.tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--fg2); font-size: 13px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--card2); color: var(--fg2); }
.tag.red { color: var(--red); } .tag.green { color: var(--green); }
.content { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
button { font: inherit; border: 0; border-radius: 99px; padding: 8px 14px; background: var(--card2); color: var(--fg); font-weight: 600; cursor: pointer; }
button.accent { background: var(--accent); color: #000; } button.red { color: var(--red); }
form { display: grid; gap: 10px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--fg2); }
input, textarea, select { font: inherit; color: var(--fg); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card2); padding: 10px 16px; border-radius: 99px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<main id="root"><p class="muted">Kapıcı odası açılıyor…</p></main>
<div id="toast"></div>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const C = window.EV_CONFIG;
  const sb = window.supabase.createClient(C.url, C.key, { auth: { persistSession: true, storageKey: "evdeyiz.auth" } });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2500); };
  const KIND = { post: "Not", reply: "Yorum", lobby: "Oyun ilanı", message: "Oda mesajı", user: "Kişi" };
  let me = null;

  async function load() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return gate("Önce bu tarayıcıda evdeyiz'e gir (batuhandac.github.io/evdeyiz), sonra bu sayfayı yenile.");
    const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    me = data;
    if (!me) return gate("Bu tarayıcıda evdeyiz dairen yok. Önce evdeyiz'e gir.");
    if (!me.is_admin) return gate(`Bu sayfa apartman yönetimi içindir. Dairen: <b>${me.daire}</b> (@${esc(me.handle)}). Yönetici yapılman için bu bilgiyi ilet.`);
    render();
  }
  function gate(msg) { $("root").innerHTML = `<h1>Kapıcı odası</h1><p class="muted">${msg}</p>`; }

  async function render() {
    const [{ data: ov, error: e1 }, { data: reps, error: e2 }] = await Promise.all([sb.rpc("admin_overview"), sb.rpc("admin_reports")]);
    if (e1 || e2) return gate("Veriler alınamadı: " + esc((e1 || e2).message));
    const t = (v, l) => `<div class="tile"><b>${v ?? "-"}</b><span>${l}</span></div>`;
    $("root").innerHTML = `
      <h1>Kapıcı odası</h1><p class="muted">@${esc(me.handle)} · Daire ${me.daire}</p>
      <div class="tiles">${t(ov.residents, "Sakin")}${t(ov.new_today, "Son 24 saatte yeni")}${t(ov.dau, "Günlük aktif")}${t(ov.wau, "Haftalık aktif")}${t(ov.d1_retention == null ? "-" : "%" + ov.d1_retention, "Ertesi gün dönen")}${t(ov.lit_today, "Bugün yanan ışık")}${t(ov.posts_today, "24 saatte not")}${t(ov.messages_today, "24 saatte mesaj")}${t(ov.open_reports, "Açık şikayet")}</div>
      <h2>Şikayetler</h2>
      ${reps.length ? reps.map((r) => `<div class="card">
        <div class="row"><span class="tag">${KIND[r.kind] || r.kind}</span><span class="tag red">${r.reporters} şikayet</span>${r.hidden ? '<span class="tag">Gizli</span>' : ""}${r.banned ? '<span class="tag red">Banlı</span>' : ""}<span class="muted">@${esc(r.target_handle || "?")} · ${new Date(r.first_at).toLocaleString("tr-TR")}</span></div>
        <div class="content">${esc(r.content || "(silinmiş)")}</div>
        <div class="muted" style="font-size:13px">Sebep: ${esc((r.reasons || []).join(", "))}</div>
        <div class="row" style="margin-top:10px">
          ${r.kind !== "user" ? `<button data-act="hide" data-k="${r.kind}" data-t="${esc(r.target_id)}">Gizle</button>` : ""}
          <button data-act="dismiss" data-k="${r.kind}" data-t="${esc(r.target_id)}">Sorun yok</button>
          ${r.target_user ? `<button class="red" data-act="${r.banned ? "unban" : "ban"}" data-k="${r.kind}" data-t="${esc(r.target_id)}" data-u="${r.target_user}">${r.banned ? "Banı kaldır" : "Apartmandan çıkar"}</button>` : ""}
        </div></div>`).join("") : `<p class="muted">Açık şikayet yok.</p>`}
      <h2>Duyurular ve sponsorlar</h2>
      ${(ov.ann || []).map((a) => `<div class="card"><div class="row"><span class="tag ${a.active ? "green" : ""}">${a.active ? "Yayında" : "Kapalı"}</span><span class="tag">${esc(a.kind)}</span><b>${esc(a.title)}</b>${a.sponsor ? `<span class="muted">${esc(a.sponsor)}</span>` : ""}</div>
        <div class="row muted" style="margin-top:6px">${a.views} gösterim · ${a.clicks} tıklama${a.views ? ` · %${Math.round((100 * a.clicks) / a.views)} tıklanma` : ""}</div>
        <div class="row" style="margin-top:8px"><button data-ann="${a.id}" data-on="${a.active ? 0 : 1}">${a.active ? "Yayından kaldır" : "Yayına al"}</button><button class="red" data-del="${a.id}">Sil</button></div></div>`).join("") || `<p class="muted">Henüz duyuru yok.</p>`}
      <div class="card"><form id="ann-form">
        <div class="grid2">
          <label>Tür<select name="kind"><option value="duyuru">Kapıcı duyurusu</option><option value="sponsor">Sponsorlu</option><option value="turnuva">Turnuva</option></select></label>
          <label>Yer<select name="place"><option value="pano">Pano (ışık kartının altı)</option><option value="oyun">Oyun odası</option><option value="bakkal">Bakkal</option></select></label>
        </div>
        <label>Başlık<input name="title" required maxlength="80" placeholder="ör. Cuma gecesi LoL turnuvası"></label>
        <label>Metin<textarea name="body" rows="2" maxlength="200"></textarea></label>
        <div class="grid2">
          <label>Düğme yazısı<input name="cta_label" maxlength="30" placeholder="ör. Kayıt ol"></label>
          <label>Düğme bağlantısı (https)<input name="cta_url" type="url" placeholder="https://"></label>
        </div>
        <div class="grid2">
          <label>Sponsor adı (sponsorluysa)<input name="sponsor" maxlength="40"></label>
          <label>Bitiş (boşsa süresiz)<input name="ends_at" type="datetime-local"></label>
        </div>
        <button class="accent" type="submit">Duyuruyu yayınla</button>
      </form></div>`;
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (b) {
      const { error } = await sb.rpc("admin_act", { p_kind: b.dataset.k, p_target: b.dataset.t, p_action: b.dataset.act, p_user: b.dataset.u || null });
      toast(error ? "Olmadı: " + error.message : "Tamam"); render(); return;
    }
    const a = e.target.closest("button[data-ann]");
    if (a) { const { error } = await sb.from("announcements").update({ active: a.dataset.on === "1" }).eq("id", a.dataset.ann); toast(error ? error.message : "Güncellendi"); render(); return; }
    const d = e.target.closest("button[data-del]");
    if (d && confirm("Bu duyuru silinsin mi?")) { const { error } = await sb.from("announcements").delete().eq("id", d.dataset.del); toast(error ? error.message : "Silindi"); render(); }
  });
  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "ann-form") return;
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (f.cta_url && !/^https:\/\//.test(f.cta_url)) { toast("Bağlantı https:// ile başlamalı"); return; }
    const row = { kind: f.kind, place: f.place, title: f.title.trim(), body: f.body.trim(), cta_label: f.cta_label.trim() || null, cta_url: f.cta_url.trim() || null, sponsor: f.sponsor.trim() || null, ends_at: f.ends_at ? new Date(f.ends_at).toISOString() : null };
    const { error } = await sb.from("announcements").insert(row);
    toast(error ? "Olmadı: " + error.message : "Yayında"); if (!error) render();
  });
  load();
})();
</script>
</body>
</html>
